<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="sans-serif">
  <!-- akser -->
  <line x1="60" y1="300" x2="440" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="60" y2="40" stroke="#6b7280" stroke-width="1.5"/>
  <!-- x-akse tikk og etiketter -->
  <g fill="#6b7280" font-size="12" text-anchor="middle">
    <line x1="123" y1="300" x2="123" y2="304" stroke="#6b7280"/><text x="123" y="318">1</text>
    <line x1="187" y1="300" x2="187" y2="304" stroke="#6b7280"/><text x="187" y="318">2</text>
    <line x1="250" y1="300" x2="250" y2="304" stroke="#6b7280"/><text x="250" y="318">3</text>
    <line x1="313" y1="300" x2="313" y2="304" stroke="#6b7280"/><text x="313" y="318">4</text>
    <line x1="377" y1="300" x2="377" y2="304" stroke="#6b7280"/><text x="377" y="318">5</text>
  </g>
  <!-- y-akse tikk og etiketter -->
  <g fill="#6b7280" font-size="12" text-anchor="end">
    <line x1="56" y1="253" x2="60" y2="253" stroke="#6b7280"/><text x="52" y="257">2</text>
    <line x1="56" y1="205" x2="60" y2="205" stroke="#6b7280"/><text x="52" y="209">4</text>
    <line x1="56" y1="158" x2="60" y2="158" stroke="#6b7280"/><text x="52" y="162">6</text>
    <line x1="56" y1="111" x2="60" y2="111" stroke="#6b7280"/><text x="52" y="115">8</text>
    <line x1="56" y1="64" x2="60" y2="64" stroke="#6b7280"/><text x="52" y="68">10</text>
  </g>
  <!-- stiplet hjelpelinje: tyngdepunktet (xbar=3, Ybar=6,2) -->
  <line x1="250" y1="300" x2="250" y2="154" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="60" y1="154" x2="250" y2="154" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- regresjonslinje  yhat = 0,5 + 1,9 x -->
  <line x1="92" y1="266" x2="408" y2="41" stroke="#2563eb" stroke-width="2"/>
  <!-- datapunkter -->
  <g fill="#111827">
    <circle cx="123" cy="241" r="4"/>
    <circle cx="187" cy="203" r="4"/>
    <circle cx="250" cy="153" r="4"/>
    <circle cx="313" cy="104" r="4"/>
    <circle cx="377" cy="66" r="4"/>
  </g>
  <!-- tyngdepunkt markert -->
  <circle cx="250" cy="154" r="3.5" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <!-- aksetitler -->
  <text x="250" y="342" fill="#6b7280" font-size="13" text-anchor="middle">Konsentrasjon x (mg/L)</text>
  <text x="18" y="170" fill="#6b7280" font-size="13" text-anchor="middle" transform="rotate(-90 18 170)">Absorbans Y</text>
  <!-- linjeetikett -->
  <text x="360" y="70" fill="#2563eb" font-size="12" text-anchor="end">Y-hatt = 0,5 + 1,9x</text>
</svg>
