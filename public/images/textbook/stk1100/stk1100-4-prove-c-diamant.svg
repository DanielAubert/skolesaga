<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif">
  <title>Stoetten til (U,V) = (X+Y, X-Y) er en diamant med hjoerner i (0,0) (1,1) (2,0) (1,-1)</title>
  <!-- diamond support -->
  <polygon points="70,200 230,110 390,200 230,290" fill="#3b82f6" fill-opacity="0.16" stroke="#2563eb" stroke-width="2"/>
  <!-- axes -->
  <line x1="55" y1="200" x2="415" y2="200" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="305" x2="70" y2="90" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="415,200 407,196 407,204" fill="#6b7280"/>
  <polygon points="70,90 66,98 74,98" fill="#6b7280"/>
  <!-- vertical scan strip at u = 0.6 -->
  <line x1="166" y1="146" x2="166" y2="254" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 4"/>
  <!-- ticks -->
  <line x1="230" y1="200" x2="230" y2="205" stroke="#6b7280" stroke-width="1"/>
  <line x1="390" y1="200" x2="390" y2="205" stroke="#6b7280" stroke-width="1"/>
  <line x1="70" y1="110" x2="65" y2="110" stroke="#6b7280" stroke-width="1"/>
  <line x1="70" y1="290" x2="65" y2="290" stroke="#6b7280" stroke-width="1"/>
  <text x="226" y="220" fill="#6b7280" font-size="14">1</text>
  <text x="386" y="220" fill="#6b7280" font-size="14">2</text>
  <text x="55" y="115" fill="#6b7280" font-size="14">1</text>
  <text x="50" y="295" fill="#6b7280" font-size="14">-1</text>
  <text x="58" y="216" fill="#6b7280" font-size="13">0</text>
  <text x="418" y="205" fill="#6b7280" font-size="15">u</text>
  <text x="60" y="88" fill="#6b7280" font-size="15">v</text>
  <!-- labels -->
  <text x="205" y="205" fill="#1d4ed8" font-size="13">stoette</text>
  <text x="176" y="140" fill="#dc2626" font-size="12">fast u</text>
</svg>
