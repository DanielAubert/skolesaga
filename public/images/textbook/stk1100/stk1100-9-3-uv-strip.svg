<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif">
  <title>Stoetten til (U,V): halvstripen u er positiv og v mellom 0 og 1</title>
  <!-- shaded strip 0 < v < 1, u > 0 -->
  <rect x="70" y="120" width="320" height="180" fill="#3b82f6" fill-opacity="0.16" stroke="none"/>
  <!-- dashed line v = 1 -->
  <line x1="70" y1="120" x2="400" y2="120" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- axes -->
  <line x1="70" y1="300" x2="430" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="70" y2="60" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="430,300 422,296 422,304" fill="#6b7280"/>
  <polygon points="70,60 66,68 74,68" fill="#6b7280"/>
  <!-- tick for v = 1 -->
  <line x1="70" y1="120" x2="65" y2="120" stroke="#6b7280" stroke-width="1"/>
  <text x="52" y="125" fill="#6b7280" font-size="14">1</text>
  <text x="58" y="316" fill="#6b7280" font-size="14">0</text>
  <text x="435" y="305" fill="#6b7280" font-size="15">u</text>
  <text x="58" y="55" fill="#6b7280" font-size="15">v</text>
  <!-- region label -->
  <text x="150" y="220" fill="#1d4ed8" font-size="16">0 &lt; v &lt; 1,  u &gt; 0</text>
  <text x="150" y="242" fill="#1d4ed8" font-size="13">(stoetten til (U,V))</text>
  <text x="300" y="112" fill="#2563eb" font-size="14">v = 1</text>
  <!-- suggestion of unbounded u -->
  <text x="392" y="292" fill="#9ca3af" font-size="20">&#8594;</text>
</svg>
