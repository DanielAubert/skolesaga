<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif">
  <title>Trekantstoette null mindre enn x mindre enn y mindre enn 1 med null-omraadet markert</title>
  <!-- support triangle 0 < x < y < 1 (upper-left) where f > 0 -->
  <polygon points="70,300 270,100 70,100" fill="#f59e0b" fill-opacity="0.20" stroke="none"/>
  <!-- null region x > y (lower-right) where f = 0 -->
  <polygon points="70,300 270,300 270,100" fill="#ef4444" fill-opacity="0.10" stroke="none"/>
  <!-- unit square outline -->
  <rect x="70" y="100" width="200" height="200" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- diagonal y = x -->
  <line x1="70" y1="300" x2="270" y2="100" stroke="#b45309" stroke-width="2"/>
  <!-- axes -->
  <line x1="70" y1="300" x2="410" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="70" y2="60" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="410,300 402,296 402,304" fill="#6b7280"/>
  <polygon points="70,60 66,68 74,68" fill="#6b7280"/>
  <!-- tick labels -->
  <line x1="270" y1="300" x2="270" y2="305" stroke="#6b7280" stroke-width="1"/>
  <line x1="70" y1="100" x2="65" y2="100" stroke="#6b7280" stroke-width="1"/>
  <text x="266" y="320" fill="#6b7280" font-size="14">1</text>
  <text x="55" y="105" fill="#6b7280" font-size="14">1</text>
  <text x="60" y="320" fill="#6b7280" font-size="14">0</text>
  <text x="415" y="305" fill="#6b7280" font-size="15">x</text>
  <text x="60" y="55" fill="#6b7280" font-size="15">y</text>
  <!-- region labels -->
  <text x="92" y="165" fill="#b45309" font-size="14">stoette:</text>
  <text x="92" y="185" fill="#b45309" font-size="14">f &#62; 0</text>
  <text x="100" y="205" fill="#b45309" font-size="12">(0 &#60; x &#60; y &#60; 1)</text>
  <text x="188" y="268" fill="#dc2626" font-size="14">null-omraadet</text>
  <text x="205" y="286" fill="#dc2626" font-size="13">f = 0</text>
  <text x="212" y="152" fill="#b45309" font-size="13" transform="rotate(-45 212 152)">y = x</text>
</svg>
