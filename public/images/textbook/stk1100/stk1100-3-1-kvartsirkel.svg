<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif">
  <title>Kvartsirkel x-kvadrat pluss y-kvadrat mindre enn eller lik r-kvadrat paa enhetskvadratet</title>
  <!-- shaded quarter disk of radius 1 (=200px) centred at origin -->
  <path d="M 70 300 L 270 300 A 200 200 0 0 0 70 100 Z" fill="#10b981" fill-opacity="0.18" stroke="none"/>
  <!-- unit square outline -->
  <rect x="70" y="100" width="200" height="200" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- circle arc -->
  <path d="M 270 300 A 200 200 0 0 0 70 100" fill="none" stroke="#059669" stroke-width="2"/>
  <!-- radius helper line to arc at 45 degrees -->
  <line x1="70" y1="300" x2="211" y2="159" stroke="#059669" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="130" y="215" fill="#047857" font-size="13" transform="rotate(-45 130 215)">r = 1</text>
  <!-- axes -->
  <line x1="70" y1="300" x2="410" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="70" y2="60" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="410,300 402,296 402,304" fill="#6b7280"/>
  <polygon points="70,60 66,68 74,68" fill="#6b7280"/>
  <!-- tick labels -->
  <line x1="270" y1="300" x2="270" y2="305" stroke="#6b7280" stroke-width="1"/>
  <line x1="70" y1="100" x2="65" y2="100" stroke="#6b7280" stroke-width="1"/>
  <text x="266" y="320" fill="#6b7280" font-size="14">1</text>
  <text x="55" y="105" fill="#6b7280" font-size="14">1</text>
  <text x="60" y="320" fill="#6b7280" font-size="14">0</text>
  <text x="415" y="305" fill="#6b7280" font-size="15">x</text>
  <text x="60" y="55" fill="#6b7280" font-size="15">y</text>
  <!-- region label -->
  <text x="95" y="255" fill="#047857" font-size="15">x&#178; + y&#178; &#8804; 1</text>
</svg>
