<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif">
  <!-- Integrasjonsområdet 0 < v < u for marginaliseringen f_U(u) -->
  <!-- skyggelagt trekant: v=0 (bunn), v=u (hypotenuse), u=U0 (høyre strek) -->
  <polygon points="60,300 300,300 300,60" fill="#6b7280" fill-opacity="0.16" stroke="none"/>

  <!-- akser -->
  <line x1="60" y1="300" x2="450" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="60" y2="40" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="450,300 440,295 440,305" fill="#6b7280"/>
  <polygon points="60,40 55,50 65,50" fill="#6b7280"/>
  <text x="455" y="304" font-size="16" fill="#6b7280" font-style="italic">u</text>
  <text x="52" y="36" font-size="16" fill="#6b7280" font-style="italic">v</text>
  <text x="46" y="316" font-size="13" fill="#6b7280">0</text>

  <!-- linjen v = u -->
  <line x1="60" y1="300" x2="320" y2="40" stroke="#374151" stroke-width="2"/>
  <text x="300" y="52" font-size="15" fill="#374151" font-style="italic">v = u</text>

  <!-- vertikal integrasjonsstripe ved fast u (dashed) -->
  <line x1="200" y1="300" x2="200" y2="160" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="200,166 196,176 204,176" fill="#374151"/>
  <text x="176" y="318" font-size="13" fill="#374151" font-style="italic">u</text>
  <text x="208" y="235" font-size="13" fill="#374151">integrer v: 0 → u</text>

  <!-- områdeetikett -->
  <text x="150" y="285" font-size="15" fill="#374151">0 &lt; v &lt; u</text>

  <!-- forklaring -->
  <text x="60" y="345" font-size="13" fill="#6b7280">Området der simultantettheten er positiv etter byttet (U,V) = (X+Y, X).</text>
</svg>
