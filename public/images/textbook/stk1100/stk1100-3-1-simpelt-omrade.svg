<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif">
  <title>Y-simpelt integrasjonsomraade med indre og ytre grenser</title>
  <!-- shaded region between y = x (nedre) and y = 1 (oevre) over x in (0,1) -->
  <polygon points="70,300 270,100 70,100" fill="#8b5cf6" fill-opacity="0.16" stroke="none"/>
  <!-- unit square outline -->
  <rect x="70" y="100" width="200" height="200" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- lower boundary y = x -->
  <line x1="70" y1="300" x2="270" y2="100" stroke="#7c3aed" stroke-width="2"/>
  <!-- upper boundary y = 1 -->
  <line x1="70" y1="100" x2="270" y2="100" stroke="#7c3aed" stroke-width="2"/>
  <!-- vertical scan line at x = 0.4 (px 150) from y=x to y=1 -->
  <line x1="150" y1="220" x2="150" y2="100" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="150" cy="220" r="3" fill="#dc2626"/>
  <circle cx="150" cy="100" r="3" fill="#dc2626"/>
  <text x="158" y="175" fill="#dc2626" font-size="13">y: fra x til 1</text>
  <!-- axes -->
  <line x1="70" y1="300" x2="410" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="70" y2="60" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="410,300 402,296 402,304" fill="#6b7280"/>
  <polygon points="70,60 66,68 74,68" fill="#6b7280"/>
  <!-- tick labels -->
  <line x1="270" y1="300" x2="270" y2="305" stroke="#6b7280" stroke-width="1"/>
  <line x1="150" y1="300" x2="150" y2="305" stroke="#6b7280" stroke-width="1"/>
  <line x1="70" y1="100" x2="65" y2="100" stroke="#6b7280" stroke-width="1"/>
  <text x="266" y="320" fill="#6b7280" font-size="14">1</text>
  <text x="143" y="320" fill="#dc2626" font-size="13">x</text>
  <text x="55" y="105" fill="#6b7280" font-size="14">1</text>
  <text x="60" y="320" fill="#6b7280" font-size="14">0</text>
  <text x="415" y="305" fill="#6b7280" font-size="15">x</text>
  <text x="60" y="55" fill="#6b7280" font-size="15">y</text>
  <!-- boundary labels -->
  <text x="210" y="152" fill="#7c3aed" font-size="13" transform="rotate(-45 210 152)">y = x</text>
  <text x="185" y="93" fill="#7c3aed" font-size="13">y = 1</text>
  <text x="90" y="130" fill="#6d28d9" font-size="14">omraadet A</text>
</svg>
