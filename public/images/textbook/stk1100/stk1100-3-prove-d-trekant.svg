<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif">
  <title>Stoette 0 mindre enn y mindre enn x mindre enn 1 med delomraade Y stoerre enn en halv</title>
  <!-- full support triangle 0<y<x<1: (0,0),(1,0),(1,1) -->
  <polygon points="70,300 270,300 270,100" fill="#3b82f6" fill-opacity="0.10" stroke="none"/>
  <!-- sub-region y>1/2 within support: (0.5,0.5),(1,0.5),(1,1) -->
  <polygon points="170,200 270,200 270,100" fill="#3b82f6" fill-opacity="0.30" stroke="none"/>
  <!-- unit square outline -->
  <rect x="70" y="100" width="200" height="200" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- diagonal y = x -->
  <line x1="70" y1="300" x2="270" y2="100" stroke="#2563eb" stroke-width="2"/>
  <!-- dashed line y = 1/2 -->
  <line x1="70" y1="200" x2="270" y2="200" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 4"/>
  <!-- axes -->
  <line x1="70" y1="300" x2="410" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="70" y2="60" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="410,300 402,296 402,304" fill="#6b7280"/>
  <polygon points="70,60 66,68 74,68" fill="#6b7280"/>
  <!-- ticks -->
  <line x1="270" y1="300" x2="270" y2="305" stroke="#6b7280" stroke-width="1"/>
  <line x1="70" y1="100" x2="65" y2="100" stroke="#6b7280" stroke-width="1"/>
  <line x1="70" y1="200" x2="65" y2="200" stroke="#6b7280" stroke-width="1"/>
  <text x="266" y="320" fill="#6b7280" font-size="14">1</text>
  <text x="55" y="105" fill="#6b7280" font-size="14">1</text>
  <text x="48" y="205" fill="#6b7280" font-size="13">&#189;</text>
  <text x="60" y="320" fill="#6b7280" font-size="14">0</text>
  <text x="415" y="305" fill="#6b7280" font-size="15">x</text>
  <text x="60" y="55" fill="#6b7280" font-size="15">y</text>
  <!-- labels -->
  <text x="205" y="285" fill="#1d4ed8" font-size="13">stoette</text>
  <text x="200" y="300" fill="#1d4ed8" font-size="12">0 &lt; y &lt; x &lt; 1</text>
  <text x="222" y="160" fill="#1d4ed8" font-size="13">Y &gt; &#189;</text>
  <text x="150" y="130" fill="#2563eb" font-size="13" transform="rotate(-45 150 130)">y = x</text>
</svg>
