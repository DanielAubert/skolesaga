<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 412" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjonen Y vannrett og renta i loddrett. En fallende IS-kurve og en stigende renteregelkurve krysser i punkt A. Renteregelen skifter oppover fordi krona er svekket. IS er tegnet med to stiplede alternativer på hver sin side av utgangskurven: ett mot høyre fordi konkurranseevnen bedres, og ett mot venstre fordi veksten ute er svakere. Den nye likevekten B ligger på den nye renteregelkurven, klart høyere enn A. En tosidig vannrett pil gjennom B og et spørsmålstegn viser at retningen på produksjonen er ubestemt. Stiplede hjelpelinjer går fra A og B til begge akser.">
  <rect width="440" height="412" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">i</text>
  <line x1="215.5" y1="300.0" x2="215.5" y2="49.2" stroke="#666" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="206.5" y="334.0" font-size="12.5" fill="#666" font-style="italic">Y<tspan font-size="9" dy="-5">n</tspan></text>
  <line x1="70.0" y1="72.3" x2="283.3" y2="290.1" stroke="#c0392b" stroke-width="2.6"/>
  <text x="290.3" y="295.1" font-size="12" fill="#c0392b" font-style="italic">IS<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="144.3" y1="49.2" x2="380.3" y2="290.1" stroke="#bf8700" stroke-width="2.0" stroke-dasharray="7 4"/>
  <text x="374.3" y="282.1" font-size="10.5" fill="#bf8700" font-style="italic" text-anchor="end">IS høyre</text>
  <line x1="70.0" y1="171.3" x2="186.4" y2="290.1" stroke="#1a7f37" stroke-width="2.0" stroke-dasharray="7 4"/>
  <text x="192.4" y="284.1" font-size="10.5" fill="#1a7f37" font-style="italic">IS venstre</text>
  <line x1="70.0" y1="286.8" x2="390.0" y2="69.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="397.0" y="74.0" font-size="12" fill="#2471a3" font-style="italic">RR<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="70.0" y1="204.3" x2="297.9" y2="49.2" stroke="#8250df" stroke-width="2.6"/>
  <text x="291.9" y="40.2" font-size="12" fill="#8250df" font-style="italic" text-anchor="end">RR<tspan font-size="9" dy="4">1</tspan></text>
  <line x1="254.2" y1="157.4" x2="254.2" y2="84.9" stroke="#8250df" stroke-width="2.0"/>
  <polygon points="254.2,84.9 257.7,91.9 250.7,91.9" fill="#8250df"/>
  <line x1="89.4" y1="151.5" x2="205.8" y2="151.5" stroke="#222" stroke-width="1.6"/>
  <polygon points="89.4,151.5 95.9,148.3 95.9,154.8" fill="#222"/>
  <polygon points="205.8,151.5 199.3,154.8 199.3,148.3" fill="#222"/>
  <line x1="147.6" y1="151.5" x2="147.6" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="151.5" x2="147.6" y2="151.5" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="147.6" cy="151.5" r="4" fill="#8250df"/>
  <text x="123.6" y="169.5" font-size="15" fill="#8250df" font-weight="bold">B</text>
  <text x="34.0" y="156.5" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">B</tspan></text>
  <line x1="196.1" y1="201.0" x2="196.1" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="201.0" x2="196.1" y2="201.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="196.1" cy="201.0" r="4" fill="#222"/>
  <text x="207.1" y="219.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <text x="187.1" y="317.0" font-size="12.5" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">A</tspan></text>
  <text x="34.0" y="206.0" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">A</tspan></text>
  <text x="216.8" y="156.5" font-size="20" fill="#222" font-weight="bold">?</text>
  <text x="70.0" y="352.0" font-size="11.5" fill="#222" font-weight="bold">Renta stiger entydig — produksjonen kan gå begge veier</text>
  <text x="70.0" y="372.0" font-size="10.5" fill="#8250df" font-style="italic">RR<tspan font-size="8" dy="4">0</tspan><tspan font-size="10.5" dy="-4"> → RR</tspan><tspan font-size="8" dy="4">1</tspan><tspan font-size="10.5" dy="-4">: Z</tspan><tspan font-size="8" dy="-5">E</tspan><tspan font-size="10.5" dy="5"> opp (svakere krone)</tspan></text>
  <text x="70.0" y="390.0" font-size="10.5" fill="#bf8700" font-style="italic">IS høyre: bedret konkurranseevne</text>
  <text x="266.0" y="390.0" font-size="10.5" fill="#1a7f37" font-style="italic">IS venstre: svakere vekst ute</text>
</svg>
