<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 412" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjonen Y vannrett og renta i loddrett. En fallende IS-kurve og en stigende renteregelkurve krysser i punkt A. Renteregelen skifter oppover fordi krona er svekket. IS er tegnet med to stiplede alternativer på hver sin side av utgangskurven: ett mot høyre fordi konkurranseevnen bedres, og ett mot venstre fordi veksten ute er svakere. Hvert alternativ krysser den nye renteregelkurven i sin egen likevekt: B-én ligger opp til høyre for A, B-to ned til venstre for A. En vannrett dobbeltpil nederst og en loddrett dobbeltpil til høyre viser at både produksjonen og renta kan gå begge veier. Stiplede hjelpelinjer går fra alle tre punktene til begge akser.">
  <rect width="440" height="412" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
