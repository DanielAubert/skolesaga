<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjon Y vannrett og sparing og investering loddrett. To sparestråler fra origo, den nye brattere enn den gamle, og én investeringslinje som starter i I-null og ligger i ro. Likevekten flytter seg fra A til B, som ligger til venstre for og lavere enn A. En loddrett stiplet linje til høyre viser produksjonen ved full sysselsetting, og avstanden fra den gamle likevekten dit er merket ledighetsgap.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="12" fill="#222">sparing og investering</text>
  <line x1="70.0" y1="240.0" x2="360.4" y2="108.0" stroke="#c0392b" stroke-width="2.4"/>
  <text x="364.4" y="113.0" font-size="12" fill="#c0392b" font-style="italic">I = I<tspan font-size="9" dy="4">0</tspan><tspan font-size="12" dy="-4">+αY</tspan></text>
  <circle cx="70.0" cy="240.0" r="3.5" fill="#c0392b"/>
  <text x="40.0" y="245.0" font-size="13" fill="#c0392b" font-style="italic">I<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="70.0" y1="300.0" x2="360.4" y2="80.0" stroke="#2471a3" stroke-width="2.4"/>
  <line x1="70.0" y1="300.0" x2="286.9" y2="70.0" stroke="#8250df" stroke-width="2.4"/>
  <text x="364.4" y="85.0" font-size="13" fill="#2471a3" font-style="italic">S = γ<tspan font-size="9" dy="4">0</tspan><tspan font-size="13" dy="-4">Y</tspan></text>
  <text x="290.9" y="74.0" font-size="13" fill="#8250df" font-style="italic">S = γ<tspan font-size="9" dy="4">1</tspan><tspan font-size="13" dy="-4">Y</tspan></text>
  <line x1="249.8" y1="163.8" x2="249.8" y2="109.2" stroke="#8250df" stroke-width="1.5"/>
  <polygon points="249.8,109.2 253.3,116.2 246.3,116.2" fill="#8250df"/>
  <line x1="268.0" y1="150.0" x2="268.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="150.0" x2="268.0" y2="150.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="268.0" cy="150.0" r="4" fill="#222"/>
  <text x="276.0" y="142.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <line x1="169.0" y1="195.0" x2="169.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="195.0" x2="169.0" y2="195.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="169.0" cy="195.0" r="4" fill="#222"/>
  <text x="151.0" y="188.0" font-size="15" fill="#222" font-weight="bold">B</text>
  <text x="161.0" y="317.0" font-size="13" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">1</tspan></text>
  <text x="260.0" y="317.0" font-size="13" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="105.0" y1="150.0" x2="105.0" y2="195.0" stroke="#222" stroke-width="1.3"/>
  <polygon points="105.0,150.0 108.2,156.5 101.8,156.5" fill="#222"/>
  <polygon points="105.0,195.0 101.8,188.5 108.2,188.5" fill="#222"/>
  <text x="112.0" y="176.5" font-size="10" fill="#666" font-style="italic">sparingen faller</text>
  <line x1="340.6" y1="300.0" x2="340.6" y2="120.0" stroke="#666" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="330.6" y="317.0" font-size="13" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">F</tspan></text>
  <text transform="rotate(-90 334.6 244.0)" x="334.6" y="244.0" font-size="10.5" fill="#666">full sysselsetting</text>
  <line x1="268.0" y1="258.0" x2="340.6" y2="258.0" stroke="#222" stroke-width="1.4"/>
  <polygon points="268.0,258.0 274.5,254.8 274.5,261.2" fill="#222"/>
  <polygon points="340.6,258.0 334.1,261.2 334.1,254.8" fill="#222"/>
  <text x="304.3" y="250.0" font-size="11" fill="#222" font-style="italic" text-anchor="middle">ledighetsgap</text>
</svg>
