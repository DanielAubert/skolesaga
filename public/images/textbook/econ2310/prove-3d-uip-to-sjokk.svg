<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Samme diagram med norsk rente vannrett og valutakursen loddrett, og tre parallelle fallende linjer med samme helning. Den nederste er utgangspunktet, med punkt A ved startrenten. Den midterste er skjøvet opp fordi den utenlandske renten stiger, med mellompunktet M rett over A. Den øverste er skjøvet enda et hakk opp fordi forventet langsiktskurs stiger etter nedjusterte utsikter, med punkt B rett over M. Ved uendret norsk rente ender kursen i B, klart høyere enn i A: begge sjokkene trekker samme vei, så samleteffekten kan signeres — krona svekkes. Stiplede hjelpelinjer går fra alle tre punktene til begge akser.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">i</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">E</text>
  <line x1="50.0" y1="290.0" x2="50.0" y2="225.0" stroke="#666" stroke-width="1.4"/>
  <polygon points="50.0,225.0 53.5,232.0 46.5,232.0" fill="#666"/>
  <text transform="rotate(-90 44 294.0)" x="44" y="294.0" font-size="10.5" fill="#666" font-style="italic">svakere krone</text>
  <line x1="70.0" y1="49.2" x2="358.0" y2="213.4" stroke="#bf8700" stroke-width="2.4"/>
  <line x1="70.0" y1="87.2" x2="358.0" y2="251.4" stroke="#8250df" stroke-width="2.2"/>
  <line x1="70.0" y1="125.2" x2="358.0" y2="289.4" stroke="#2471a3" stroke-width="2.4"/>
  <text x="362.0" y="217.4" font-size="11" fill="#bf8700" font-style="italic">E<tspan font-size="8" dy="-5">e</tspan><tspan font-size="11" dy="5"> opp</tspan></text>
  <text x="362.0" y="255.4" font-size="11" fill="#8250df" font-style="italic">i<tspan font-size="8" dy="-5">F</tspan><tspan font-size="11" dy="5"> opp</tspan></text>
  <text x="362.0" y="291.4" font-size="11" fill="#2471a3" font-style="italic">utgangspunkt</text>
  <line x1="190.0" y1="117.6" x2="190.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="117.6" x2="190.0" y2="117.6" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="190.0" cy="117.6" r="4" fill="#222"/>
  <text x="200.0" y="109.6" font-size="15" fill="#222" font-weight="bold">B</text>
  <line x1="190.0" y1="155.6" x2="190.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="155.6" x2="190.0" y2="155.6" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="190.0" cy="155.6" r="4" fill="#222"/>
  <text x="171.0" y="172.6" font-size="15" fill="#222" font-weight="bold">M</text>
  <line x1="190.0" y1="193.6" x2="190.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="193.6" x2="190.0" y2="193.6" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="190.0" cy="193.6" r="4" fill="#222"/>
  <text x="172.0" y="209.6" font-size="15" fill="#222" font-weight="bold">A</text>
  <line x1="196.0" y1="187.6" x2="196.0" y2="162.6" stroke="#8250df" stroke-width="1.6"/>
  <polygon points="196.0,162.6 199.5,169.6 192.5,169.6" fill="#8250df"/>
  <text x="203.0" y="181.0" font-size="13" fill="#8250df" font-weight="bold">1</text>
  <line x1="196.0" y1="149.6" x2="196.0" y2="124.6" stroke="#bf8700" stroke-width="1.6"/>
  <polygon points="196.0,124.6 199.5,131.6 192.5,131.6" fill="#bf8700"/>
  <text x="203.0" y="146.0" font-size="13" fill="#bf8700" font-weight="bold">2</text>
  <text x="86.0" y="248.0" font-size="10" fill="#666" font-style="italic">begge skiftene går</text>
  <text x="86.0" y="261.0" font-size="10" fill="#666" font-style="italic">samme vei — samlet</text>
  <text x="86.0" y="274.0" font-size="10" fill="#666" font-style="italic">effekt kan signeres</text>
  <text x="182.0" y="317.0" font-size="13" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">0</tspan></text>
  <text x="34.0" y="198.6" font-size="12" fill="#000" font-style="italic">E<tspan font-size="9" dy="4">A</tspan></text>
  <text x="34.0" y="122.6" font-size="12" fill="#000" font-style="italic">E<tspan font-size="9" dy="4">B</tspan></text>
  <text x="86.0" y="334.0" font-size="11" fill="#8250df" font-style="italic">1: høyere i<tspan font-size="8" dy="-5">F</tspan><tspan font-size="11" dy="5"> skyver linjen opp</tspan></text>
  <text x="248.0" y="334.0" font-size="11" fill="#bf8700" font-style="italic">2: høyere E<tspan font-size="8" dy="-5">e</tspan><tspan font-size="11" dy="5"> skyver videre opp</tspan></text>
</svg>
