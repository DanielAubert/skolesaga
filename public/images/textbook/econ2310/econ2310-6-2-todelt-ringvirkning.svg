<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 402" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med to like store sektorbokser side ved side: varesektoren, som er åpen, og tjenestesektoren, som er delvis stengt. Mellom boksene går to buede piler i motsatt retning, merket kryssvis etterspørsel. En tykk pil utenfra treffer tjenestesektoren ovenfra og er merket nedstenging, altså en tilbudsbegrensning. Under boksene går en stiplet pil fra tjenestesektoren til varesektoren, merket at lavere inntekt gir lavere vareetterspørsel, og en tynnere stiplet pil tilbake, merket ringvirkning. Underteksten sier at det samlede fallet er større enn den direkte nedstengingen.">
  <rect width="690" height="402" fill="#ffffff"/>
  <rect x="53.0" y="116.0" width="214.0" height="92.0" rx="6" fill="#eef4fa" stroke="#2471a3" stroke-width="1.8"/>
  <text x="160.0" y="158.1" font-size="13.5" fill="#222" text-anchor="middle">Varesektor</text>
  <text x="160.0" y="175.6" font-size="13.5" fill="#222" text-anchor="middle">(åpen)</text>
  <rect x="387.0" y="116.0" width="234.0" height="92.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.8"/>
  <text x="504.0" y="158.1" font-size="13.5" fill="#222" text-anchor="middle">Tjenestesektor</text>
  <text x="504.0" y="175.6" font-size="13.5" fill="#222" text-anchor="middle">(delvis stengt)</text>
  <line x1="504.0" y1="52.0" x2="504.0" y2="112.0" stroke="#222" stroke-width="4.2"/>
  <polygon points="504.0,112.0 498.5,101.0 509.5,101.0" fill="#222"/>
  <text x="504.0" y="30.0" font-size="12.5" fill="#222" font-weight="bold" text-anchor="middle">Nedstenging</text>
  <text x="504.0" y="44.0" font-size="10.5" fill="#666" text-anchor="middle">(tilbudsbegrensning)</text>
  <path d="M 270.0 142.0 Q 327.0 174.0 384.0 142.0" fill="none" stroke="#666" stroke-width="1.8"/>
  <polygon points="384.0,142.0 379.6,148.5 376.2,142.4" fill="#666"/>
  <path d="M 384.0 182.0 Q 327.0 150.0 270.0 182.0" fill="none" stroke="#666" stroke-width="1.8"/>
  <polygon points="270.0,182.0 274.4,175.5 277.8,181.6" fill="#666"/>
  <text x="327.0" y="108.0" font-size="10.5" fill="#666" text-anchor="middle">kryssvis</text>
  <text x="327.0" y="121.0" font-size="10.5" fill="#666" text-anchor="middle">etterspørsel</text>
  <polyline points="504.0,208.0 504.0,264.0 170.0,264.0 170.0,210.0" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 4"/>
  <polygon points="170.0,210.0 173.5,217.0 166.5,217.0" fill="#c0392b"/>
  <text x="337.0" y="286.0" font-size="11" fill="#c0392b" text-anchor="middle">1.  lavere inntekt  →  lavere vareetterspørsel</text>
  <polyline points="148.0,208.0 148.0,318.0 492.0,318.0 492.0,210.0" fill="none" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="7 4"/>
  <polygon points="492.0,210.0 495.5,217.0 488.5,217.0" fill="#bf8700"/>
  <text x="337.0" y="336.0" font-size="10.5" fill="#bf8700" text-anchor="middle">2.  ringvirkning tilbake til tjenestene</text>
  <text x="345.0" y="372.0" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Samlet fall  &gt;  direkte nedstenging</text>
  <text x="345.0" y="390.0" font-size="10.5" fill="#666" text-anchor="middle">En aggregert modell ser bare summen — den todelte ser hvor fallet kommer fra.</text>
</svg>
