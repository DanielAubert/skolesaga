<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjonen Y langs den vannrette aksen og renta i langs den loddrette. Renteregelen RR er en rett, stigende linje. En loddrett stiplet linje markerer potensielt BNP. Et punkt A ligger på kurven med stiplede hjelpelinjer til begge akser. Helningen er bankens respons på produksjonsgapet delt på potensielt BNP.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">i</text>
  <line x1="215.5" y1="300.0" x2="215.5" y2="49.2" stroke="#666" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="206.5" y="334.0" font-size="12.5" fill="#666" font-style="italic">Y<tspan font-size="9" dy="-5">n</tspan></text>
  <line x1="70.0" y1="286.8" x2="390.0" y2="69.0" stroke="#2471a3" stroke-width="2.6"/>
  <text x="398.0" y="74.0" font-size="15" fill="#2471a3" font-style="italic">RR</text>
  <line x1="196.1" y1="201.0" x2="196.1" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="201.0" x2="196.1" y2="201.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="196.1" cy="201.0" r="4" fill="#222"/>
  <text x="174.1" y="190.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <text x="187.1" y="317.0" font-size="12.5" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">0</tspan></text>
  <text x="34.0" y="206.0" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">0</tspan></text>
  <text x="118.0" y="82.0" font-size="12" fill="#666" font-style="italic">helning  g<tspan font-size="9" dy="4">Y</tspan><tspan font-size="12" dy="-4"> / Y</tspan><tspan font-size="9" dy="-5">n</tspan></text>
  <text x="118.0" y="99.0" font-size="10.5" fill="#666">brattere kurve = banken</text>
  <text x="118.0" y="112.0" font-size="10.5" fill="#666">svarer kraftigere på gapet</text>
</svg>
