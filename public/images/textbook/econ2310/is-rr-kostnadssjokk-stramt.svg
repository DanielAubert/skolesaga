<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjon vannrett og rente loddrett. Den fallende etterspørselskurven og den stigende renteregelen krysser i punkt A, som ligger til høyre for den loddrette stiplede linjen for normal produksjon, altså et stramt arbeidsmarked. Renteregelen skifter entydig oppover. Etterspørselskurven er tegnet med to stiplede alternativer: ett mot høyre for bedret konkurranseevne og ett mot venstre for prisimpulsen som demper etterspørselen. Den nye likevekten B ligger klart høyere i renten enn A, men en vannrett dobbeltpil gjennom B viser at retningen på produksjonen er ubestemt.">
  <rect width="500" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
