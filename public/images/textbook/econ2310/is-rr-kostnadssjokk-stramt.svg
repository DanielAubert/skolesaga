  <text x="371.0" y="229.2" font-size="13" fill="#c0392b" font-weight="bold">IS<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="218.0" y1="52.0" x2="366.0" y2="172.6" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 4"/>
