  <text x="371.0" y="145.6" font-size="13" fill="#2471a3" font-weight="bold">RR<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="70.0" y1="203.6" x2="366.0" y2="58.9" stroke="#2471a3" stroke-width="2.4"/>
  <text x="371.0" y="62.9" font-size="13" fill="#2471a3" font-weight="bold">RR<tspan font-size="9" dy="4">1</tspan></text>
