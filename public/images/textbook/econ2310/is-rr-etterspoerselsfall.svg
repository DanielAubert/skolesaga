<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjon vannrett og rente loddrett. Den fallende etterspørselskurven og den stigende renteregelen krysser i punkt A, som ligger på den loddrette stiplede linjen for normal produksjon. Etterspørselskurven skyves parallelt mot venstre, og den nye likevekten B ligger nede til venstre på den uendrede renteregelen: både produksjonen og renten er lavere. Et lyst, åpent punkt lenger til venstre i samme høyde som A viser hvor produksjonen ville havnet uten renterespons, altså at pengepolitikken demper fallet, men ikke nøytraliserer det.">
  <rect width="500" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">i</text>
  <line x1="239.1" y1="300.0" x2="239.1" y2="44.0" stroke="#666" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="235.1" y="38.0" font-size="12.5" fill="#222" font-style="italic" text-anchor="middle">Y<tspan font-size="9" dy="-5">n</tspan></text>
  <line x1="70.0" y1="286.2" x2="366.0" y2="141.6" stroke="#2471a3" stroke-width="2.4"/>
  <text x="371.0" y="145.6" font-size="13" fill="#2471a3" font-weight="bold">RR</text>
  <line x1="70.0" y1="65.8" x2="357.5" y2="300.0" stroke="#c0392b" stroke-width="2.4"/>
  <text x="363.5" y="292.0" font-size="13" fill="#c0392b" font-weight="bold">IS<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="70.0" y1="151.9" x2="251.8" y2="300.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="257.8" y="292.0" font-size="13" fill="#c0392b" font-weight="bold">IS<tspan font-size="9" dy="4">1</tspan></text>
  <line x1="196.9" y1="169.1" x2="91.1" y2="169.1" stroke="#c0392b" stroke-width="1.7"/>
