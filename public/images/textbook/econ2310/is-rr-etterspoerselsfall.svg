  <line x1="239.1" y1="203.6" x2="239.1" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="203.6" x2="239.1" y2="203.6" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="239.1" cy="203.6" r="4" fill="#222"/>
  <text x="249.1" y="194.6" font-size="15" fill="#222" font-weight="bold">A</text>
  <line x1="173.1" y1="235.8" x2="173.1" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
