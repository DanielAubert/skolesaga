<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Fasediagram med kapital per arbeider vannrett. Sparekurven er én sammenhengende konkav kurve fra origo. Utvanningslinjen er knekt: et bratt stykke fra origo fram til terskelen, et loddrett fall i terskelen, og deretter et slakere stykke som også peker mot origo. Sparekurven møter den bratte delen i den stabile lavlikevekten A og den slake delen i den stabile høylikevekten B. Terskelen er markert med åpen sirkel og er ustabil. Under aksen står fire piler: mot høyre under lavlikevekten, mot venstre mellom lavlikevekten og terskelen, mot høyre mellom terskelen og høylikevekten, og mot venstre til høyre for høylikevekten.">
