  <text x="224.0" y="372.0" font-size="11" fill="#8250df" font-weight="bold" text-anchor="middle">Lønna FALLER — inntekt flyttes fra lønn til kapital</text>
  <text x="664.0" y="372.0" font-size="11" fill="#bf8700" font-weight="bold" text-anchor="middle">Lønna STIGER — arbeidskraften blir mer verdt</text>
  <text x="440.0" y="390.0" font-size="10.5" fill="#666" text-anchor="middle">L = utført arbeid, w = lønn per time.  Samme teknologi kan erstatte i ett yrke og forsterke i et annet.</text>
