<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Todelt figur med to arbeidsmarkedsdiagrammer side ved side. I begge har den vannrette aksen arbeidsmengde og den loddrette lønn, med en fallende arbeidsetterspørselskurve, en stigende arbeidstilbudskurve og likevekten A merket med stiplede hjelpelinjer. I venstre panel, erstattende teknologi, skifter tilbudskurven mot høyre fordi maskinene virker som nye arbeidere, og den nye likevekten B har lavere lønn og større arbeidsmengde. I høyre panel, forsterkende teknologi, skifter etterspørselskurven mot høyre fordi verdien av en arbeidstime stiger, og den nye likevekten B har høyere lønn og større arbeidsmengde. Samme teknologi, motsatt fortegn på lønna.">
