<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Tidsbane for konsum per arbeider når spareraten øker varig. Til venstre for skifttidspunktet ligger konsumet på en vannrett linje. I skifttidspunktet faller det loddrett, og deretter stiger det langs en konkav bane mot en ny vannrett asymptote. Figuren viser to varianter: i den ene ligger den nye asymptoten over det gamle nivået, i den andre under. Hvilken som gjelder, avhenger av om økonomien lå under eller over gullregelnivået før økningen.">
