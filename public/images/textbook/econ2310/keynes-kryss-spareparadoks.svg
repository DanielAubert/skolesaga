<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Keynes-krysset med produksjon Y vannrett og samlet etterspørsel loddrett. En rett 45-graderslinje fra origo og en slakere etterspørselslinje C pluss I-null krysser i punkt A. Etterspørselslinjen skyves parallelt nedover til en ny krysning B ved lavere produksjon. Det vannrette fallet i produksjonen er større enn det loddrette fallet i etterspørselslinjen.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="13" fill="#222">etterspørsel</text>
  <line x1="70.0" y1="300.0" x2="304.0" y2="66.0" stroke="#222" stroke-width="1.8"/>
  <line x1="70.0" y1="240.0" x2="304.0" y2="99.6" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="70.0" y1="270.0" x2="304.0" y2="129.6" stroke="#bf8700" stroke-width="2.4"/>
  <text x="96.0" y="46.0" font-size="11" fill="#666" font-style="italic">45°-linja: Y = etterspørsel</text>
  <text x="310.0" y="103.6" font-size="13" fill="#c0392b" font-style="italic">C + I<tspan font-size="9" dy="4">0</tspan></text>
  <text x="310.0" y="133.6" font-size="12" fill="#bf8700" font-style="italic">lavere c<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="220.0" y1="150.0" x2="220.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="220.0" cy="150.0" r="4" fill="#222"/>
  <text x="229.0" y="165.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <line x1="145.0" y1="225.0" x2="145.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="145.0" cy="225.0" r="4" fill="#222"/>
  <text x="128.0" y="218.0" font-size="15" fill="#222" font-weight="bold">B</text>
  <text x="139.0" y="317.0" font-size="13" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">1</tspan></text>
  <text x="214.0" y="317.0" font-size="13" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="145.0" y1="272.0" x2="220.0" y2="272.0" stroke="#222" stroke-width="1.4"/>
  <polygon points="145.0,272.0 151.5,268.8 151.5,275.2" fill="#222"/>
  <polygon points="220.0,272.0 213.5,275.2 213.5,268.8" fill="#222"/>
  <text x="172.5" y="266.0" font-size="13" fill="#000" font-style="italic">ΔY</text>
  <line x1="92.0" y1="226.8" x2="92.0" y2="256.8" stroke="#222" stroke-width="1.4"/>
  <polygon points="92.0,226.8 95.2,233.3 88.8,233.3" fill="#222"/>
  <polygon points="92.0,256.8 88.8,250.3 95.2,250.3" fill="#222"/>
  <text x="98.0" y="220.8" font-size="12" fill="#222" font-style="italic">Δc<tspan font-size="9" dy="4">0</tspan></text>
</svg>
