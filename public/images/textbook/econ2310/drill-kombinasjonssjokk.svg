<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjonen Y vannrett og renta i loddrett. IS skifter entydig mot høyre. Renteregelen er tegnet med to stiplede alternativer, ett oppover og ett nedover, og et stort spørsmålstegn, fordi de to impulsene trekker rentenivået i motsatt retning. De to alternativene gir likevektene B-én og B-to på den nye IS-kurven, én på hver side av A: den øvre ligger til venstre for A, med høyere rente og lavere produksjon, den nedre til høyre for A, med lavere rente og høyere produksjon. Både renta og produksjonen er altså ubestemte.">
  <rect width="440" height="400" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">i</text>
  <line x1="215.5" y1="300.0" x2="215.5" y2="49.2" stroke="#666" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="206.5" y="334.0" font-size="12.5" fill="#666" font-style="italic">Y<tspan font-size="9" dy="-5">n</tspan></text>
  <line x1="70.0" y1="72.3" x2="283.3" y2="290.1" stroke="#c0392b" stroke-width="2.4"/>
  <text x="64.0" y="65.3" font-size="12" fill="#c0392b" font-style="italic" text-anchor="end">IS<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="134.6" y1="49.2" x2="370.6" y2="290.1" stroke="#bf8700" stroke-width="2.4"/>
  <text x="377.6" y="295.1" font-size="12" fill="#bf8700" font-style="italic">IS<tspan font-size="9" dy="4">1</tspan></text>
  <line x1="70.0" y1="286.8" x2="390.0" y2="69.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="397.0" y="74.0" font-size="12" fill="#2471a3" font-style="italic">RR<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="70.0" y1="154.8" x2="225.2" y2="49.2" stroke="#8250df" stroke-width="2.0" stroke-dasharray="7 4"/>
  <text x="219.2" y="40.2" font-size="10.5" fill="#8250df" font-style="italic" text-anchor="end">RR opp?</text>
  <line x1="200.9" y1="290.1" x2="390.0" y2="161.4" stroke="#1a7f37" stroke-width="2.0" stroke-dasharray="7 4"/>
  <text x="384.0" y="152.4" font-size="10.5" fill="#1a7f37" font-style="italic" text-anchor="end">RR ned?</text>
  <text x="307.0" y="105.0" font-size="26" fill="#222" font-weight="bold" text-anchor="middle">?</text>
  <line x1="170.8" y1="86.2" x2="170.8" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="86.2" x2="170.8" y2="86.2" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="170.8" cy="86.2" r="4" fill="#8250df"/>
  <text x="181.8" y="91.2" font-size="15" fill="#8250df" font-weight="bold">B<tspan font-size="11" dy="4">1</tspan></text>
  <text x="161.8" y="317.0" font-size="12.5" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">B1</tspan></text>
  <text x="34.0" y="91.2" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">B1</tspan></text>
  <line x1="302.7" y1="220.8" x2="302.7" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="220.8" x2="302.7" y2="220.8" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="302.7" cy="220.8" r="4" fill="#1a7f37"/>
  <text x="315.7" y="226.8" font-size="15" fill="#1a7f37" font-weight="bold">B<tspan font-size="11" dy="4">2</tspan></text>
  <text x="293.7" y="317.0" font-size="12.5" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">B2</tspan></text>
  <text x="34.0" y="225.8" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">B2</tspan></text>
  <line x1="196.1" y1="201.0" x2="196.1" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="201.0" x2="196.1" y2="201.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="196.1" cy="201.0" r="4" fill="#222"/>
  <text x="174.1" y="219.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <text x="187.1" y="317.0" font-size="12.5" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">A</tspan></text>
  <text x="34.0" y="206.0" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">A</tspan></text>
  <line x1="260.7" y1="267.0" x2="348.0" y2="267.0" stroke="#bf8700" stroke-width="1.7"/>
  <polygon points="348.0,267.0 341.0,270.5 341.0,263.5" fill="#bf8700"/>
  <text x="304.3" y="257.0" font-size="10.5" fill="#bf8700" text-anchor="middle">IS mot høyre</text>
  <line x1="170.8" y1="290.0" x2="302.7" y2="290.0" stroke="#222" stroke-width="1.4"/>
  <polygon points="170.8,290.0 177.3,286.8 177.3,293.2" fill="#222"/>
  <polygon points="302.7,290.0 296.2,293.2 296.2,286.8" fill="#222"/>
  <text x="160.0" y="281.0" font-size="10.5" fill="#222" text-anchor="middle">Y-retning ubestemt</text>
  <text x="70.0" y="358.0" font-size="11.5" fill="#222" font-weight="bold">IS skifter entydig mot høyre — men både i og Y er ubestemt</text>
  <text x="70.0" y="378.0" font-size="10.5" fill="#8250df" font-style="italic">RR opp? = prisløftet ute dominerer</text>
  <text x="256.0" y="378.0" font-size="10.5" fill="#1a7f37" font-style="italic">RR ned? = lavere Z<tspan font-size="8" dy="-5">i</tspan><tspan font-size="10.5" dy="5"> dominerer</tspan></text>
</svg>
