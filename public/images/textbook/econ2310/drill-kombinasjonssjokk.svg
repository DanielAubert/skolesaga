<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjonen Y vannrett og renta i loddrett. IS skifter entydig mot høyre. Renteregelen er tegnet med to stiplede alternativer, ett oppover og ett nedover, og et stort spørsmålstegn, fordi de to impulsene trekker rentenivået i motsatt retning. De to alternativene gir likevektene B-én og B-to på den nye IS-kurven: begge til høyre for A, så produksjonen stiger uansett, men den ene ligger høyere og den andre lavere enn A, så renta er ubestemt.">
