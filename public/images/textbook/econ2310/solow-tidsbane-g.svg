<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Tidsbane med logaritmen av produksjonen per arbeider loddrett og tiden vannrett. Fram til tidspunktet der produktivitetsveksten øker, er banen en rett linje med helning lik den opprinnelige produktivitetsveksten. Fra det tidspunktet knekker banen oppover: den er først bare litt brattere, deretter stadig brattere, og nærmer seg en rett stiplet linje med helning lik den nye, høyere produktivitetsveksten. Det er ingen loddrette hopp i banen, bare et brudd i helningen.">
