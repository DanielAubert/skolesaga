  <line x1="424.0" y1="356.0" x2="368.0" y2="394.0" stroke="#bf8700" stroke-width="1.8"/>
  <polygon points="368.0,394.0 371.8,387.2 375.8,393.0" fill="#bf8700"/>
  <text x="430.0" y="380.0" font-size="13" fill="#bf8700" font-style="italic">1 − α</text>
  <text x="212.0" y="212.0" font-size="10.5" fill="#666" font-style="italic">avhenger av</text>
  <text x="212.0" y="226.0" font-size="10.5" fill="#666" font-style="italic">sentralbankens</text>
