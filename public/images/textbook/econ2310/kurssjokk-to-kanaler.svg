  <text x="128.0" y="164.8" font-size="12.5" fill="#222" text-anchor="middle">i kroner (p<tspan font-size="9" dy="4">i</tspan><tspan font-size="12.5" dy="-4"> opp)</tspan></text>
  <rect x="324.0" y="113.0" width="200.0" height="34.0" rx="6" fill="#fdf6e6" stroke="#bf8700" stroke-width="1.8"/>
  <text x="424.0" y="134.5" font-size="12.5" fill="#222" text-anchor="middle">Bedret konkurranseevne</text>
