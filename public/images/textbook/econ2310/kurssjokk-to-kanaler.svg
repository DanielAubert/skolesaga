<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Flytskjema. Øverst en boks: krona svekkes, E opp. Derfra går to piler. Den venstre, merket direkte, rask og entydig, går til boksen importvarer dyrere i kroner, prisvekst på import opp. Den høyre, merket indirekte, treg og betinget og påført et stort spørsmålstegn, går til en loddrett kjede: bedret konkurranseevne, deretter produksjonen opp, deretter ledigheten ned, deretter lønnsveksten opp, og til slutt prisvekst på norskproduserte varer opp. Begge veier ender i den samme sluttboksen: KPI-inflasjonen lik importandelen ganger importprisveksten pluss én minus importandelen ganger prisveksten på norske varer. Pilen fra den direkte kanalen er merket med importandelen, pilen fra kjeden med én minus importandelen. En note ved kjeden sier at den avhenger av sentralbankens respons og ikke kan signeres.">
  <rect width="560" height="470" fill="#ffffff"/>
  <rect x="168.0" y="23.0" width="224.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#222" stroke-width="1.8"/>
  <text x="280.0" y="46.7" font-size="13" fill="#222" text-anchor="middle">Krona svekkes (E opp)</text>
