  <text x="280.0" y="416.2" font-size="13" fill="#222" text-anchor="middle">KPI-inflasjonen</text>
  <text x="280.0" y="433.2" font-size="13" fill="#222" text-anchor="middle">π = α p<tspan font-size="9" dy="4">i</tspan><tspan font-size="13" dy="-4"> + (1 − α) p</tspan><tspan font-size="9" dy="4">s</tspan></text>
