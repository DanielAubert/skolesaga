<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Fasediagram med kapital per arbeider vannrett. Øverst ligger produktfunksjonen, konkav og stigende. Fra origo går den rette utvanningsstrålen, og under produktfunksjonen ligger sparekurven. En stiplet tangent til produktfunksjonen er parallell med strålen; berøringspunktet ligger over gullregelverdien for kapital per arbeider, markert med en stiplet hjelpelinje ned til aksen. Den loddrette avstanden mellom produktfunksjonen og strålen i dette punktet er markert med en dobbeltpil og merket konsum per arbeider, og den er størst nettopp her.">
