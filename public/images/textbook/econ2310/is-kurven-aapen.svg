<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjonen Y langs den vannrette aksen og renta i langs den loddrette. IS-kurven er en rett, fallende linje fra øvre venstre mot nedre høyre. Et punkt A ligger på kurven, med stiplede hjelpelinjer ned til produksjonen Y-null på den vannrette aksen og bort til renta i-null på den loddrette. Helningen er minus én delt på multiplikatoren ganger summen av rentens tre kanaler: konsumkanalen, investeringskanalen og valutakurskanalen.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">i</text>
  <line x1="70.0" y1="72.3" x2="283.3" y2="290.1" stroke="#c0392b" stroke-width="2.6"/>
  <text x="291.3" y="295.1" font-size="15" fill="#c0392b" font-style="italic">IS</text>
  <line x1="196.1" y1="201.0" x2="196.1" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="201.0" x2="196.1" y2="201.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="196.1" cy="201.0" r="4" fill="#222"/>
  <text x="205.1" y="191.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <text x="187.1" y="317.0" font-size="12.5" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">0</tspan></text>
  <text x="34.0" y="206.0" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">0</tspan></text>
  <text x="236.0" y="92.0" font-size="11.5" fill="#666">helning</text>
  <text x="236.0" y="107.0" font-size="11.5" fill="#666" font-style="italic">−1 / [ m (c<tspan font-size="8" dy="4">2</tspan><tspan font-size="11.5" dy="-4">+b</tspan><tspan font-size="8" dy="4">2</tspan><tspan font-size="11.5" dy="-4">+a</tspan><tspan font-size="8" dy="4">2</tspan><tspan font-size="11.5" dy="-4">κ) ]</tspan></text>
  <text x="236.0" y="128.0" font-size="10.5" fill="#666">flatere kurve = sterkere</text>
  <text x="236.0" y="141.0" font-size="10.5" fill="#666">rentekanaler og større m</text>
</svg>
