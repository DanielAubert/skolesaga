<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 344" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med to like store bokser side ved side. Venstre boks er merket hovedkursmodellen og har kulepunktene inflasjon, reallønnsvekst og lønnsomhet i konkurranseutsatt sektor. Høyre boks er merket den åpne modellen med IS, renteregelen og Phillips-kurven, og har kulepunktene produksjon, rente og valutakurs. Mellom boksene går en bred tosidig pil merket at valutakursen er broen mellom dem, med underteksten at høyere rente styrker krona, slik at kursveksten blir negativ. Under høyre boks står en note om at prisimpulsen er samme sjokk som høyere prisvekst ute.">
  <rect width="700" height="344" fill="#ffffff"/>
  <rect x="32" y="82" width="240" height="180" rx="8" fill="#f7f9fb" stroke="#222" stroke-width="1.8"/>
  <text x="152.0" y="112.0" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Hovedkursmodellen</text>
  <text x="52.0" y="148.0" font-size="12" fill="#666">•</text>
  <text x="66.0" y="148.0" font-size="12" fill="#222" font-style="italic">inflasjon  π</text>
  <text x="52.0" y="178.0" font-size="12" fill="#666">•</text>
  <text x="66.0" y="178.0" font-size="12" fill="#222" font-style="italic">reallønnsvekst  w − π</text>
  <text x="52.0" y="208.0" font-size="12" fill="#666">•</text>
  <text x="66.0" y="208.0" font-size="12" fill="#222" font-style="italic">lønnsomhet i K-sektor  (k)</text>
  <rect x="428" y="82" width="240" height="180" rx="8" fill="#f7f9fb" stroke="#222" stroke-width="1.8"/>
  <text x="548.0" y="112.0" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Åpen IS-RR-PK</text>
  <text x="448.0" y="148.0" font-size="12" fill="#666">•</text>
  <text x="462.0" y="148.0" font-size="12" fill="#222" font-style="italic">produksjon  Y</text>
  <text x="448.0" y="178.0" font-size="12" fill="#666">•</text>
  <text x="462.0" y="178.0" font-size="12" fill="#222" font-style="italic">rente  i</text>
  <text x="448.0" y="208.0" font-size="12" fill="#666">•</text>
  <text x="462.0" y="208.0" font-size="12" fill="#222" font-style="italic">valutakurs  E</text>
  <text x="350.0" y="130.0" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">valutakursen</text>
  <text x="350.0" y="145.0" font-size="11.5" fill="#222" font-weight="bold" text-anchor="middle">— broen —</text>
  <line x1="284.0" y1="176.0" x2="416.0" y2="176.0" stroke="#222" stroke-width="3.0"/>
  <polygon points="284.0,176.0 293.0,171.5 293.0,180.5" fill="#222"/>
  <polygon points="416.0,176.0 407.0,180.5 407.0,171.5" fill="#222"/>
  <text x="350.0" y="202.0" font-size="11" fill="#666" font-style="italic" text-anchor="middle">i ↑  ⇒  E ↓  ⇒  v &lt; 0</text>
  <text x="350.0" y="218.0" font-size="10" fill="#666" text-anchor="middle">(sterkere krone)</text>
  <text x="548.0" y="288.0" font-size="11" fill="#666" font-style="italic" text-anchor="middle">Z<tspan font-size="8" dy="-5">π</tspan><tspan font-size="11" dy="5"> = samme sjokk som høyere q</tspan><tspan font-size="8" dy="4">k</tspan><tspan font-size="11" dy="-4">, q</tspan><tspan font-size="8" dy="4">i</tspan></text>
  <text x="152.0" y="288.0" font-size="11" fill="#666" text-anchor="middle">lønns- og prisdannelsen</text>
  <text x="350.0" y="326.0" font-size="10.5" fill="#666" text-anchor="middle">To relasjonssett, én kobling: renta bestemmer kursen, og kursveksten går rett inn i kroneprisene.</text>
</svg>
