<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Flytdiagram uten akser, lest fra venstre mot høyre. Lengst til venstre en boks med de eksogene størrelsene utenfra: prisvekst på konkurranseutsatte varer, prisvekst på importvarer og vekst i valutakursen. Derfra går piler til to bokser med kroneprisveksten på konkurranseutsatte varer og på importvarer. Fra den første går pilen videre til lønnsveksten, som er kroneprisveksten pluss produktivitetsveksten i konkurranseutsatt sektor pluss et avvik fra hovedkursen; to sidepiler ovenfra markerer disse to tilleggene. Fra lønnsveksten går pilen til prisveksten i skjermet sektor, som er lønnsveksten minus produktivitetsveksten der; en sidepil ovenfra markerer fradraget. Til slutt går piler fra importprisveksten og fra prisveksten i skjermet sektor inn i en stiplet boks med konsumprisveksten, et vektet snitt der importandelen er vekten på importprisene. Den stiplede boksen er merket med at den ikke oppgis på eksamen og må suppleres selv. Underteksten sier at alle størrelser er vekstrater.">
  <rect width="880" height="424" fill="#ffffff"/>
  <rect x="16.0" y="175.0" width="140.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#222" stroke-width="1.8"/>
  <text x="86.0" y="206.2" font-size="13" fill="#222" text-anchor="middle">Utenfra:</text>
  <text x="86.0" y="223.2" font-size="13" fill="#222" text-anchor="middle">q<tspan font-size="9" dy="4">k</tspan><tspan font-size="13" dy="-4">, q</tspan><tspan font-size="9" dy="4">i</tspan><tspan font-size="13" dy="-4">, v</tspan></text>
  <rect x="189.0" y="95.0" width="158.0" height="46.0" rx="6" fill="#eef4fa" stroke="#2471a3" stroke-width="1.8"/>
  <text x="268.0" y="122.7" font-size="13" fill="#222" text-anchor="middle">p<tspan font-size="9" dy="4">k</tspan><tspan font-size="13" dy="-4"> = q</tspan><tspan font-size="9" dy="4">k</tspan><tspan font-size="13" dy="-4"> + v</tspan></text>
  <rect x="189.0" y="279.0" width="158.0" height="46.0" rx="6" fill="#eef4fa" stroke="#2471a3" stroke-width="1.8"/>
  <text x="268.0" y="306.7" font-size="13" fill="#222" text-anchor="middle">p<tspan font-size="9" dy="4">i</tspan><tspan font-size="13" dy="-4"> = q</tspan><tspan font-size="9" dy="4">i</tspan><tspan font-size="13" dy="-4"> + v</tspan></text>
  <rect x="371.0" y="95.0" width="194.0" height="46.0" rx="6" fill="#eef7ef" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="468.0" y="122.7" font-size="13" fill="#222" text-anchor="middle">w = p<tspan font-size="9" dy="4">k</tspan><tspan font-size="13" dy="-4"> + z</tspan><tspan font-size="9" dy="4">k</tspan><tspan font-size="13" dy="-4"> + k</tspan></text>
  <rect x="592.0" y="95.0" width="172.0" height="46.0" rx="6" fill="#eef7ef" stroke="#1a7f37" stroke-width="1.8"/>
  <text x="678.0" y="122.7" font-size="13" fill="#222" text-anchor="middle">p<tspan font-size="9" dy="4">s</tspan><tspan font-size="13" dy="-4"> = w − z</tspan><tspan font-size="9" dy="4">s</tspan></text>
  <rect x="409.0" y="277.0" width="302.0" height="78.0" rx="6" fill="#fdf6e6" stroke="#bf8700" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="560.0" y="304.0" font-size="12.5" fill="#222" text-anchor="middle">π = α p<tspan font-size="9" dy="4">i</tspan><tspan font-size="12.5" dy="-4"> + (1 − α) p</tspan><tspan font-size="9" dy="4">s</tspan></text>
  <text x="560.0" y="320.5" font-size="12.5" fill="#222" text-anchor="middle">oppgis ikke på eksamen —</text>
  <text x="560.0" y="337.0" font-size="12.5" fill="#222" text-anchor="middle">suppleres selv</text>
  <line x1="158.0" y1="192.0" x2="188.0" y2="132.0" stroke="#666" stroke-width="1.8"/>
  <polygon points="188.0,132.0 188.0,139.8 181.7,136.7" fill="#666"/>
  <line x1="158.0" y1="228.0" x2="188.0" y2="288.0" stroke="#666" stroke-width="1.8"/>
  <polygon points="188.0,288.0 181.7,283.3 188.0,280.2" fill="#666"/>
  <line x1="348.0" y1="118.0" x2="370.0" y2="118.0" stroke="#666" stroke-width="1.8"/>
  <polygon points="370.0,118.0 363.0,121.5 363.0,114.5" fill="#666"/>
  <line x1="566.0" y1="118.0" x2="590.0" y2="118.0" stroke="#666" stroke-width="1.8"/>
  <polygon points="590.0,118.0 583.0,121.5 583.0,114.5" fill="#666"/>
  <line x1="432.0" y1="66.0" x2="440.0" y2="93.0" stroke="#1a7f37" stroke-width="1.6"/>
  <polygon points="440.0,93.0 434.7,87.3 441.4,85.3" fill="#1a7f37"/>
  <text x="432.0" y="58.0" font-size="11.5" fill="#1a7f37" font-style="italic" text-anchor="middle">+ z<tspan font-size="8" dy="4">k</tspan></text>
  <line x1="506.0" y1="66.0" x2="498.0" y2="93.0" stroke="#1a7f37" stroke-width="1.6"/>
  <polygon points="498.0,93.0 496.6,85.3 503.3,87.3" fill="#1a7f37"/>
  <text x="506.0" y="58.0" font-size="11.5" fill="#1a7f37" font-style="italic" text-anchor="middle">+ k</text>
  <line x1="678.0" y1="66.0" x2="678.0" y2="93.0" stroke="#1a7f37" stroke-width="1.6"/>
  <polygon points="678.0,93.0 674.5,86.0 681.5,86.0" fill="#1a7f37"/>
  <text x="678.0" y="58.0" font-size="11.5" fill="#1a7f37" font-style="italic" text-anchor="middle">− z<tspan font-size="8" dy="4">s</tspan></text>
  <line x1="348.0" y1="302.0" x2="406.0" y2="308.0" stroke="#bf8700" stroke-width="1.8"/>
  <polygon points="406.0,308.0 398.7,310.8 399.4,303.8" fill="#bf8700"/>
  <text x="370.0" y="292.0" font-size="14" fill="#bf8700" font-style="italic">α</text>
  <line x1="678.0" y1="142.0" x2="660.0" y2="274.0" stroke="#bf8700" stroke-width="1.8"/>
  <polygon points="660.0,274.0 657.5,266.6 664.4,267.5" fill="#bf8700"/>
  <text x="686.0" y="208.0" font-size="12.5" fill="#bf8700" font-style="italic">1 − α</text>
  <text x="86.0" y="264.0" font-size="10.5" fill="#666" text-anchor="middle">eksogent utenfra</text>
  <text x="468.0" y="154.0" font-size="10.5" fill="#666" font-style="italic" text-anchor="middle">frontfagsmodellen: hovedkursen p<tspan font-size="8" dy="4">k</tspan><tspan font-size="10.5" dy="-4"> + z</tspan><tspan font-size="8" dy="4">k</tspan></text>
  <text x="440.0" y="410.0" font-size="11.5" fill="#666" text-anchor="middle">Alle størrelser er vekstrater — ikke nivåer.</text>
</svg>
