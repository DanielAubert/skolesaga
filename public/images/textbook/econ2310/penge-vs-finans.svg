<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="To paneler side ved side med samme akser: produksjonen Y vannrett og renta i loddrett. I begge paneler er IS skjøvet fra IS-null til IS-én mot venstre etter et etterspørselsfall. I venstre panel, pengepolitikk, skifter renteregelen ned til RR-én, og den nye likevekten B-én ligger rett under A: samme produksjon, lavere rente. I høyre panel, finanspolitikk, skyves IS-én tilbake til IS-null mens renteregelen ligger i ro, og likevekten er tilbake i A: samme produksjon og samme rente. Kurvene er tegnet med samme strektype i begge paneler: heltrukket for kurvene som gjelder, stiplet bare for hjelpelinjer. Undertekst: samme produksjon, ulik sammensetning.">
