  <text x="74.0" y="282.0" font-size="10" fill="#666">uten renterespons</text>
  <text x="99.8" y="317.0" font-size="12.5" fill="#666" font-style="italic">Y<tspan font-size="9" dy="4">C</tspan></text>
  <line x1="143.7" y1="236.6" x2="143.7" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="236.6" x2="143.7" y2="236.6" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="143.7" cy="236.6" r="4" fill="#222"/>
  <text x="121.7" y="225.6" font-size="15" fill="#222" font-weight="bold">B</text>
  <text x="134.7" y="317.0" font-size="12.5" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">B</tspan></text>
  <text x="34.0" y="241.6" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">B</tspan></text>
  <line x1="196.1" y1="201.0" x2="196.1" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="201.0" x2="196.1" y2="201.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="196.1" cy="201.0" r="4" fill="#222"/>
  <text x="206.1" y="191.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <text x="187.1" y="317.0" font-size="12.5" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">A</tspan></text>
  <text x="34.0" y="206.0" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">A</tspan></text>
