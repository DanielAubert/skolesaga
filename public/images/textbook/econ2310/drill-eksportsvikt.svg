<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjonen Y vannrett og renta i loddrett. Etterspørselsfallet fra utlandet skifter IS parallelt mot venstre langs en uendret renteregel. Den nye likevekten B ligger ned til venstre for A, med lavere produksjon og lavere rente. Et lyst punkt C med åpen sirkel viser hvor produksjonen ville havnet uten rentekuttet. En loddrett stiplet linje markerer potensielt BNP.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">i</text>
  <line x1="215.5" y1="300.0" x2="215.5" y2="49.2" stroke="#666" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="206.5" y="334.0" font-size="12.5" fill="#666" font-style="italic">Y<tspan font-size="9" dy="-5">n</tspan></text>
  <line x1="70.0" y1="72.3" x2="283.3" y2="290.1" stroke="#c0392b" stroke-width="2.4"/>
  <text x="290.3" y="295.1" font-size="12" fill="#c0392b" font-style="italic">IS<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="70.0" y1="161.4" x2="196.1" y2="290.1" stroke="#bf8700" stroke-width="2.4"/>
  <text x="64.0" y="154.4" font-size="12" fill="#bf8700" font-style="italic" text-anchor="end">IS<tspan font-size="9" dy="4">1</tspan></text>
  <line x1="70.0" y1="286.8" x2="390.0" y2="69.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="397.0" y="74.0" font-size="12" fill="#2471a3" font-style="italic">RR</text>
  <line x1="108.8" y1="201.0" x2="108.8" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
