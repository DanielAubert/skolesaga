<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjonen Y vannrett og renta i loddrett, og to kurvepar gjennom samme utgangspunkt A. Det slake paret er IS og renteregelen i standardtilfellet; det bratte paret gjelder når lønns- og prisveksten reagerer sterkt på presset i økonomien. Begge IS-kurver er skjøvet like langt mot høyre. Det slake paret gir en ny likevekt B langt til høyre og litt høyere; det bratte paret gir en ny likevekt bare litt til høyre for A, men mye høyere. Stiplede hjelpelinjer går fra begge nye likevekter til begge akser.">
  <rect width="440" height="400" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">i</text>
  <line x1="70.0" y1="72.3" x2="283.3" y2="290.1" stroke="#c0392b" stroke-width="2.2"/>
  <text x="290.3" y="295.1" font-size="12" fill="#c0392b" font-style="italic">IS</text>
  <line x1="134.6" y1="49.2" x2="370.6" y2="290.1" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="377.6" y="295.1" font-size="12" fill="#c0392b" font-style="italic">IS<tspan font-size="9" dy="4">1</tspan></text>
  <line x1="70.0" y1="286.8" x2="390.0" y2="69.0" stroke="#2471a3" stroke-width="2.2"/>
  <text x="397.0" y="74.0" font-size="12" fill="#2471a3" font-style="italic">RR</text>
  <line x1="115.0" y1="49.2" x2="243.7" y2="290.1" stroke="#bf8700" stroke-width="2.2"/>
  <text x="109.0" y="42.2" font-size="12" fill="#bf8700" font-style="italic" text-anchor="end">IS′</text>
  <line x1="202.2" y1="49.2" x2="330.9" y2="290.1" stroke="#bf8700" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="196.2" y="42.2" font-size="12" fill="#bf8700" font-style="italic" text-anchor="end">IS<tspan font-size="9" dy="4">1</tspan><tspan font-size="12" dy="-4">′</tspan></text>
  <line x1="180.7" y1="290.1" x2="222.3" y2="49.2" stroke="#8250df" stroke-width="2.2"/>
  <text x="228.3" y="43.2" font-size="12" fill="#8250df" font-style="italic">RR′</text>
  <line x1="248.4" y1="165.4" x2="248.4" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="165.4" x2="248.4" y2="165.4" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="248.4" cy="165.4" r="4" fill="#222"/>
  <text x="258.4" y="183.4" font-size="15" fill="#222" font-weight="bold">B</text>
  <text x="239.4" y="317.0" font-size="12.5" fill="#000" font-style="italic">Y<tspan font-size="9" dy="4">B</tspan></text>
  <text x="34.0" y="170.4" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">B</tspan></text>
  <line x1="217.4" y1="77.6" x2="217.4" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="77.6" x2="217.4" y2="77.6" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="217.4" cy="77.6" r="4" fill="#8250df"/>
  <text x="228.4" y="67.6" font-size="15" fill="#8250df" font-weight="bold">B′</text>
  <text x="34.0" y="82.6" font-size="12.5" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">B</tspan><tspan font-size="12.5" dy="-4">′</tspan></text>
  <line x1="196.1" y1="201.0" x2="196.1" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="201.0" x2="196.1" y2="201.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="196.1" cy="201.0" r="4" fill="#222"/>
  <text x="174.1" y="219.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <line x1="128.2" y1="128.7" x2="215.5" y2="128.7" stroke="#666" stroke-width="1.6"/>
  <polygon points="215.5,128.7 208.5,132.2 208.5,125.2" fill="#666"/>
  <text x="171.8" y="116.7" font-size="10.5" fill="#666" text-anchor="middle">samme skift</text>
  <text x="70.0" y="358.0" font-size="11" fill="#222" font-weight="bold">IS og RR: standardtilfellet  ·  IS′ og RR′: høy β (begge brattere)</text>
  <text x="70.0" y="378.0" font-size="10.5" fill="#666">Samme IS-skift gir mye mindre Y-virkning — og mye større i-virkning.</text>
</svg>
