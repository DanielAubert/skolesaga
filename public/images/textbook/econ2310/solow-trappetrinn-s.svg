<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Fasediagram med kapital per arbeider vannrett. Utvanningsstrålen er en rett linje fra origo. Sparekurven er delt i to: en lav konkav kurve fra origo fram til terskelen, et loddrett hopp opp i terskelen, og deretter en høyere konkav kurve. Strålen krysses tre steder: den lave kurven krysser i den stabile lavlikevekten A, terskelen er markert med åpen sirkel som ustabilt vippepunkt, og den høye kurven krysser i den stabile høylikevekten B. Under aksen står fire piler: mot høyre under lavlikevekten, mot venstre mellom lavlikevekten og terskelen, mot høyre mellom terskelen og høylikevekten, og mot venstre til høyre for høylikevekten.">
