<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Samme diagram med produksjonen vannrett og renta loddrett. To parallelle, stigende renteregelkurver: den nye ligger over den gamle, forskjøvet rett oppover og med uendret helning. Piler mellom dem peker oppover. En loddrett stiplet linje markerer potensielt BNP. Figuren viser at renta blir høyere for ethvert produksjonsnivå.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">Y</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">i</text>
  <line x1="215.5" y1="300.0" x2="215.5" y2="49.2" stroke="#666" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="206.5" y="334.0" font-size="12.5" fill="#666" font-style="italic">Y<tspan font-size="9" dy="-5">n</tspan></text>
  <line x1="70.0" y1="286.8" x2="390.0" y2="69.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="397.0" y="74.0" font-size="12" fill="#2471a3" font-style="italic">RR<tspan font-size="9" dy="4">0</tspan></text>
  <line x1="70.0" y1="234.0" x2="341.5" y2="49.2" stroke="#8250df" stroke-width="2.4"/>
  <text x="348.5" y="54.2" font-size="12" fill="#8250df" font-style="italic">RR<tspan font-size="9" dy="4">1</tspan></text>
  <line x1="137.9" y1="236.6" x2="137.9" y2="193.8" stroke="#8250df" stroke-width="1.6"/>
  <polygon points="137.9,193.8 141.4,200.8 134.4,200.8" fill="#8250df"/>
  <line x1="293.0" y1="131.0" x2="293.0" y2="88.2" stroke="#8250df" stroke-width="1.6"/>
  <polygon points="293.0,88.2 296.5,95.2 289.5,95.2" fill="#8250df"/>
  <text x="146.9" y="178.8" font-size="12" fill="#8250df" font-style="italic">Z<tspan font-size="9" dy="-5">i</tspan><tspan font-size="12" dy="5"> opp</tspan></text>
  <text x="112.0" y="64.0" font-size="10.5" fill="#666">samme helning, høyere nivå:</text>
  <text x="112.0" y="77.0" font-size="10.5" fill="#666">høyere rente for ethvert Y</text>
</svg>
