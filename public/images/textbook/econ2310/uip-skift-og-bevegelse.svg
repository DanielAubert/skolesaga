<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Samme diagram med norsk rente vannrett og valutakursen loddrett. Den opprinnelige fallende linjen har punkt A ved startrenten. En ny linje er skjøvet parallelt oppover, med punkt B rett over A ved samme norske rente: det er et skift i linjen, og krona svekkes. På den opprinnelige linjen ligger punkt C ned til høyre ved en høyere norsk rente: det er en bevegelse langs linjen, og krona styrkes. Stiplede hjelpelinjer går fra A, B og C til begge akser.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">i</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">E</text>
  <line x1="50.0" y1="250.0" x2="50.0" y2="190.0" stroke="#666" stroke-width="1.4"/>
  <polygon points="50.0,190.0 53.5,197.0 46.5,197.0" fill="#666"/>
  <text transform="rotate(-90 44 254.0)" x="44" y="254.0" font-size="10.5" fill="#666" font-style="italic">svakere krone</text>
  <line x1="70.0" y1="40.0" x2="358.0" y2="240.6" stroke="#8250df" stroke-width="2.2"/>
  <line x1="70.0" y1="86.4" x2="358.0" y2="287.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="362.0" y="244.6" font-size="11" fill="#8250df" font-style="italic">ny linje</text>
  <text x="362.0" y="289.0" font-size="11" fill="#2471a3" font-style="italic">utgangspunkt</text>
  <line x1="190.0" y1="123.6" x2="190.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="123.6" x2="190.0" y2="123.6" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="190.0" cy="123.6" r="4" fill="#222"/>
  <text x="172.0" y="115.6" font-size="15" fill="#222" font-weight="bold">B</text>
  <line x1="190.0" y1="170.0" x2="190.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="170.0" x2="190.0" y2="170.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="190.0" cy="170.0" r="4" fill="#222"/>
  <text x="172.0" y="186.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <line x1="294.0" y1="242.4" x2="294.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="242.4" x2="294.0" y2="242.4" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="294.0" cy="242.4" r="4" fill="#222"/>
  <text x="303.0" y="258.4" font-size="15" fill="#222" font-weight="bold">C</text>
  <line x1="199.0" y1="164.0" x2="199.0" y2="131.6" stroke="#8250df" stroke-width="1.6"/>
  <polygon points="199.0,131.6 202.5,138.6 195.5,138.6" fill="#8250df"/>
  <text x="202.0" y="100.0" font-size="11" fill="#8250df" font-style="italic">skift i linjen:</text>
  <text x="202.0" y="113.0" font-size="11" fill="#8250df" font-style="italic">i<tspan font-size="8" dy="-5">F</tspan><tspan font-size="11" dy="5">, E</tspan><tspan font-size="8" dy="-5">e</tspan><tspan font-size="11" dy="5"> eller risikopremie opp</tspan></text>
  <line x1="200.3" y1="189.3" x2="270.3" y2="238.1" stroke="#2471a3" stroke-width="1.6"/>
  <polygon points="270.3,238.1 262.6,237.0 266.6,231.2" fill="#2471a3"/>
  <text x="96.0" y="338.0" font-size="11" fill="#2471a3" font-style="italic">bevegelse langs linjen: norsk rente opp (fra A til C)</text>
  <text x="182.0" y="317.0" font-size="13" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">0</tspan></text>
  <text x="286.0" y="317.0" font-size="13" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">1</tspan></text>
  <text x="34.0" y="175.0" font-size="12" fill="#000" font-style="italic">E<tspan font-size="9" dy="4">A</tspan></text>
  <text x="34.0" y="128.6" font-size="12" fill="#000" font-style="italic">E<tspan font-size="9" dy="4">B</tspan></text>
</svg>
