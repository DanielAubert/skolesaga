<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Flytskjema med sju bokser i en loddrett kjede, forbundet med piler nedover. Boks én: oversett egenskapene til produktfunksjonen og bevegelsesligningen. Boks to: tolk hvert ledd i ord, det er der flest poeng ligger. Boks tre: tegn fasediagrammet, marker likevekten og argumenter for stabilitet. Boks fire: tegn tidsbanen for kapital og produksjon per arbeider mot asymptotene. Boks fem: presiser at størrelsene per arbeider er konstante mens totalstørrelsene vokser med befolkningsveksten. Boks seks: kjør skiftet med figur, skille mellom kort og lang sikt og mekanismen i ord. Boks sju: møt utvidelsen — gullregelen, to likevekter eller produktivitetsvekst — og flagg eksplisitt det som er ubestemt.">
  <rect width="560" height="520" fill="#ffffff"/>
  <text x="280.0" y="30.0" font-size="15" fill="#222" font-weight="bold" text-anchor="middle">Løsningsoppskriften i sju steg</text>
  <rect x="45.0" y="53.0" width="470.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#222" stroke-width="1.8"/>
  <text x="280.0" y="72.2" font-size="12.5" fill="#222" text-anchor="middle">1  Oversett egenskapene: y = f(k),</text>
  <text x="280.0" y="88.8" font-size="12.5" fill="#222" text-anchor="middle">Δk = s f(k) − (n+δ)k</text>
  <rect x="45.0" y="115.0" width="470.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#222" stroke-width="1.8"/>
  <text x="280.0" y="134.2" font-size="12.5" fill="#222" text-anchor="middle">2  Tolk hvert ledd i ord</text>
  <text x="280.0" y="150.8" font-size="12.5" fill="#222" text-anchor="middle">(her ligger flest poeng)</text>
  <line x1="280.0" y1="100.0" x2="280.0" y2="114.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="280.0,114.0 276.5,107.0 283.5,107.0" fill="#666"/>
  <rect x="45.0" y="177.0" width="470.0" height="46.0" rx="6" fill="#fdf6e6" stroke="#bf8700" stroke-width="1.8"/>
  <text x="280.0" y="196.2" font-size="12.5" fill="#222" text-anchor="middle">3  Fasediagram: marker k*,</text>
  <text x="280.0" y="212.8" font-size="12.5" fill="#222" text-anchor="middle">argumenter for stabilitet</text>
  <line x1="280.0" y1="162.0" x2="280.0" y2="176.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="280.0,176.0 276.5,169.0 283.5,169.0" fill="#666"/>
  <rect x="45.0" y="245.0" width="470.0" height="34.0" rx="6" fill="#fdf6e6" stroke="#bf8700" stroke-width="1.8"/>
  <text x="280.0" y="266.5" font-size="12.5" fill="#222" text-anchor="middle">4  Tidsbane: k og y mot asymptotene</text>
  <line x1="280.0" y1="224.0" x2="280.0" y2="238.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="280.0,238.0 276.5,231.0 283.5,231.0" fill="#666"/>
  <rect x="45.0" y="301.0" width="470.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#222" stroke-width="1.8"/>
  <text x="280.0" y="320.2" font-size="12.5" fill="#222" text-anchor="middle">5  Presiser: per arbeider konstant,</text>
  <text x="280.0" y="336.8" font-size="12.5" fill="#222" text-anchor="middle">totalt vokser med n</text>
  <line x1="280.0" y1="286.0" x2="280.0" y2="300.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="280.0,300.0 276.5,293.0 283.5,293.0" fill="#666"/>
  <rect x="45.0" y="363.0" width="470.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#222" stroke-width="1.8"/>
  <text x="280.0" y="382.2" font-size="12.5" fill="#222" text-anchor="middle">6  Kjør skiftet: figur + kort og</text>
  <text x="280.0" y="398.8" font-size="12.5" fill="#222" text-anchor="middle">lang sikt + mekanisme</text>
  <line x1="280.0" y1="348.0" x2="280.0" y2="362.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="280.0,362.0 276.5,355.0 283.5,355.0" fill="#666"/>
  <rect x="45.0" y="425.0" width="470.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#222" stroke-width="1.8"/>
  <text x="280.0" y="444.2" font-size="12.5" fill="#222" text-anchor="middle">7  Møt utvidelsen: gullregel /</text>
  <text x="280.0" y="460.8" font-size="12.5" fill="#222" text-anchor="middle">to likevekter / g — flagg det ubestemte</text>
  <line x1="280.0" y1="410.0" x2="280.0" y2="424.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="280.0,424.0 276.5,417.0 283.5,417.0" fill="#666"/>
  <text x="280.0" y="508.0" font-size="11" fill="#666" text-anchor="middle">stegene 3 og 4 er de to figurene sensor spør etter</text>
</svg>
