<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med norsk rente i vannrett og valutakursen E, kroner per enhet utenlandsk valuta, loddrett. En pil oppover langs den loddrette aksen er merket svakere krone. Paritetsbetingelsen er en rett, fallende linje med helning minus kappa, som skjærer den loddrette aksen i forventet langsiktskurs pluss kappa ganger utenlandsk rente. Ved startrenten i-null ligger punkt A på linjen, med stiplede hjelpelinjer til begge akser.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="400,300 392,296 392,304" fill="#6b7280"/>
  <polygon points="70,30 66,38 74,38" fill="#6b7280"/>
  <text x="406.0" y="305.0" font-size="15" fill="#222" font-style="italic">i</text>
  <text x="60.0" y="24.0" font-size="14" fill="#222" font-style="italic">E</text>
  <line x1="50.0" y1="152.0" x2="50.0" y2="68.0" stroke="#666" stroke-width="1.4"/>
  <polygon points="50.0,68.0 53.5,75.0 46.5,75.0" fill="#666"/>
  <text transform="rotate(-90 44 156.0)" x="44" y="156.0" font-size="10.5" fill="#666" font-style="italic">svakere krone</text>
  <line x1="70.0" y1="86.4" x2="358.0" y2="287.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="288.0" y="238.1" font-size="12" fill="#2471a3" font-style="italic">E = E<tspan font-size="9" dy="-5">e</tspan><tspan font-size="12" dy="5"> + κ(i</tspan><tspan font-size="9" dy="-5">F</tspan><tspan font-size="12" dy="5"> − i)</tspan></text>
  <circle cx="70.0" cy="86.4" r="3.5" fill="#2471a3"/>
  <text x="78.0" y="78.4" font-size="12" fill="#2471a3" font-style="italic">E<tspan font-size="9" dy="-5">e</tspan><tspan font-size="12" dy="5"> + κi</tspan><tspan font-size="9" dy="-5">F</tspan></text>
  <line x1="190.0" y1="170.0" x2="190.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="170.0" x2="190.0" y2="170.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="190.0" cy="170.0" r="4" fill="#222"/>
  <text x="198.0" y="162.0" font-size="15" fill="#222" font-weight="bold">A</text>
  <text x="182.0" y="317.0" font-size="13" fill="#000" font-style="italic">i<tspan font-size="9" dy="4">0</tspan></text>
  <text x="36.0" y="175.0" font-size="13" fill="#000" font-style="italic">E<tspan font-size="9" dy="4">0</tspan></text>
</svg>
