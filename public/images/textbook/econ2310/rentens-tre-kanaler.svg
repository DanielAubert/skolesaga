<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 344" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Flytdiagram uten akser. Til venstre en boks der renta settes opp. Fra den går tre piler til tre bokser: lavere konsum, lavere investeringer, og sterkere krone som gir lavere nettoeksport. Alle tre peker inn i en felles boks der produksjonen faller. Ved den siste pilen står en sirkelpil merket med multiplikatoren.">
