  <rect x="182.0" y="249.0" width="236.0" height="50.0" rx="6" fill="#eef4fa" stroke="#2471a3" stroke-width="1.8"/>
  <text x="300.0" y="270.2" font-size="12.5" fill="#222" text-anchor="middle">Sterkere krone —</text>
  <text x="300.0" y="286.8" font-size="12.5" fill="#222" text-anchor="middle">nettoeksport ned  (a<tspan font-size="9" dy="4">2</tspan><tspan font-size="12.5" dy="-4">κ)</tspan></text>
