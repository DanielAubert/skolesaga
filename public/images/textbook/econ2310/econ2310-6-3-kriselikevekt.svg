<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 386" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med samlet produksjon langs den vannrette aksen og samlet etterspørsel langs den loddrette, med samme skala på begge akser. En stiplet rett linje fra origo viser alle punkter der etterspørselen er lik produksjonen. Etterspørselskurven er S-formet: slak ved lav produksjon fordi risikopremien er høy, brattere enn den stiplede linja i midtområdet fordi premien faller raskt, og slak igjen ved høy produksjon. Kurven krysser den stiplede linja i tre punkter. De to ytterste er stabile og merket kriselikevekten og høylikevekten; det midterste er en ustabil terskel og tegnet med åpen sirkel. Alle tre har stiplede hjelpelinjer ned til den vannrette aksen. Under aksen peker dynamikkpiler mot kriselikevekten i de to intervallene under terskelen og mot høylikevekten i de to intervallene over den.">
