<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 400" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Koordinatsystem med origo midt i figuren. Den vannrette aksen er veksten i valutakursen: mot venstre styrkes krona, mot høyre svekkes den. Den loddrette aksen er den ekstraordinære lønnsveksten, altså avviket fra hovedkursen. En rett, fallende linje viser alle kombinasjoner som gir inflasjon lik målet når prisveksten hos handelspartnerne ligger over målet. Linja skjærer den loddrette aksen under origo i punkt A, der krona er uendret og lønnsveksten ligger under hovedkursen, og den vannrette aksen til venstre for origo i punkt B, der lønnsveksten følger hovedkursen og krona styrker seg. Området over og til høyre for linja er skyggelagt og merket at inflasjonen ligger over målet.">
  <rect width="470" height="400" fill="#ffffff"/>
  <polygon points="48.0,85.9 48.0,70.5 378.0,70.5 378.0,328.5 308.7,328.5" fill="#c0392b" opacity="0.09"/>
  <line x1="40.0" y1="178.0" x2="392.0" y2="178.0" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="246.0" y1="314.5" x2="246.0" y2="58.5" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="392.0,178 384.0,174 384.0,182" fill="#6b7280"/>
  <polygon points="246,58.5 242,66.5 250,66.5" fill="#6b7280"/>
  <text x="396.0" y="183.0" font-size="15" fill="#222" font-style="italic">v</text>
  <text x="234.0" y="52.5" font-size="15" fill="#222" font-style="italic">k</text>
  <text x="232.0" y="194.0" font-size="11" fill="#666" text-anchor="end">0</text>
  <text x="213.0" y="198.0" font-size="10.5" fill="#666" text-anchor="end">krona styrkes</text>
  <text x="265.8" y="198.0" font-size="10.5" fill="#666">krona svekkes</text>
  <text x="256.0" y="68.5" font-size="10" fill="#666">lønnsvekst over hovedkursen</text>
  <text x="234.0" y="332.5" font-size="10" fill="#666" text-anchor="end">lønnsvekst under hovedkursen</text>
  <line x1="48.0" y1="85.9" x2="308.7" y2="328.5" stroke="#2471a3" stroke-width="2.6"/>
  <text x="56.0" y="77.9" font-size="12" fill="#2471a3" font-style="italic">v + (1 − α)k = π<tspan font-size="9" dy="-5">mål</tspan><tspan font-size="12" dy="5"> − π*</tspan></text>
  <text x="56.0" y="93.9" font-size="10.5" fill="#2471a3" font-style="italic">helning −1/(1 − α)</text>
  <line x1="246.0" y1="270.1" x2="292.2" y2="270.1" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="246.0" cy="270.1" r="4" fill="#222"/>
  <text x="256.0" y="288.1" font-size="15" fill="#222" font-weight="bold">A</text>
  <text x="272.0" y="288.1" font-size="10.5" fill="#666">uendret krone, k &lt; 0</text>
  <line x1="147.0" y1="178.0" x2="147.0" y2="225.3" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="147.0" cy="178.0" r="4" fill="#222"/>
  <text x="137.0" y="166.0" font-size="15" fill="#222" font-weight="bold" text-anchor="end">B</text>
  <text x="156.0" y="163.0" font-size="10.5" fill="#666">k = 0: krona styrkes</text>
  <text x="282.3" y="104.9" font-size="11" fill="#c0392b" font-weight="bold">inflasjon over målet</text>
  <text x="84.3" y="276.9" font-size="10.5" fill="#666">inflasjon under målet</text>
  <text x="24.0" y="374.0" font-size="11" fill="#222" font-weight="bold">Modellen gir to knapper når prisveksten ute ligger over målet:</text>
  <text x="24.0" y="390.0" font-size="10.5" fill="#666">styrke krona (v &lt; 0) eller holde lønnsveksten under hovedkursen (k &lt; 0) — eller en blanding.</text>
</svg>
