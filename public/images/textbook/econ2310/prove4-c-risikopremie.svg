<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med produksjonen Y vannrett og renta i loddrett. En høyere risikopremie på kroner skifter IS mot høyre og renteregelen oppover. To stiplede renteregelkurver gir to alternative likevekter, B-én til høyre for A og B-to til venstre, begge høyere enn A. Renta stiger entydig, mens retningen på produksjonen er ubestemt.">
