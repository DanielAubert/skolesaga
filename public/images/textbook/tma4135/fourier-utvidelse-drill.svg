<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" width="480" height="344" role="img">
  <title>Odde periodisk utvidelse brukt i drillkapitlet</title>
  <line x1="52.0" y1="152.0" x2="458.0" y2="152.0" stroke="#6b7280" stroke-width="1.4"/>
  <path d="M458.0 152.0 l-7 -3.5 l0 7 z" fill="#6b7280"/>
  <line x1="248.0" y1="252.0" x2="248.0" y2="40.0" stroke="#6b7280" stroke-width="1.4"/>
  <path d="M248.0 40.0 l-3.5 7 l7 0 z" fill="#6b7280"/>
  <text x="462.0" y="156.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">x</text>
  <text x="256.0" y="51.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">y</text>
  <line x1="58.0" y1="148.0" x2="58.0" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="58.0" y="172.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">−3π</text>
  <line x1="121.4" y1="148.0" x2="121.4" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="121.4" y="172.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">−2π</text>
  <line x1="184.7" y1="148.0" x2="184.7" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="184.7" y="172.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">−π</text>
  <line x1="248.0" y1="148.0" x2="248.0" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="248.0" y="172.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">0</text>
  <line x1="311.3" y1="148.0" x2="311.3" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="311.3" y="172.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">π</text>
  <line x1="374.6" y1="148.0" x2="374.6" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="374.6" y="172.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">2π</text>
  <line x1="438.0" y1="148.0" x2="438.0" y2="156.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="438.0" y="172.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">3π</text>
  <line x1="244.0" y1="77.2" x2="252.0" y2="77.2" stroke="#6b7280" stroke-width="1.2"/>
  <text x="240.0" y="81.2" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">π</text>
  <line x1="244.0" y1="226.8" x2="252.0" y2="226.8" stroke="#6b7280" stroke-width="1.2"/>
  <text x="240.0" y="230.8" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">−π</text>
  <text x="46.0" y="26.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">Odde utvidelse av f(x) = π − x på [0,π], periode 2π</text>
  <text x="46.0" y="42.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Sprang i x = 0, ±2π — alle med midlingsverdi 0.</text>
  <path d="M54.0 147.2 L87.7 187.0 L121.4 226.8" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <path d="M121.4 77.2 L184.7 152.0 L248.0 226.8" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <path d="M248.0 77.2 L311.3 152.0 L374.6 226.8" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <path d="M374.6 77.2 L408.3 117.0 L442.0 156.8" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <circle cx="121.4" cy="152.0" r="4.2" fill="#2563eb"/>
  <circle cx="248.0" cy="152.0" r="4.2" fill="#2563eb"/>
  <circle cx="374.6" cy="152.0" r="4.2" fill="#2563eb"/>
  <text x="255.1" y="69.2" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">sprang 2π</text>
  <text x="46.0" y="292.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">Odde → alle aₙ = 0. Rekka er en ren sinusrekke.</text>
  <text x="46.0" y="310.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">I x = π/2 er utvidelsen kontinuerlig, så rekka gir funksjonsverdien π/2.</text>
  <text x="46.0" y="328.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">I x = 0 gir rekka 0, ikke π — det er den vanligste feilen.</text>
</svg>
