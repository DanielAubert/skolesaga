<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img">
  <title>Gitteret med falsk node ved en Neumann-rand</title>
  <text x="16.0" y="18.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" font-weight="normal">Randverdiproblem på [0,1] med h = 0,25: fire delintervall, fem gitterpunkter</text>
  <text x="16.0" y="32.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" font-weight="normal">og én fiktiv node utenfor intervallet.</text>
  <circle cx="70.0" cy="150.0" r="6.0" fill="#059669" stroke="none" stroke-width="1.0"/>
  <text x="70.0" y="176.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">x₀ = 0</text>
  <text x="70.0" y="134.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="normal">U₀</text>
  <circle cx="142.0" cy="150.0" r="6.0" fill="#2563eb" stroke="none" stroke-width="1.0"/>
  <text x="142.0" y="176.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">x₁</text>
  <text x="142.0" y="134.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="normal">U₁</text>
  <circle cx="214.0" cy="150.0" r="6.0" fill="#2563eb" stroke="none" stroke-width="1.0"/>
  <text x="214.0" y="176.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">x₂</text>
  <text x="214.0" y="134.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="normal">U₂</text>
  <circle cx="286.0" cy="150.0" r="6.0" fill="#2563eb" stroke="none" stroke-width="1.0"/>
  <text x="286.0" y="176.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">x₃</text>
  <text x="286.0" y="134.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="normal">U₃</text>
  <circle cx="358.0" cy="150.0" r="6.0" fill="#8b5cf6" stroke="none" stroke-width="1.0"/>
  <text x="358.0" y="176.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">x₄ = 1</text>
  <text x="358.0" y="134.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="normal">U₄</text>
  <circle cx="430.0" cy="150.0" r="6.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <text x="430.0" y="176.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">x₅ = 1,25</text>
  <text x="430.0" y="134.0" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="normal">U₅</text>
  <line x1="40.0" y1="150.0" x2="464.0" y2="150.0" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="70.0" y1="194.0" x2="358.0" y2="194.0" stroke="#6b7280" stroke-width="1.0"/>
  <line x1="70.0" y1="189.0" x2="70.0" y2="199.0" stroke="#6b7280" stroke-width="1.0"/>
  <line x1="358.0" y1="189.0" x2="358.0" y2="199.0" stroke="#6b7280" stroke-width="1.0"/>
  <text x="214.0" y="212.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="normal">selve intervallet</text>
  <line x1="358.0" y1="194.0" x2="430.0" y2="194.0" stroke="#dc2626" stroke-width="1.0" stroke-dasharray="4 3"/>
  <text x="394.0" y="212.0" fill="#dc2626" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="normal">utenfor</text>
  <path d="M286.0 104.0 L329.2 78.0 L386.8 78.0 L430.0 104.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="358.0" y="70.0" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">U₅ = U₃  (fra u′(1) = 0)</text>
  <text x="358.0" y="50.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="normal">Sentraldifferansen i randpunktet:</text>
  <text x="358.0" y="36.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">(U₅ − U₃)/(2h) = 0</text>
  <text x="20.0" y="262.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="start" font-weight="normal">Grønn: kjent Dirichlet-verdi.  Blå: ukjente indre verdier.  Lilla: ukjent randverdi der u′ er gitt.</text>
  <text x="20.0" y="278.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="start" font-weight="normal">Rød ring: den falske noden. Den finnes ikke i problemet, men skjemaet i x₄ trenger en verdi der.</text>
  <text x="20.0" y="294.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="start" font-weight="normal">Randbetingelsen u′(1) = 0 gir U₅ = U₃, og innsatt i skjemaet forsvinner U₅ igjen — igjen står</text>
  <text x="20.0" y="310.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="start" font-weight="normal">en rad med 2U₃ i stedet for U₃ + U₅. Faktoren 2 er det som oftest glemmes.</text>
</svg>
