  <text x="46.0" y="296.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">Utvidelsen er odde, så rekka er en ren sinusrekke med halvperiode L = 2.</text>
  <text x="46.0" y="314.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">I x = 2 er den kontinuerlig og lik 0 — der er det ingen midling å gjøre.</text>
