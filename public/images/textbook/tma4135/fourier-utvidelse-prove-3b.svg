  <text x="46.0" y="26.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">Odde utvidelse av f(x) = 2 − x på [0,2], periode 4</text>
  <text x="46.0" y="42.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Sprang i x = 0, ±4 — midlingsverdi 0. Kontinuerlig i x = ±2.</text>
