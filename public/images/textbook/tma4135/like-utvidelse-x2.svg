  <text x="46.0" y="24.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">Like utvidelse av f(x) = x² på [0,π], periode 2π</text>
  <text x="46.0" y="40.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Ingen sprang — bare knekker i x = ±π, ±3π. Rekka gir funksjonsverdien overalt.</text>
