  <text x="46.0" y="292.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">Den like utvidelsen er x² selv på [−π,π], gjentatt med periode 2π.</text>
  <text x="46.0" y="310.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">Rekka er en ren cosinusrekke, og den konvergerer mot f i hvert eneste punkt.</text>
