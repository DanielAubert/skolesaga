<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img">
  <title>Stabilitetsintervall på den reelle aksen for Euler, Heun og RK4</title>
  <text x="46.0" y="26.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">Stabilitetsintervall på den reelle aksen, z = λh</text>
  <text x="46.0" y="44.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Systemet har egenverdiene λ = −3 og λ = −9. Den mest negative binder.</text>
  <line x1="60.0" y1="120.0" x2="455.0" y2="120.0" stroke="#6b7280" stroke-width="1.2"/>
  <path d="M455.0 120.0 l-7 -3.5 l0 7 z" fill="#6b7280"/>
  <path d="M180.0 120.0 L380.0 120.0" fill="none" stroke="#8b5cf6" stroke-width="5.0"/>
  <circle cx="180.0" cy="120.0" r="4.5" fill="#8b5cf6"/>
  <circle cx="380.0" cy="120.0" r="4.5" fill="#8b5cf6"/>
  <text x="180.0" y="140.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">−2</text>
  <text x="380.0" y="140.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">0</text>
  <text x="60.0" y="106.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Euler og Heun:  −2 ≤ z ≤ 0</text>
  <line x1="60.0" y1="190.0" x2="455.0" y2="190.0" stroke="#6b7280" stroke-width="1.2"/>
  <path d="M455.0 190.0 l-7 -3.5 l0 7 z" fill="#6b7280"/>
  <path d="M101.5 190.0 L380.0 190.0" fill="none" stroke="#2563eb" stroke-width="5.0"/>
  <circle cx="101.5" cy="190.0" r="4.5" fill="#2563eb"/>
  <circle cx="380.0" cy="190.0" r="4.5" fill="#2563eb"/>
  <text x="101.5" y="210.0" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">−2,785</text>
  <text x="380.0" y="210.0" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">0</text>
  <text x="60.0" y="176.0" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">RK4:  −2,785 ≤ z ≤ 0</text>
  <text x="459.0" y="194.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">z</text>
  <line x1="180.0" y1="90.0" x2="180.0" y2="112.0" stroke="#8b5cf6" stroke-width="1.0" stroke-dasharray="4 3"/>
  <text x="180.0" y="84.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">z = λh = −9 · 2/9</text>
  <line x1="101.5" y1="224.0" x2="101.5" y2="242.0" stroke="#2563eb" stroke-width="1.0" stroke-dasharray="4 3"/>
  <text x="101.5" y="254.0" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">z = −9 · 0,3094</text>
  <text x="46.0" y="262.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Er z utenfor intervallet, vokser den numeriske løsningen selv om den eksakte dør ut.</text>
</svg>
