<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img">
  <title>Stensilene til det eksplisitte skjemaet og til Crank-Nicolson</title>
  <text x="16.0" y="18.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" font-weight="normal">Stensil: hvilke gitterpunkter formelen bruker</text>
  <text x="16.0" y="32.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" font-weight="normal">Blå = kjent på nivå n. Rød = ukjent på nivå n+1.</text>
  <line x1="66.0" y1="220.0" x2="218.0" y2="220.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <line x1="66.0" y1="156.0" x2="218.0" y2="156.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <text x="56.0" y="224.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" font-weight="normal">n</text>
  <text x="56.0" y="160.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" font-weight="normal">n+1</text>
  <text x="90.0" y="254.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">i−1</text>
  <line x1="90.0" y1="234.0" x2="90.0" y2="142.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <text x="142.0" y="254.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">i</text>
  <line x1="142.0" y1="234.0" x2="142.0" y2="142.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <text x="194.0" y="254.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">i+1</text>
  <line x1="194.0" y1="234.0" x2="194.0" y2="142.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <circle cx="90.0" cy="220.0" r="5.0" fill="#2563eb" stroke="none" stroke-width="1.0"/>
  <circle cx="142.0" cy="220.0" r="5.0" fill="#2563eb" stroke="none" stroke-width="1.0"/>
  <circle cx="194.0" cy="220.0" r="5.0" fill="#2563eb" stroke="none" stroke-width="1.0"/>
  <circle cx="90.0" cy="156.0" r="3.4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="142.0" cy="156.0" r="5.6" fill="#dc2626" stroke="none" stroke-width="1.0"/>
  <circle cx="194.0" cy="156.0" r="3.4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="90.0" y1="220.0" x2="142.0" y2="156.0" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="142.0" y1="220.0" x2="142.0" y2="156.0" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="194.0" y1="220.0" x2="142.0" y2="156.0" stroke="#2563eb" stroke-width="1.3"/>
  <text x="142.0" y="130.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Eksplisitt</text>
  <text x="142.0" y="276.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="normal">1 ukjent — ren innsetting</text>
  <line x1="296.0" y1="220.0" x2="448.0" y2="220.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <line x1="296.0" y1="156.0" x2="448.0" y2="156.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <text x="286.0" y="224.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" font-weight="normal">n</text>
  <text x="286.0" y="160.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" font-weight="normal">n+1</text>
  <text x="320.0" y="254.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">i−1</text>
  <line x1="320.0" y1="234.0" x2="320.0" y2="142.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <text x="372.0" y="254.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">i</text>
  <line x1="372.0" y1="234.0" x2="372.0" y2="142.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <text x="424.0" y="254.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">i+1</text>
  <line x1="424.0" y1="234.0" x2="424.0" y2="142.0" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>
  <circle cx="320.0" cy="220.0" r="5.0" fill="#2563eb" stroke="none" stroke-width="1.0"/>
  <circle cx="372.0" cy="220.0" r="5.0" fill="#2563eb" stroke="none" stroke-width="1.0"/>
  <circle cx="424.0" cy="220.0" r="5.0" fill="#2563eb" stroke="none" stroke-width="1.0"/>
  <circle cx="320.0" cy="156.0" r="5.6" fill="#dc2626" stroke="none" stroke-width="1.0"/>
  <circle cx="372.0" cy="156.0" r="5.6" fill="#dc2626" stroke="none" stroke-width="1.0"/>
  <circle cx="424.0" cy="156.0" r="5.6" fill="#dc2626" stroke="none" stroke-width="1.0"/>
  <line x1="320.0" y1="220.0" x2="372.0" y2="156.0" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="372.0" y1="220.0" x2="372.0" y2="156.0" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="424.0" y1="220.0" x2="372.0" y2="156.0" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="320.0" y1="156.0" x2="372.0" y2="156.0" stroke="#dc2626" stroke-width="1.3"/>
  <line x1="424.0" y1="156.0" x2="372.0" y2="156.0" stroke="#dc2626" stroke-width="1.3"/>
  <text x="372.0" y="130.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Crank–Nicolson</text>
  <text x="372.0" y="276.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="normal">3 ukjente — tridiagonalt system</text>
  <text x="20.0" y="300.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="start" font-weight="normal">Det eksplisitte skjemaet har den ukjente alene på nivå n+1. Crank–Nicolson bruker tre punkter på</text>
  <text x="20.0" y="316.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="start" font-weight="normal">hvert nivå, så alle de indre verdiene på nivå n+1 må finnes samtidig — ett likningssystem per tidssteg.</text>
</svg>
