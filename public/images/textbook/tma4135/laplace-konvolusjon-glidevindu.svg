<text x="324.0" y="170" fill="#6b7280" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">τ = t</text>
<text x="60.0" y="170" fill="#6b7280" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">0</text>
<text x="99.6" y="102.0" fill="#2563eb" font-family="system-ui,sans-serif" font-size="14">g(τ)</text>
<text x="198.6" y="80.4" fill="#d97706" font-family="system-ui,sans-serif" font-size="14">y(t − τ)</text>
<text x="60" y="24" fill="#6b7280" font-family="system-ui,sans-serif" font-size="13">Integranden i (g*y)(t): g(τ) ganget med den speilvendte y(t − τ)</text>
<text x="60" y="212" fill="#6b7280" font-family="system-ui,sans-serif" font-size="13">Konvolusjonen summerer produktet over det grønne feltet:</text>
<text x="60" y="234" fill="#6b7280" font-family="system-ui,sans-serif" font-size="14">(g*y)(t) = integralet fra 0 til t av g(τ)·y(t − τ) dτ</text>
<text x="60" y="262" fill="#6b7280" font-family="system-ui,sans-serif" font-size="13">Når t vokser, glir den stiplede kurven mot høyre og feltet blir bredere.</text>
<text x="60" y="284" fill="#6b7280" font-family="system-ui,sans-serif" font-size="13">Argumentene summerer alltid til t:  τ + (t − τ) = t.</text>
