<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img">
  <title>Gitter for randverdiproblemet med falsk node til venstre</title>
  <line x1="58.0" y1="170.0" x2="455.0" y2="170.0" stroke="#6b7280" stroke-width="1.4"/>
  <path d="M455.0 170.0 l-7 -3.5 l0 7 z" fill="#6b7280"/>
  <text x="459.0" y="174.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">x</text>
  <circle cx="70.0" cy="170.0" r="6.0" fill="none" stroke="#ea580c" stroke-width="1.8"/>
  <text x="70.0" y="194.0" fill="#ea580c" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">x₋₁ = −h</text>
  <text x="70.0" y="154.0" fill="#ea580c" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">U₋₁</text>
  <circle cx="135.0" cy="170.0" r="6.0" fill="#8b5cf6"/>
  <text x="135.0" y="194.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">x₀ = 0</text>
  <text x="135.0" y="154.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">U₀</text>
  <circle cx="200.0" cy="170.0" r="6.0" fill="#8b5cf6"/>
  <text x="200.0" y="194.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">x₁</text>
  <text x="200.0" y="154.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">U₁</text>
  <circle cx="265.0" cy="170.0" r="6.0" fill="#8b5cf6"/>
  <text x="265.0" y="194.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">x₂</text>
  <text x="265.0" y="154.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">U₂</text>
  <circle cx="330.0" cy="170.0" r="6.0" fill="#8b5cf6"/>
  <text x="330.0" y="194.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">x₃</text>
  <text x="330.0" y="154.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">U₃</text>
  <circle cx="395.0" cy="170.0" r="6.0" fill="#2563eb"/>
  <text x="395.0" y="194.0" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">x₄ = 1</text>
  <text x="395.0" y="154.0" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">U₄</text>
  <line x1="77.0" y1="170.0" x2="128.0" y2="170.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 3"/>
  <line x1="142.0" y1="170.0" x2="193.0" y2="170.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 3"/>
  <line x1="207.0" y1="170.0" x2="258.0" y2="170.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 3"/>
  <line x1="272.0" y1="170.0" x2="323.0" y2="170.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 3"/>
  <line x1="337.0" y1="170.0" x2="388.0" y2="170.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 3"/>
  <text x="46.0" y="26.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">u″ − 4u = −4x  på [0,1],  u′(0) = 0,  u(1) = 1,  h = 1/4</text>
  <text x="46.0" y="44.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Fire ukjente: U₀, U₁, U₂, U₃.  U₄ = 1 er kjent og flyttes til høyresiden.</text>
  <text x="46.0" y="62.0" fill="#ea580c" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">Den falske noden U₋₁ ligger utenfor intervallet og elimineres med u′(0) = 0.</text>
  <line x1="70.0" y1="130.0" x2="70.0" y2="160.0" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="200.0" y1="130.0" x2="200.0" y2="160.0" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M70.0 130.0 L200.0 130.0" fill="none" stroke="#ea580c" stroke-width="1.6"/>
  <text x="135.0" y="124.0" fill="#ea580c" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">U₋₁ = U₁  (speiling)</text>
  <text x="395.0" y="214.0" fill="#2563eb" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Dirichlet</text>
  <text x="135.0" y="214.0" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Neumann</text>
</svg>
