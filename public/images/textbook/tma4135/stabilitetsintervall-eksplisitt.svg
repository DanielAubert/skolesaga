<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img">
  <title>Stabilitetsintervallet for det eksplisitte skjemaet</title>
  <text x="16.0" y="18.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" font-weight="normal">Forsterkningsfaktor ξ(θ) = 1 − 4r sin²(θ/2) for den verste moden (θ = π)</text>
  <text x="16.0" y="32.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" font-weight="normal">Skjemaet er stabilt så lenge |1 − 4r| ≤ 1, altså 0 &lt; r ≤ 1/2.</text>
  <line x1="50.0" y1="120.0" x2="452.0" y2="120.0" stroke="#6b7280" stroke-width="1.4"/>
  <path d="M452.0 120.0 L445.0 116.5 L445.0 123.5 z" fill="#6b7280"/>
  <text x="460.0" y="124.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="normal">r</text>
  <rect x="70.0" y="111.0" width="180.0" height="18.0" fill="#059669" stroke="none" stroke-width="1.0" opacity="0.20"/>
  <rect x="250.0" y="111.0" width="180.0" height="18.0" fill="#dc2626" stroke="none" stroke-width="1.0" opacity="0.18"/>
  <line x1="70.0" y1="115.0" x2="70.0" y2="125.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="70.0" y="140.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">0</text>
  <line x1="160.0" y1="115.0" x2="160.0" y2="125.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="160.0" y="140.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">0,25</text>
  <line x1="250.0" y1="115.0" x2="250.0" y2="125.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="250.0" y="140.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">1/2</text>
  <line x1="340.0" y1="115.0" x2="340.0" y2="125.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="340.0" y="140.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">0,75</text>
  <line x1="430.0" y1="115.0" x2="430.0" y2="125.0" stroke="#6b7280" stroke-width="1.2"/>
  <text x="430.0" y="140.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">1</text>
  <circle cx="250.0" cy="120.0" r="4.2" fill="#059669" stroke="none" stroke-width="1.0"/>
  <text x="160.0" y="102.0" fill="#059669" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">STABILT</text>
  <text x="340.0" y="102.0" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">USTABILT</text>
  <text x="250.0" y="160.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="normal">r = 1/2 er med: der er |ξ| = 1 for den verste moden</text>
  <text x="16.0" y="176.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" font-weight="normal">|ξ| som funksjon av r for den verste moden:</text>
