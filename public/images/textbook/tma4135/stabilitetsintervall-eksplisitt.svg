  <line x1="60.0" y1="223.3" x2="68.0" y2="223.3" stroke="#6b7280" stroke-width="1.0"/>
  <text x="56.0" y="227.3" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="end" font-weight="normal">2</text>
  <line x1="60.0" y1="190.0" x2="68.0" y2="190.0" stroke="#6b7280" stroke-width="1.0"/>
  <text x="56.0" y="194.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="end" font-weight="normal">3</text>
