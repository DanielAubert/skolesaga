  <path d="M446.0 290.0 L439.0 286.5 L439.0 293.5 z" fill="#6b7280"/>
  <text x="452.0" y="294.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" font-weight="normal">r</text>
  <line x1="64.0" y1="296.0" x2="64.0" y2="180.0" stroke="#6b7280" stroke-width="1.4"/>
  <path d="M64.0 180.0 L60.5 187.0 L67.5 187.0 z" fill="#6b7280"/>
  <text x="58.0" y="176.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" text-anchor="start" font-weight="normal">|ξ|</text>
  <line x1="60.0" y1="290.0" x2="68.0" y2="290.0" stroke="#6b7280" stroke-width="1.0"/>
  <text x="56.0" y="294.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="end" font-weight="normal">0</text>
