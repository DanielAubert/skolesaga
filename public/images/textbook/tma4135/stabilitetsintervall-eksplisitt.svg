  <text x="256.0" y="196.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="start" font-weight="normal">|ξ| = 1 ved r = 1/2</text>
  <text x="20.0" y="314.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="start" font-weight="normal">Til venstre for 1/2 ligger kurven under 1 og alle moder dør ut. Til høyre vokser den</text>
  <text x="20.0" y="330.0" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="start" font-weight="normal">verste moden med faktoren |1 − 4r| for hvert tidssteg.</text>
</svg>
