<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Lønnskurven skiftes parallelt opp når z-W stiger fra 0 til 0,08, mens priskurven er uendret vannrett i 0,833. Skjæringen flyttes fra A ved u-n omtrent 0,42 til B ved u-n omtrent 0,62 lenger til høyre.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic" fill="#000">u</text>
  <text x="38" y="26" font-size="16" font-style="italic" fill="#000">W/P</text>
  <line x1="70" y1="95.42" x2="400" y2="95.42" stroke="#2471a3" stroke-width="2.4"/>
  <text x="322" y="86.42" font-size="15" font-weight="bold" fill="#2471a3">Priskurve</text>
  <line x1="70" y1="54.5" x2="410" y2="152.7" stroke="#c0392b" stroke-width="2.4" stroke-opacity="0.55"/>
  <line x1="70" y1="34.86" x2="410" y2="133.06" stroke="#c0392b" stroke-width="2.4"/>
  <text x="348" y="174" font-size="13" font-weight="bold" fill="#c0392b">z<tspan font-size="9" dy="-5">W</tspan><tspan font-size="13" dy="5"> = 0</tspan></text>
  <text x="96" y="34" font-size="13" font-weight="bold" fill="#c0392b">z<tspan font-size="9" dy="-5">W</tspan><tspan font-size="13" dy="5"> = 0,08</tspan></text>
  <line x1="120" y1="66.94" x2="120" y2="60.3" stroke="#666" stroke-width="1.5"/><polygon points="120,51.3 124.2,60.3 115.8,60.3" fill="#666"/>
  <line x1="211.67" y1="95.42" x2="211.67" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="211.67" cy="95.42" r="4" fill="#222"/>
  <text x="196.67" y="88.42" font-size="15" font-weight="bold" fill="#000">A</text>
  <text x="203.67" y="318" font-size="13" font-style="italic" fill="#000">u&#8319;&#8320;</text>
  <text x="198.67" y="334" font-size="12" font-style="italic" fill="#000">0,42</text>
  <line x1="279.67" y1="95.42" x2="279.67" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="279.67" cy="95.42" r="4" fill="#222"/>
  <text x="285.67" y="88.42" font-size="15" font-weight="bold" fill="#000">B</text>
  <text x="271.67" y="318" font-size="13" font-style="italic" fill="#000">u&#8319;&#8321;</text>
  <text x="266.67" y="334" font-size="12" font-style="italic" fill="#000">0,62</text>
  <line x1="66" y1="95.42" x2="70" y2="95.42" stroke="#222" stroke-width="1.2"/>
  <text x="28" y="100.42" font-size="13" font-style="italic" fill="#000">0,833</text>
</svg>
