<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 620" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Todelt IS-RR-PK-diagram for pandemi med to sjokk. Øvre panel: IS skifter mot venstre og RR opp; likevekten flytter fra A til B, og Y faller klart fra Y0 til Y1. Nedre panel: PK skifter opp til PK1, og to alternative utfall ligger begge på PK1: B-merket-opp over utgangsinflasjonen pi0 hvis kostnadssjokket dominerer, og B-merket-ned under pi0 hvis etterspørselsfallet dominerer. En lilla dobbeltpil markerer at nettoeffekten på inflasjonen er ubestemt.">
