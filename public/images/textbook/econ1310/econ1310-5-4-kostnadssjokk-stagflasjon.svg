<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Positivt kostnadssjokk: I panel (a) ligger IS fast mens RR skifter opp, slik at ny likevekt B har hoyere rente i og lavere BNP Y. I panel (b) skifter Phillips-kurven PK opp, slik at inflasjonen pi stiger mens BNP Y faller. Utfallet er stagflasjon.">
  <rect width="720" height="380" fill="#ffffff"/>

  <!-- ===================== PANEL (a): IS-RR i (Y, i)-rommet ===================== -->
  <text x="70" y="28" font-size="15" font-weight="bold">(a) IS–RR: rente opp, BNP ned</text>
  <!-- Akser -->
  <line x1="70" y1="320" x2="330" y2="320" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="320" x2="70" y2="50" stroke="#222" stroke-width="1.6"/>
  <polygon points="330,320 322,316 322,324" fill="#222"/>
  <polygon points="70,50 66,58 74,58" fill="#222"/>
  <text x="336" y="325" font-size="16" font-style="italic">Y</text>
  <text x="60" y="46" font-size="16" font-style="italic">i</text>

  <!-- IS (fast, fallende, rod): fra (85,90) til (315,300) -->
  <line x1="85" y1="90" x2="315" y2="300" stroke="#c0392b" stroke-width="2.4"/>
  <text x="292" y="300" font-size="15" fill="#c0392b" font-weight="bold">IS</text>

  <!-- RR gammel (stigende, bla): fra (90,300) til (315,110) -->
  <line x1="90" y1="300" x2="315" y2="110" stroke="#2471a3" stroke-width="2.4"/>
  <text x="300" y="122" font-size="14" fill="#2471a3" font-weight="bold">RR</text>
  <!-- RR ny (skift opp, morkere bla, stiplet-tykk): fra (90,240) til (300,55) -->
  <line x1="90" y1="245" x2="300" y2="60" stroke="#1f5c86" stroke-width="2.4" stroke-dasharray="8 4"/>
  <text x="245" y="60" font-size="14" fill="#1f5c86" font-weight="bold">RR&#8242;</text>
  <!-- Skiftpil for RR (opp) -->
  <line x1="200" y1="196" x2="200" y2="150" stroke="#1f5c86" stroke-width="1.4"/>
  <polygon points="200,146 196,155 204,155" fill="#1f5c86"/>

  <!-- Gammel likevekt A: IS x RR. Los: IS y = 90 + (x-85)*(210/230); RR y = 300 - (x-90)*(190/225)
       Skjaering ca ved x=205, y=200 -->
  <circle cx="207" cy="201" r="4" fill="#222"/>
  <text x="213" y="196" font-size="14" font-weight="bold">A</text>
  <!-- Ny likevekt B: IS x RR'. RR' y = 245 - (x-90)*(185/210); IS y = 90 + (x-85)*(210/230)
       Skjaering ca ved x=174, y=171 -->
  <circle cx="174" cy="171" r="4" fill="#222"/>
  <text x="158" y="167" font-size="14" font-weight="bold">B</text>

  <!-- Hjelpelinjer A -->
  <line x1="70" y1="201" x2="207" y2="201" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="207" y1="201" x2="207" y2="320" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Hjelpelinjer B -->
  <line x1="70" y1="171" x2="174" y2="171" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="174" y1="171" x2="174" y2="320" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Aksemerker i -->
  <text x="48" y="206" font-size="13" font-style="italic">i&#8320;</text>
  <text x="48" y="169" font-size="13" font-style="italic">i&#8321;</text>
  <!-- Aksemerker Y -->
  <text x="200" y="336" font-size="13" font-style="italic">Y&#8320;</text>
  <text x="165" y="336" font-size="13" font-style="italic">Y&#8321;</text>

  <!-- ===================== PANEL (b): PK i (Y, pi)-rommet ===================== -->
  <text x="410" y="28" font-size="15" font-weight="bold">(b) PK: inflasjon opp, BNP ned</text>
  <!-- Akser -->
  <line x1="410" y1="320" x2="690" y2="320" stroke="#222" stroke-width="1.6"/>
  <line x1="410" y1="320" x2="410" y2="50" stroke="#222" stroke-width="1.6"/>
  <polygon points="690,320 682,316 682,324" fill="#222"/>
  <polygon points="410,50 406,58 414,58" fill="#222"/>
  <text x="696" y="325" font-size="16" font-style="italic">Y</text>
  <text x="398" y="46" font-size="16" font-style="italic">&#960;</text>

  <!-- PK gammel (stigende, gronn): fra (425,300) til (670,110) -->
  <line x1="425" y1="300" x2="670" y2="110" stroke="#1e8449" stroke-width="2.4"/>
  <text x="655" y="122" font-size="14" fill="#1e8449" font-weight="bold">PK</text>
  <!-- PK ny (skift opp, stiplet): fra (425,240) til (655,55) -->
  <line x1="425" y1="245" x2="650" y2="60" stroke="#14602f" stroke-width="2.4" stroke-dasharray="8 4"/>
  <text x="600" y="58" font-size="14" fill="#14602f" font-weight="bold">PK&#8242;</text>
  <!-- Skiftpil for PK (opp) -->
  <line x1="540" y1="196" x2="540" y2="150" stroke="#14602f" stroke-width="1.4"/>
  <polygon points="540,146 536,155 544,155" fill="#14602f"/>

  <!-- Y-verdiene overfores fra panel (a): Y0 (bredere) og Y1 (smalere).
       Panel (a): Y0 ved x=205, Y1 ved x=180. Skala her: panel (a) origo 70, panel (b) origo 410.
       Y0 -> 410 + (205-70) = 545 ; Y1 -> 410 + (180-70) = 520 -->
  <!-- Punkt A' (gammel): pa PK ved Y0=545. PK y = 300 - (545-425)*(190/245) = 300-93 = 207 -->
  <circle cx="545" cy="207" r="4" fill="#222"/>
  <text x="551" y="203" font-size="14" font-weight="bold">A</text>
  <!-- Punkt B' (ny): pa PK' ved Y1=520. PK' y = 245 - (520-425)*(185/225) = 245-78 = 167 -->
  <circle cx="520" cy="167" r="4" fill="#222"/>
  <text x="504" y="162" font-size="14" font-weight="bold">B</text>

  <!-- Hjelpelinjer A' -->
  <line x1="410" y1="207" x2="545" y2="207" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="545" y1="207" x2="545" y2="320" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Hjelpelinjer B' -->
  <line x1="410" y1="167" x2="520" y2="167" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="520" y1="167" x2="520" y2="320" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Aksemerker pi -->
  <text x="386" y="212" font-size="13" font-style="italic">&#960;&#8320;</text>
  <text x="386" y="172" font-size="13" font-style="italic">&#960;&#8321;</text>
  <!-- Aksemerker Y -->
  <text x="538" y="336" font-size="13" font-style="italic">Y&#8320;</text>
  <text x="511" y="336" font-size="13" font-style="italic">Y&#8321;</text>

  <!-- Felles undertekst: stagflasjon -->
  <text x="360" y="366" font-size="13" fill="#7d3c98" font-weight="bold" text-anchor="middle">Stagflasjon: &#916;Y &lt; 0, &#916;i &gt; 0, &#916;&#960; &gt; 0</text>
</svg>
