<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Akser -->
  <line x1="60" y1="320" x2="60" y2="30" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr6)"/>
  <line x1="60" y1="320" x2="450" y2="320" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr6)"/>
  <text x="54" y="42" fill="#6b7280" font-size="16" font-style="italic" text-anchor="end">ΔY</text>
  <text x="440" y="338" fill="#6b7280" font-size="12" text-anchor="middle">runde</text>

  <!-- Totaleffekten: stiplet asymptote -->
  <line x1="60" y1="60" x2="450" y2="60" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <text x="446" y="52" fill="#6b7280" font-size="12.5" text-anchor="end">Totaleffekt = 100/(1 − 0,6) = 250</text>

  <!-- Førsterunden (direkte effekt): rødt trinn -->
  <line x1="80" y1="320" x2="80" y2="216" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Multiplikatorrundene: blå, avtagende trinn -->
  <path d="M80,216 H140 V153.6 H200 V116.2 H260 V93.7 H320 V80.2 H380" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Antydet fortsettelse mot totaleffekten -->
  <line x1="380" y1="80.2" x2="426" y2="71" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 4" opacity="0.8"/>

  <!-- Trinn-tall (tilveksten i hver runde) -->
  <text x="110" y="206" fill="#ef4444" font-size="12.5" font-weight="bold" text-anchor="middle">100</text>
  <text x="170" y="144" fill="#3b82f6" font-size="12.5" font-weight="bold" text-anchor="middle">+60</text>
  <text x="230" y="107" fill="#3b82f6" font-size="12.5" font-weight="bold" text-anchor="middle">+36</text>
  <text x="290" y="85" fill="#3b82f6" font-size="12.5" font-weight="bold" text-anchor="middle">+21,6</text>
  <text x="350" y="72" fill="#3b82f6" font-size="12.5" font-weight="bold" text-anchor="middle">…</text>

  <!-- Runde-nummer under aksen -->
  <text x="110" y="338" fill="#6b7280" font-size="12" text-anchor="middle">1</text>
  <text x="170" y="338" fill="#6b7280" font-size="12" text-anchor="middle">2</text>
  <text x="230" y="338" fill="#6b7280" font-size="12" text-anchor="middle">3</text>
  <text x="290" y="338" fill="#6b7280" font-size="12" text-anchor="middle">4</text>
  <text x="350" y="338" fill="#6b7280" font-size="12" text-anchor="middle">5</text>

  <!-- Forklaringer -->
  <text x="90" y="243" fill="#ef4444" font-size="11.5" font-style="italic">førsterunden (direkte)</text>
  <text x="212" y="140" fill="#3b82f6" font-size="11.5" font-style="italic">multiplikatorrundene</text>
  <text x="255" y="354" fill="#6b7280" font-size="11.5" font-style="italic" text-anchor="middle">hver runde = 0,6 × forrige (tilbakekoblingsandel k = c₁(1−t) + b₁ = 0,6)</text>
</svg>
