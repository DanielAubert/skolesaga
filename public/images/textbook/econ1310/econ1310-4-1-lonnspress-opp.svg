<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Lønns- og priskurvediagram i (u, W/P) der lønnskurven skiftes opp fra WS0 til WS1 (pil merket z-W opp) mot en uendret vannrett priskurve i høyden 0,8. Gammel likevekt A ligger ved u-n-0 = 0,4 og ny likevekt B ved u-n-1 = 0,5, begge på priskurven, slik at reallønnen er uendret mens likevektsledigheten stiger.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic" fill="#000">u</text>
  <text x="34" y="26" font-size="16" font-style="italic" fill="#000">W/P</text>
  <line x1="70" y1="200" x2="390" y2="200" stroke="#2471a3" stroke-width="2.4"/>
  <text x="330" y="192" font-size="15" font-weight="bold" fill="#2471a3">PS (pris)</text>
  <line x1="70" y1="120" x2="278" y2="250" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="70" y1="100" x2="278" y2="230" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="284" y="258" font-size="14" font-weight="bold" fill="#c0392b">WS&#8320;</text>
  <text x="284" y="232" font-size="14" font-weight="bold" fill="#c0392b">WS&#8321;</text>
  <line x1="100" y1="136.75" x2="100" y2="129.75" stroke="#7d3c98" stroke-width="1.8"/><polygon points="100,120.75 104.2,129.75 95.8,129.75" fill="#7d3c98"/>
  <text x="86" y="106" font-size="13" font-weight="bold" fill="#7d3c98">z<tspan font-size="9" dy="-5">W</tspan><tspan font-size="13" dy="5">&#8593;</tspan></text>
  <circle cx="198" cy="200" r="4" fill="#222"/>
  <line x1="198" y1="200" x2="198" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="198" y1="300" x2="198" y2="305" stroke="#222" stroke-width="1.2"/>
  <text x="190" y="336" font-size="13" font-style="italic" fill="#000">0,4</text>
  <circle cx="230" cy="200" r="4" fill="#222"/>
  <line x1="230" y1="200" x2="230" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="230" y1="300" x2="230" y2="305" stroke="#222" stroke-width="1.2"/>
  <text x="222" y="336" font-size="13" font-style="italic" fill="#000">0,5</text>
  <text x="180" y="214" font-size="15" font-weight="bold" fill="#000">A</text>
  <text x="236" y="192" font-size="15" font-weight="bold" fill="#000">B</text>
  <text x="188" y="320" font-size="13" font-style="italic" fill="#000">u&#8319;&#8320;</text>
  <text x="222" y="320" font-size="13" font-style="italic" fill="#000">u&#8319;&#8321;</text>
  <line x1="66" y1="200" x2="70" y2="200" stroke="#222" stroke-width="1.2"/>
  <text x="42" y="205" font-size="13" font-style="italic" fill="#000">0,8</text>
</svg>
