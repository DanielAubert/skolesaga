<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ================= Øvre panel: (Y, i) ================= -->
  <line x1="60" y1="280" x2="60" y2="34" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="60" y1="280" x2="450" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr2)"/>
  <text x="46" y="44" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">i</text>
  <text x="462" y="285" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">Y</text>

  <!-- Stiplede hjelpelinjer: A -->
  <line x1="60" y1="173" x2="244" y2="173" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="244" y1="173" x2="244" y2="600" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <!-- Stiplede hjelpelinjer: B -->
  <line x1="60" y1="153" x2="284" y2="153" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="284" y1="153" x2="284" y2="600" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- IS0: fallende -->
  <line x1="85" y1="70" x2="355" y2="245" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <text x="349" y="264" fill="#ef4444" font-size="15" font-weight="bold">IS<tspan dy="3.5" font-size="10">0</tspan></text>
  <!-- IS1: fallende, skiftet til høyre -->
  <line x1="155" y1="70" x2="425" y2="245" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 5"/>
  <text x="421" y="264" fill="#ef4444" font-size="15" font-weight="bold">IS<tspan dy="3.5" font-size="10">1</tspan></text>
  <!-- Skiftpil IS0 -> IS1 -->
  <line x1="158" y1="110" x2="206" y2="110" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr2)"/>

  <!-- RR: stigende (skifter IKKE) -->
  <line x1="85" y1="250" x2="435" y2="80" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <text x="440" y="83" fill="#3b82f6" font-size="15" font-weight="bold">RR</text>

  <!-- Likevektspunkter -->
  <circle cx="244" cy="173" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="230" y="190" fill="#6b7280" font-size="15" font-weight="bold">A</text>
  <circle cx="284" cy="153" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="292" y="144" fill="#6b7280" font-size="15" font-weight="bold">B</text>

  <!-- Akseverdier -->
  <text x="52" y="178" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">i<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="52" y="156" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">i<tspan dy="3.5" font-size="10">B</tspan></text>
  <text x="240" y="299" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="290" y="299" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">B</tspan></text>

  <!-- ================= Nedre panel: (Y, π) ================= -->
  <line x1="60" y1="600" x2="60" y2="354" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="60" y1="600" x2="450" y2="600" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr2)"/>
  <text x="46" y="364" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">π</text>
  <text x="462" y="605" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">Y</text>

  <!-- Stiplede hjelpelinjer -->
  <line x1="60" y1="491" x2="244" y2="491" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="60" y1="470" x2="284" y2="470" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- PK: stigende (skifter IKKE) -->
  <line x1="85" y1="575" x2="425" y2="395" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="430" y="398" fill="#059669" font-size="15" font-weight="bold">PK</text>

  <!-- Punkter -->
  <circle cx="244" cy="491" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="230" y="508" fill="#6b7280" font-size="15" font-weight="bold">A</text>
  <circle cx="284" cy="470" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="292" y="461" fill="#6b7280" font-size="15" font-weight="bold">B</text>

  <!-- Akseverdier -->
  <text x="52" y="496" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">π<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="52" y="473" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">π<tspan dy="3.5" font-size="10">B</tspan></text>
  <text x="240" y="619" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="290" y="619" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">B</tspan></text>
</svg>
