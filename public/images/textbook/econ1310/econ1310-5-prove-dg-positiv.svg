<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="IS-RR-PK-diagram ved positivt etterspørselssjokk (delta G større enn 0). Øvre panel (Y,i): IS skifter mot høyre langs uendret, stigende RR, og likevekten flytter fra A til B med høyere Y og høyere i. Nedre panel (Y,pi): høyere Y gir høyere punkt B på uendret, stigende Phillips-kurve, så inflasjonen stiger.">
