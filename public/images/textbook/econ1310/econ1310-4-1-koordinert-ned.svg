<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Koordinert lønnsdannelse: den fallende lønnskurven skiftes nedover fra WS0 til WS1 mot en uendret vannrett priskurve. Gammel likevekt A og ny likevekt B ligger begge på priskurven med samme reallønn, men B lenger til venstre, slik at likevektsledigheten faller fra uⁿ0 til uⁿ1 mens reallønnen er uendret.">
  <rect width="440" height="360" fill="#ffffff"/>
  <!-- Axes -->
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">u</text>
  <text x="48" y="26" font-size="15" font-style="italic">W/P</text>

  <!-- Priskurve (uendret, vannrett) i høyden A/(1+mu) -> y=150 -->
  <line x1="70" y1="150" x2="392" y2="150" stroke="#2471a3" stroke-width="2.4"/>
  <text x="300" y="142" font-size="14" fill="#2471a3" font-weight="bold">PS (uendret)</text>
  <text x="30" y="155" font-size="13" font-style="italic">A/(1+&#956;)</text>

  <!-- Gammel lønnskurve WS0 (fallende) -->
  <line x1="120" y1="80" x2="350" y2="200" stroke="#c0392b" stroke-width="2.4"/>
  <text x="352" y="196" font-size="14" fill="#c0392b" font-weight="bold">WS0</text>

  <!-- Ny lønnskurve WS1, parallell, skiftet ned/til venstre -->
  <line x1="80" y1="80" x2="310" y2="200" stroke="#c0392b" stroke-width="2.4"/>
  <text x="286" y="216" font-size="14" fill="#c0392b" font-weight="bold">WS1</text>

  <!-- Skiftpil ned -->
  <line x1="230" y1="120" x2="200" y2="148" stroke="#7d3c98" stroke-width="2"/>
  <polygon points="196,152 207,149 201,140" fill="#7d3c98"/>
  <text x="232" y="118" font-size="13" fill="#7d3c98" font-weight="bold">z&#x1D42;&#8595;</text>

  <!-- Likevekt A: WS0 krysser PS ved y=150. WS0: (120,80)->(350,200): t=(150-80)/120=0,583 -> x=120+0,583*230=254 -->
  <circle cx="254" cy="150" r="4" fill="#222"/>
  <text x="258" y="144" font-size="15" font-weight="bold">A</text>
  <line x1="254" y1="150" x2="254" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="238" y="316" font-size="13" font-style="italic">u&#8319;&#8320;</text>

  <!-- Likevekt B: WS1 krysser PS ved y=150. WS1: (80,80)->(310,200): t=0,583 -> x=80+0,583*230=214 -->
  <circle cx="214" cy="150" r="4" fill="#222"/>
  <text x="200" y="142" font-size="15" font-weight="bold">B</text>
  <line x1="214" y1="150" x2="214" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="198" y="316" font-size="13" font-style="italic">u&#8319;&#8321;</text>

  <!-- reallønn uendret markert -->
  <line x1="70" y1="150" x2="214" y2="150" stroke="#666" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
