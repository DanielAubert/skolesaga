<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="IS-RR-PK-diagram for et positivt kostnadssjokk. Øvre panel (Y vannrett, i loddrett): IS ligger fast mens RR skifter opp fra RR0 til RR1; ny likevekt B ligger oppe til venstre for A, slik at renten stiger og BNP faller. Nedre panel (Y vannrett, π loddrett): Phillips-kurven skifter opp fra PK0 til PK1, og inflasjonen ender høyere enn i utgangspunktet, men bare delvis så mye som skiftet — stagflasjon.">
  <rect width="480" height="660" fill="#ffffff"/>

  <!-- ================= Øvre panel: (Y, i) ================= -->
  <!-- Akser -->
  <line x1="70" y1="300" x2="450" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="40" stroke="#222" stroke-width="1.6"/>
  <polygon points="450,300 442,296 442,304" fill="#222"/>
  <polygon points="70,40 66,48 74,48" fill="#222"/>
  <text x="456" y="305" font-size="16" font-style="italic">Y</text>
  <text x="60" y="38" font-size="16" font-style="italic">i</text>

  <!-- IS: fallende (skifter IKKE) -->
  <line x1="90" y1="80" x2="420" y2="270" stroke="#c0392b" stroke-width="2.4"/>
  <text x="426" y="278" font-size="15" fill="#c0392b" font-weight="bold">IS</text>

  <!-- RR0: stigende -->
  <line x1="95" y1="265" x2="425" y2="85" stroke="#2471a3" stroke-width="2.4"/>
  <text x="430" y="82" font-size="15" fill="#2471a3" font-weight="bold">RR<tspan dy="4" font-size="10">0</tspan></text>
  <!-- RR1: stigende, skiftet OPP (med d1*Δz^π > 0) -->
  <line x1="95" y1="220" x2="392" y2="58" stroke="#2471a3" stroke-width="2.4" stroke-dasharray="9 5"/>
  <text x="360" y="52" font-size="15" fill="#2471a3" font-weight="bold">RR<tspan dy="4" font-size="10">1</tspan></text>
  <!-- Skiftpil RR0 -> RR1 (oppover) -->
  <line x1="150" y1="230" x2="150" y2="197" stroke="#666" stroke-width="1.6"/>
  <polygon points="150,192 146,200 154,200" fill="#666"/>

  <!--
    A = IS ∩ RR0 = (257,176).  B = IS ∩ RR1 = (217,153): oppe til venstre (i↑, Y↓).
  -->
  <!-- Stiplede hjelpelinjer: A -->
  <line x1="70" y1="176" x2="257" y2="176" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="257" y1="176" x2="257" y2="620" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Stiplede hjelpelinjer: B -->
  <line x1="70" y1="153" x2="217" y2="153" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="217" y1="153" x2="217" y2="620" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- Likevektspunkter -->
  <circle cx="257" cy="176" r="4" fill="#222"/>
  <text x="263" y="171" font-size="15" font-weight="bold">A</text>
  <circle cx="217" cy="153" r="4" fill="#222"/>
  <text x="201" y="148" font-size="15" font-weight="bold">B</text>

  <!-- Akseverdier -->
  <text x="64" y="158" font-size="13" font-style="italic" text-anchor="end">i<tspan dy="4" font-size="10">B</tspan></text>
  <text x="64" y="181" font-size="13" font-style="italic" text-anchor="end">i<tspan dy="4" font-size="10">A</tspan></text>
  <text x="217" y="318" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="4" font-size="10">B</tspan></text>
  <text x="257" y="318" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="4" font-size="10">A</tspan></text>

  <!-- ================= Nedre panel: (Y, π) ================= -->
  <line x1="70" y1="620" x2="450" y2="620" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="620" x2="70" y2="360" stroke="#222" stroke-width="1.6"/>
  <polygon points="450,620 442,616 442,624" fill="#222"/>
  <polygon points="70,360 66,368 74,368" fill="#222"/>
  <text x="456" y="625" font-size="16" font-style="italic">Y</text>
  <text x="60" y="358" font-size="16" font-style="italic">π</text>

  <!-- PK0: stigende -->
  <line x1="90" y1="590" x2="425" y2="400" stroke="#1e8449" stroke-width="2.4"/>
  <text x="430" y="398" font-size="15" fill="#1e8449" font-weight="bold">PK<tspan dy="4" font-size="10">0</tspan></text>
  <!-- PK1: stigende, skiftet OPP (med Δz^π > 0) -->
  <line x1="90" y1="558" x2="425" y2="368" stroke="#1e8449" stroke-width="2.4" stroke-dasharray="9 5"/>
  <text x="430" y="366" font-size="15" fill="#1e8449" font-weight="bold">PK<tspan dy="4" font-size="10">1</tspan></text>
  <!-- Skiftpil PK0 -> PK1 (oppover) -->
  <line x1="150" y1="568" x2="150" y2="536" stroke="#666" stroke-width="1.6"/>
  <polygon points="150,531 146,539 154,539" fill="#666"/>

  <!--
    A på PK0 ved Y_A=257 -> y≈495. B på PK1 ved Y_B=217 -> y≈486.
    y_B=486 < y_A=495  =>  π_B > π_A (inflasjonen ender HØYERE), men bare litt (dempet:
    nettoøkningen 9px er mindre enn PK-skiftet på 32px — jf. dempingsbrøken 0<Δπ<Δz^π).
  -->
  <!-- Stiplede hjelpelinjer -->
  <line x1="70" y1="495" x2="257" y2="495" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70" y1="486" x2="217" y2="486" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- Punkter -->
  <circle cx="257" cy="495" r="4" fill="#222"/>
  <text x="263" y="490" font-size="15" font-weight="bold">A</text>
  <circle cx="217" cy="486" r="4" fill="#222"/>
  <text x="201" y="481" font-size="15" font-weight="bold">B</text>

  <!-- Akseverdier -->
  <text x="64" y="490" font-size="13" font-style="italic" text-anchor="end">π<tspan dy="4" font-size="10">B</tspan></text>
  <text x="64" y="501" font-size="13" font-style="italic" text-anchor="end">π<tspan dy="4" font-size="10">A</tspan></text>
  <text x="217" y="638" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="4" font-size="10">B</tspan></text>
  <text x="257" y="638" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="4" font-size="10">A</tspan></text>
</svg>
