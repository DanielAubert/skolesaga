<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med ledighet u vannrett og reallønn W/P loddrett. Den flate priskurven ligger fast, mens lønnskurven skifter parallelt opp og utover fra den stiplede før-kurven til den heltrukne etter-kurven når lønnspresset z-W øker. Skjæringspunktet flytter fra A til B langs priskurven: likevektsledigheten stiger fra u-n-0 til u-n-1, mens reallønnen A over 1 pluss my er uendret.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70.0" y1="300.0" x2="410.0" y2="300.0" stroke="#222" stroke-width="1.6"/>
  <line x1="70.0" y1="300.0" x2="70.0" y2="30.0" stroke="#222" stroke-width="1.6"/>
  <polygon points="410.0,300.0 402.0,296.0 402.0,304.0" fill="#222"/>
  <polygon points="70.0,30.0 66.0,38.0 74.0,38.0" fill="#222"/>
  <text x="414.0" y="305.0" font-size="16" font-style="italic" fill="#000">u</text>
  <text x="42.0" y="26.0" font-size="16" font-style="italic" fill="#000">W/P</text>
  <line x1="70.0" y1="170.0" x2="392.0" y2="170.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="300.0" y="144.0" font-size="13" font-weight="bold" fill="#2471a3">Priskurve</text>
  <text x="300.0" y="161.0" font-size="12" font-style="italic" fill="#2471a3">W/P = A/(1+μ)</text>
  <line x1="74.8" y1="69.9" x2="319.6" y2="268.8" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6 4" opacity="0.75"/>
  <text x="74.0" y="58.0" font-size="12" fill="#c0392b">Lønnskurve (før)</text>
  <line x1="153.2" y1="81.6" x2="380.4" y2="266.2" stroke="#c0392b" stroke-width="2.4"/>
  <text x="161.0" y="76.0" font-size="12" font-weight="bold" fill="#c0392b">Lønnskurve (etter)</text>
  <line x1="150.0" y1="131.0" x2="209.0" y2="131.0" stroke="#7d3c98" stroke-width="1.6"/>
  <polygon points="214.0,131.0 207.7,134.0 207.7,128.0" fill="#7d3c98"/>
  <text x="142.0" y="121.0" font-size="12" font-style="italic" fill="#7d3c98">z<tspan font-size="9" dy="-5">W</tspan><tspan dy="5"> ↑</tspan></text>
  <circle cx="198.0" cy="170.0" r="4" fill="#888"/>
  <text x="204.0" y="158.0" font-size="14" font-weight="bold" fill="#888">A</text>
  <circle cx="262.0" cy="170.0" r="4" fill="#222"/>
  <text x="268.0" y="158.0" font-size="15" font-weight="bold" fill="#000">B</text>
  <text x="16.0" y="175.0" font-size="12" font-style="italic" fill="#000">A/(1+μ)</text>
  <line x1="198.0" y1="170.0" x2="198.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="262.0" y1="170.0" x2="262.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="188.0" y="318.0" font-size="13" font-style="italic" fill="#888">u<tspan font-size="9" dy="-5">n</tspan><tspan font-size="9" dy="8">0</tspan></text>
  <text x="252.0" y="318.0" font-size="13" font-style="italic" fill="#000">u<tspan font-size="9" dy="-5">n</tspan><tspan font-size="9" dy="8">1</tspan></text>
  <line x1="206.0" y1="178.0" x2="249.0" y2="178.0" stroke="#222" stroke-width="1.2"/>
  <polygon points="254.0,178.0 247.7,181.0 247.7,175.0" fill="#222"/>
  <text x="86.0" y="196.0" font-size="11" fill="#000">u<tspan font-size="9" dy="-5">n</tspan><tspan dy="5"> ↑, W/P uendret</tspan></text>
</svg>
