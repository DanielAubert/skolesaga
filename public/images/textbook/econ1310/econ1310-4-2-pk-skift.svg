<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Phillips-kurven i (Y, pi)-rommet: en stigende kurve PK og en parallellforskjøvet PK' som ligger over PK. Skiftet oppover skjer ved positivt kostnadssjokk eller høyere inflasjonsforventninger. En pil langs den opprinnelige PK-kurven fra punkt A til punkt B viser at et etterspørselssjokk i stedet flytter økonomien langs kurven mot høyere Y og høyere inflasjon.">
  <rect width="440" height="360" fill="#ffffff"/>
  <!-- Axes -->
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <!-- Axis arrows -->
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <!-- Axis labels -->
  <text x="412" y="316" font-size="16" font-style="italic">Y</text>
  <text x="52" y="28" font-size="16" font-style="italic">&#960;</text>
  <!-- Opprinnelig Phillips-kurve PK (stigende): from (90,280) to (390,110) -->
  <line x1="90" y1="280" x2="390" y2="110" stroke="#2471a3" stroke-width="2.4"/>
  <text x="356" y="104" font-size="16" fill="#2471a3" font-weight="bold">PK</text>
  <!-- Oppskiftet Phillips-kurve PK' (parallell, forskjøvet opp med ca 55 px): from (90,225) to (390,55) -->
  <line x1="90" y1="225" x2="390" y2="55" stroke="#7d3c98" stroke-width="2.4" stroke-dasharray="1 0"/>
  <text x="352" y="49" font-size="16" fill="#7d3c98" font-weight="bold">PK&#8242;</text>
  <!-- Skift-piler oppover mellom PK og PK' -->
  <line x1="160" y1="240" x2="160" y2="192" stroke="#7d3c98" stroke-width="1.6"/>
  <polygon points="160,185 156,195 164,195" fill="#7d3c98"/>
  <line x1="300" y1="161" x2="300" y2="113" stroke="#7d3c98" stroke-width="1.6"/>
  <polygon points="300,106 296,116 304,116" fill="#7d3c98"/>
  <text x="176" y="205" font-size="12" fill="#7d3c98" font-style="italic">z&#960;&#8593; / &#960;&#7497;&#8593;</text>
  <!-- Punkt A paa PK (utgangspunkt) ved (180,229) -->
  <circle cx="180" cy="229" r="4" fill="#222"/>
  <text x="162" y="224" font-size="15" font-weight="bold">A</text>
  <!-- Punkt B paa PK (etter etterspoerselssjokk, hoeyere Y) ved (300,161) -->
  <circle cx="300" cy="161" r="4" fill="#222"/>
  <text x="306" y="157" font-size="15" font-weight="bold">B</text>
  <!-- Bevegelse LANGS PK: buet pil fra A mot B -->
  <path d="M 190,225 Q 245,188 293,163" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="293,163 293,173 301,166" fill="#c0392b"/>
  <text x="212" y="180" font-size="12" fill="#c0392b" font-style="italic">langs kurven</text>
  <!-- Stiplede hjelpelinjer fra A og B til aksene -->
  <line x1="70" y1="229" x2="180" y2="229" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="180" y1="229" x2="180" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70" y1="161" x2="300" y2="161" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="300" y1="161" x2="300" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- Akse-merker -->
  <text x="168" y="316" font-size="13" font-style="italic">Y&#8320;</text>
  <text x="290" y="316" font-size="13" font-style="italic">Y&#8321;</text>
</svg>
