<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Lønns- og priskurvemodellen: vannrett priskurve i høyden 0,833 og fallende lønnskurve W/P = 1 minus 0,4u fra 1 ved u=0, som krysser priskurven i likevektspunktet A ved ledighet u-n omtrent 0,42.">
