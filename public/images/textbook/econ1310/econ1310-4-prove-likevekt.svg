  <line x1="66" y1="95.42" x2="70" y2="95.42" stroke="#222" stroke-width="1.2"/>
  <text x="28" y="100.42" font-size="13" font-style="italic" fill="#000">0,833</text>
  <text x="183.67" y="318" font-size="13" font-style="italic" fill="#000">u&#8319; &#8776; 0,42</text>
