<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ================= Øvre panel: (Y, i) ================= -->
  <!-- Akser -->
  <line x1="60" y1="280" x2="60" y2="34" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="60" y1="280" x2="450" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="46" y="44" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">i</text>
  <text x="462" y="285" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">Y</text>

  <!-- Stiplede hjelpelinjer til likevekten A -->
  <line x1="60" y1="160" x2="250" y2="160" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="250" y1="160" x2="250" y2="600" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- IS: fallende -->
  <line x1="95" y1="75" x2="405" y2="245" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <text x="412" y="252" fill="#ef4444" font-size="15" font-weight="bold">IS</text>

  <!-- RR: stigende -->
  <line x1="95" y1="245" x2="405" y2="75" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <text x="412" y="78" fill="#3b82f6" font-size="15" font-weight="bold">RR</text>

  <!-- Likevektspunkt A -->
  <circle cx="250" cy="160" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="259" y="151" fill="#6b7280" font-size="15" font-weight="bold">A</text>

  <!-- Akseverdier -->
  <text x="52" y="165" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">i<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="250" y="299" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">A</tspan></text>

  <!-- ================= Nedre panel: (Y, π) ================= -->
  <!-- Akser -->
  <line x1="60" y1="600" x2="60" y2="354" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="60" y1="600" x2="450" y2="600" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="46" y="364" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">π</text>
  <text x="462" y="605" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">Y</text>

  <!-- Stiplet hjelpelinje til PK-avlesningen -->
  <line x1="60" y1="480" x2="250" y2="480" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- PK: stigende -->
  <line x1="95" y1="565" x2="405" y2="395" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="412" y="398" fill="#059669" font-size="15" font-weight="bold">PK</text>

  <!-- Avlesningspunkt A i nedre panel -->
  <circle cx="250" cy="480" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="259" y="471" fill="#6b7280" font-size="15" font-weight="bold">A</text>

  <!-- Akseverdier -->
  <text x="52" y="485" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">π<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="250" y="619" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">A</tspan></text>
</svg>
