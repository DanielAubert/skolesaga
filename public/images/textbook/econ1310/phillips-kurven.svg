<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Akser -->
  <line x1="60" y1="320" x2="60" y2="30" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr4)"/>
  <line x1="60" y1="320" x2="450" y2="320" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr4)"/>
  <text x="46" y="40" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">π</text>
  <text x="462" y="325" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">Y</text>

  <!-- Stiplede hjelpelinjer ved Y^n -->
  <line x1="240" y1="320" x2="240" y2="200" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="60" y1="200" x2="240" y2="200" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- PK: stigende -->
  <line x1="100" y1="290" x2="420" y2="85" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="426" y="82" fill="#059669" font-size="15" font-weight="bold">PK</text>

  <!-- Punktet der Y = Y^n (null produksjonsgap) -->
  <circle cx="240" cy="200" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>

  <!-- Akseverdier -->
  <text x="52" y="205" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">π<tspan dy="-4" font-size="10">e</tspan></text>
  <text x="240" y="339" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="-4" font-size="10">n</tspan></text>
  <text x="240" y="354" fill="#6b7280" font-size="11.5" text-anchor="middle">(svarer til u = uⁿ)</text>

  <!-- Gap-annotasjoner under aksen -->
  <text x="145" y="338" fill="#6b7280" font-size="11.5" font-style="italic" text-anchor="middle">Y &lt; Yⁿ: u &gt; uⁿ</text>
  <text x="345" y="338" fill="#6b7280" font-size="11.5" font-style="italic" text-anchor="middle">Y &gt; Yⁿ: u &lt; uⁿ</text>
</svg>
