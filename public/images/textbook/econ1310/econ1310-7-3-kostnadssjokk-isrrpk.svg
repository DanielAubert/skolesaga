  <text x="112.0" y="562.0" font-size="11" font-style="italic" fill="#7d3c98">Δz<tspan font-size="9" dy="-5">π</tspan><tspan dy="5"> ↑</tspan></text>
  <line x1="70.0" y1="481.4" x2="303.8" y2="481.4" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="303.8" y1="481.4" x2="303.8" y2="580.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
