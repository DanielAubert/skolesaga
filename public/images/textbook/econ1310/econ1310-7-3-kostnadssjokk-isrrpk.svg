<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 620" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Topanels IS-RR-PK-diagram for et kostnadssjokk. Øvre panel med Y og i: fast IS-kurve, RR skifter parallelt opp fra den stiplede før-kurven RR0 til RR1, slik at likevekten flytter fra E0 til E1 med høyere rente og lavere BNP. Nedre panel med Y og pi: PK skifter opp fra den stiplede PK0 til PK1, slik at inflasjonen stiger fra F0 til F1. Resultatet er stagflasjon.">
  <rect width="440" height="620" fill="#ffffff"/>
  <text x="70.0" y="24.0" font-size="13" font-weight="bold" fill="#000">(a) Øvre panel: rentemarkedet (Y, i)</text>
