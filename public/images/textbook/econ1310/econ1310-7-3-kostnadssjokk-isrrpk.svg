  <text x="78.0" y="262.0" font-size="12" fill="#2471a3">RR<tspan font-size="9" dy="3">0</tspan><tspan dy="-3"> (før)</tspan></text>
  <line x1="79.3" y1="213.6" x2="403.8" y2="86.5" stroke="#2471a3" stroke-width="2.4"/>
  <text x="378.0" y="74.0" font-size="14" font-weight="bold" fill="#2471a3">RR<tspan font-size="9" dy="3">1</tspan></text>
  <line x1="124.1" y1="231.2" x2="124.1" y2="201.0" stroke="#7d3c98" stroke-width="1.6"/>
