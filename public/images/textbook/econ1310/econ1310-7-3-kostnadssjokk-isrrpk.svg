  <text x="296.0" y="467.0" font-size="13" font-weight="bold" fill="#888">F<tspan font-size="9" dy="3">0</tspan></text>
  <text x="246.0" y="446.0" font-size="13" font-weight="bold" fill="#000">F<tspan font-size="9" dy="3">1</tspan></text>
  <text x="42.0" y="485.4" font-size="12" font-style="italic" fill="#888">π<tspan font-size="9" dy="3">0</tspan></text>
  <text x="42.0" y="465.5" font-size="12" font-style="italic" fill="#000">π<tspan font-size="9" dy="3">1</tspan></text>
  <text x="295.8" y="596.0" font-size="12" font-style="italic" fill="#888">Y<tspan font-size="9" dy="3">0</tspan></text>
  <text x="252.8" y="596.0" font-size="12" font-style="italic" fill="#000">Y<tspan font-size="9" dy="3">1</tspan></text>
  <text x="150.0" y="614.0" font-size="11" fill="#000">π ↑, Y ↓ → stagflasjon</text>
</svg>
