<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Rentekanalen: en økning i styringsrenten hever bankenes finansieringskostnad, som banken velter over i høyere utlånsrente og innskuddsrente. Avstanden mellom utlåns- og innskuddsrenten er bankens rentemargin.">
  <rect width="520" height="320" fill="#ffffff"/>
  <!-- Boks 1: Styringsrente -->
  <rect x="30" y="120" width="130" height="64" rx="8" fill="#eaf1f8" stroke="#2471a3" stroke-width="1.8"/>
  <text x="95" y="148" font-size="14" font-weight="bold" fill="#2471a3" text-anchor="middle">Styringsrente</text>
  <text x="95" y="167" font-size="11" fill="#555" text-anchor="middle">(Norges Bank)</text>
  <!-- Pil 1 -> Boks 2 -->
  <line x1="160" y1="152" x2="205" y2="152" stroke="#222" stroke-width="1.8"/>
  <polygon points="212,152 203,148 203,156" fill="#222"/>
  <!-- Boks 2: Bankenes finansieringskostnad -->
  <rect x="214" y="118" width="150" height="68" rx="8" fill="#f4f0fa" stroke="#7d3c98" stroke-width="1.8"/>
  <text x="289" y="145" font-size="13" font-weight="bold" fill="#7d3c98" text-anchor="middle">Bankenes</text>
  <text x="289" y="163" font-size="13" font-weight="bold" fill="#7d3c98" text-anchor="middle">finansieringskostnad</text>
  <!-- Pil 2 -> utlån (opp) -->
  <line x1="364" y1="140" x2="418" y2="96" stroke="#222" stroke-width="1.8"/>
  <polygon points="424,91 414,92 419,100" fill="#222"/>
  <!-- Pil 2 -> innskudd (ned) -->
  <line x1="364" y1="164" x2="418" y2="208" stroke="#222" stroke-width="1.8"/>
  <polygon points="424,213 419,204 414,212" fill="#222"/>
  <!-- Boks 3a: Utlånsrente (høy) -->
  <rect x="426" y="64" width="86" height="52" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="469" y="86" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Utlåns-</text>
  <text x="469" y="102" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">rente</text>
  <!-- Boks 3b: Innskuddsrente (lav) -->
  <rect x="426" y="188" width="86" height="52" rx="8" fill="#eafaf0" stroke="#1e8449" stroke-width="1.8"/>
  <text x="469" y="210" font-size="12" font-weight="bold" fill="#1e8449" text-anchor="middle">Innskudds-</text>
  <text x="469" y="226" font-size="12" font-weight="bold" fill="#1e8449" text-anchor="middle">rente</text>
  <!-- Rentemargin-brakett mellom utlån og innskudd -->
  <line x1="410" y1="90" x2="410" y2="214" stroke="#888" stroke-width="1.4"/>
  <line x1="410" y1="90" x2="418" y2="90" stroke="#888" stroke-width="1.4"/>
  <line x1="410" y1="214" x2="418" y2="214" stroke="#888" stroke-width="1.4"/>
  <text x="405" y="148" font-size="11" fill="#555" text-anchor="end">rente-</text>
  <text x="405" y="162" font-size="11" fill="#555" text-anchor="end">margin</text>
  <!-- Toppnotat: opp smitter til opp -->
  <text x="260" y="40" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">↑ styringsrente  ⇒  ↑ begge markedsrentene</text>
  <!-- Bunnnotat -->
  <text x="260" y="296" font-size="12" fill="#555" text-anchor="middle">Renteøkningen «smitter» via bankenes finansieringskostnad ut i markedsrentene.</text>
</svg>
