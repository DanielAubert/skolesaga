<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Akser -->
  <line x1="60" y1="320" x2="60" y2="30" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr5)"/>
  <line x1="60" y1="320" x2="450" y2="320" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr5)"/>
  <text x="54" y="42" fill="#6b7280" font-size="16" font-style="italic" text-anchor="end">W/P</text>
  <text x="462" y="325" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">u</text>

  <!-- Stiplede hjelpelinjer til likevekten -->
  <line x1="60" y1="200" x2="95" y2="200" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="281" y1="200" x2="281" y2="320" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- Priskurven: vannrett (reallønnen bedriftenes prissetting tillater) -->
  <line x1="95" y1="200" x2="425" y2="200" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <text x="380" y="190" fill="#3b82f6" font-size="15" font-weight="bold" text-anchor="middle">Priskurve</text>

  <!-- Lønnskurven: fallende i ledigheten -->
  <line x1="95" y1="70" x2="425" y2="300" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <text x="106" y="64" fill="#ef4444" font-size="15" font-weight="bold">Lønnskurve</text>

  <!-- Likevektspunktet -->
  <circle cx="281" cy="200" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>

  <!-- Akseverdier -->
  <text x="52" y="205" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">A/(1+μ)</text>
  <text x="281" y="339" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">u<tspan dy="-4" font-size="10">n</tspan></text>
  <text x="281" y="354" fill="#6b7280" font-size="11.5" text-anchor="middle">(likevektsledigheten)</text>

  <!-- Press-annotasjoner under aksen -->
  <text x="150" y="338" fill="#6b7280" font-size="11.5" font-style="italic" text-anchor="middle">u &lt; uⁿ: lønnspress opp</text>
  <text x="382" y="338" fill="#6b7280" font-size="11.5" font-style="italic" text-anchor="middle">u &gt; uⁿ: lønnspress ned</text>
</svg>
