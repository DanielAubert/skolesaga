<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Lavere påslag: den vannrette priskurven løftes fra PS0 i høyden 0,8 til PS1 i høyden 0,909, mot en uendret fallende lønnskurve. Ny likevekt B ligger lenger til venstre og høyere enn gammel likevekt A, slik at reallønnen stiger og likevektsledigheten faller fra uⁿ0 til uⁿ1.">
  <rect width="440" height="360" fill="#ffffff"/>
  <!-- Axes -->
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">u</text>
  <text x="48" y="26" font-size="15" font-style="italic">W/P</text>

  <!-- skala: W/P: 1 -> y=100 ; 0,6 -> y=180 (200 px pr enhet). u: 0 -> x=70 ; 320 px pr enhet -->
  <!-- Lønnskurve (uendret): 1 - 0,5u. u=0 -> W/P=1 (y=100) ; u=0,8 -> 0,6 (y=180). x: 70..326 -->
  <line x1="70" y1="100" x2="326" y2="180" stroke="#c0392b" stroke-width="2.4"/>
  <text x="300" y="196" font-size="15" fill="#c0392b" font-weight="bold">WS (lønn)</text>

  <!-- Gammel priskurve PS0 i høyden 0,8 -> y=140 -->
  <line x1="70" y1="140" x2="390" y2="140" stroke="#2471a3" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="352" y="134" font-size="14" fill="#2471a3" font-weight="bold">PS0</text>

  <!-- Ny priskurve PS1 i høyden 0,909 -> y = 100 + (1-0,909)*200 = 100+18,2 = 118 -->
  <line x1="70" y1="118" x2="390" y2="118" stroke="#2471a3" stroke-width="2.4"/>
  <text x="352" y="112" font-size="14" fill="#2471a3" font-weight="bold">PS1</text>

  <!-- Skiftpil opp for priskurven -->
  <line x1="120" y1="140" x2="120" y2="122" stroke="#7d3c98" stroke-width="1.8"/>
  <polygon points="120,116 116,126 124,126" fill="#7d3c98"/>
  <text x="126" y="130" font-size="13" fill="#7d3c98" font-weight="bold">&#956;&#8595;</text>

  <!-- Likevekt A: WS møter PS0 ved 0,8 -> u=0,4 -> x=70+0,4*320=198 ; y=140 -->
  <circle cx="198" cy="140" r="4" fill="#222"/>
  <text x="202" y="152" font-size="15" font-weight="bold">A</text>
  <line x1="198" y1="140" x2="198" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="182" y="316" font-size="13" font-style="italic">u&#8319;&#8320;</text>

  <!-- Likevekt B: WS møter PS1 ved 0,909 -> 1-0,5u=0,909 -> u=0,182 -> x=70+0,182*320=128 ; y=118 -->
  <circle cx="128" cy="118" r="4" fill="#222"/>
  <text x="112" y="112" font-size="15" font-weight="bold">B</text>
  <line x1="128" y1="118" x2="128" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="112" y="316" font-size="13" font-style="italic">u&#8319;&#8321;</text>

  <!-- reallønnsnivåer -->
  <text x="30" y="145" font-size="12" font-style="italic">0,80</text>
  <text x="26" y="118" font-size="12" font-style="italic">0,91</text>
</svg>
