<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ================= Øvre panel: (Y, i) ================= -->
  <line x1="60" y1="280" x2="60" y2="34" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>
  <line x1="60" y1="280" x2="450" y2="280" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>
  <text x="46" y="44" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">i</text>
  <text x="462" y="285" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">Y</text>

  <!-- Stiplede hjelpelinjer: A -->
  <line x1="60" y1="160" x2="250" y2="160" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="250" y1="160" x2="250" y2="600" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <!-- Stiplede hjelpelinjer: B -->
  <line x1="60" y1="184" x2="294" y2="184" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="294" y1="184" x2="294" y2="600" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- IS: fallende (skifter IKKE) -->
  <line x1="85" y1="70" x2="425" y2="255" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <text x="431" y="264" fill="#ef4444" font-size="15" font-weight="bold">IS</text>

  <!-- RR0: stigende -->
  <line x1="85" y1="240" x2="435" y2="70" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <text x="440" y="68" fill="#3b82f6" font-size="15" font-weight="bold">RR<tspan dy="3.5" font-size="10">0</tspan></text>
  <!-- RR1: stigende, skiftet ned (med d1*Δz^π < 0) -->
  <line x1="98" y1="279" x2="435" y2="115" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 5"/>
  <text x="440" y="121" fill="#3b82f6" font-size="15" font-weight="bold">RR<tspan dy="3.5" font-size="10">1</tspan></text>
  <!-- Skiftpil RR0 -> RR1 (nedover) -->
  <line x1="140" y1="219" x2="140" y2="250" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>

  <!-- Likevektspunkter -->
  <circle cx="250" cy="160" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="243" y="147" fill="#6b7280" font-size="15" font-weight="bold">A</text>
  <circle cx="294" cy="184" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="303" y="196" fill="#6b7280" font-size="15" font-weight="bold">B</text>

  <!-- Akseverdier -->
  <text x="52" y="165" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">i<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="52" y="189" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">i<tspan dy="3.5" font-size="10">B</tspan></text>
  <text x="246" y="299" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="300" y="299" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">B</tspan></text>

  <!-- ================= Nedre panel: (Y, π) ================= -->
  <line x1="60" y1="600" x2="60" y2="354" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>
  <line x1="60" y1="600" x2="450" y2="600" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>
  <text x="46" y="364" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">π</text>
  <text x="462" y="605" fill="#6b7280" font-size="16" font-style="italic" text-anchor="middle">Y</text>

  <!-- Stiplede hjelpelinjer -->
  <line x1="60" y1="463" x2="250" y2="463" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>
  <line x1="60" y1="481" x2="294" y2="481" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.85"/>

  <!-- PK0: stigende -->
  <line x1="85" y1="545" x2="425" y2="375" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="430" y="372" fill="#059669" font-size="15" font-weight="bold">PK<tspan dy="3.5" font-size="10">0</tspan></text>
  <!-- PK1: stigende, skiftet ned (med Δz^π < 0) -->
  <line x1="85" y1="585" x2="425" y2="415" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 5"/>
  <text x="430" y="420" fill="#059669" font-size="15" font-weight="bold">PK<tspan dy="3.5" font-size="10">1</tspan></text>
  <!-- Skiftpil PK0 -> PK1 (nedover) -->
  <line x1="140" y1="523" x2="140" y2="551" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>

  <!-- Punkter -->
  <circle cx="250" cy="463" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="243" y="450" fill="#6b7280" font-size="15" font-weight="bold">A</text>
  <circle cx="294" cy="481" r="4.5" fill="#f59e0b" stroke="#6b7280" stroke-width="1"/>
  <text x="303" y="494" fill="#6b7280" font-size="15" font-weight="bold">B</text>

  <!-- Akseverdier -->
  <text x="52" y="468" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">π<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="52" y="486" fill="#6b7280" font-size="13" font-style="italic" text-anchor="end">π<tspan dy="3.5" font-size="10">B</tspan></text>
  <text x="246" y="619" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">A</tspan></text>
  <text x="300" y="619" fill="#6b7280" font-size="13" font-style="italic" text-anchor="middle">Y<tspan dy="3.5" font-size="10">B</tspan></text>
</svg>
