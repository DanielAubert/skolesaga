<text x="330" y="22" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">De seks cellene du skal kjenne igjen i et blodutstryk</text>
<text x="330" y="40" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">Skjematiske tegninger — ikke et mikroskopibilde. Tegningene viser hvilke kjennetegn du skal lete etter,</text>
<text x="330" y="54" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">ikke hvordan et ekte preparat ser ut.</text>
