<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="stopp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 8 0 L 8 10" stroke="#dc2626" stroke-width="3" fill="none"/></marker></defs><text x="20" y="24" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">GPCR-veien: adrenalin → G-protein → cAMP → PKA</text><rect x="20" y="70" width="660" height="26" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/><text x="28" y="62" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">utsiden av cellen</text><text x="600" y="122" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">cytosol</text><circle cx="110" cy="42" r="12" fill="#d97706" opacity="0.85"/><text x="130" y="40" font-size="9" text-anchor="start" fill="#d97706" font-weight="700" font-style="normal">adrenalin</text><line x1="110" y1="54" x2="110" y2="66" stroke="#d97706" stroke-width="1.8" marker-end="url(#pil)"/><rect x="86" y="66" width="48" height="30" rx="4" fill="none" stroke="#3b82f6" stroke-width="2"/><line x1="92" y1="68" x2="92" y2="94" stroke="#3b82f6" stroke-width="1"/><line x1="99" y1="68" x2="99" y2="94" stroke="#3b82f6" stroke-width="1"/><line x1="106" y1="68" x2="106" y2="94" stroke="#3b82f6" stroke-width="1"/><line x1="113" y1="68" x2="113" y2="94" stroke="#3b82f6" stroke-width="1"/><line x1="120" y1="68" x2="120" y2="94" stroke="#3b82f6" stroke-width="1"/><line x1="127" y1="68" x2="127" y2="94" stroke="#3b82f6" stroke-width="1"/><text x="110" y="116" font-size="10" text-anchor="middle" fill="#3b82f6" font-weight="700" font-style="normal">1. GPCR</text><text x="110" y="130" font-size="8" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">(sju membranpassasjer)</text><rect x="266" y="66" width="44" height="30" rx="4" fill="none" stroke="#0d9488" stroke-width="2"/><text x="330" y="84" font-size="10" text-anchor="start" fill="#0d9488" font-weight="700" font-style="normal">3. adenylatcyklase</text><rect x="131.0" y="179.0" width="130" height="34" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8"/><text x="196" y="200" font-size="9" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">2. G-protein (Gₛ)</text><line x1="110" y1="146" x2="172" y2="178" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><line x1="244" y1="186" x2="278" y2="106" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><rect x="375.0" y="173.0" width="110" height="34" rx="6" fill="none" stroke="#d97706" stroke-width="1.8"/><text x="430" y="194" font-size="10" text-anchor="middle" fill="#d97706" font-weight="700" font-style="normal">4. cAMP</text><line x1="304" y1="100" x2="386" y2="176" stroke="#0d9488" stroke-width="1.8" marker-end="url(#pil)"/><text x="316" y="152" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">ATP → cAMP</text><rect x="540.0" y="173.0" width="100" height="34" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8"/><text x="590" y="194" font-size="10" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">5. PKA</text><line x1="486" y1="190" x2="538" y2="190" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><line x1="590" y1="209" x2="590" y2="233" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><rect x="460.0" y="239.0" width="200" height="34" rx="6" fill="none" stroke="#6b7280" stroke-width="1.8"/><text x="560" y="260" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">fosforylerer målproteiner</text><text x="20" y="296" font-size="10" text-anchor="start" fill="#8b5cf6" font-weight="600" font-style="normal">Kjeden: adrenalin → GPCR → G-protein → adenylatcyklase → cAMP → PKA → fosforylerte målproteiner</text><text x="20" y="320" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="italic">cAMP er en andre budbringer. Skjematisk tegning — ikke et mikroskopibilde og ikke i målestokk.</text></svg>