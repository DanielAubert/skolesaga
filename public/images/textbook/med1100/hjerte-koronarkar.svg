<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" width="700" height="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="350.0" y="24.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="700">Kransarteriene (aa. coronariae) og forsyningsomradene</text>
<text x="350.0" y="42.0" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">Skjematisk tegning av hjertet sett forfra — ikke et rontgen-, CT- eller angiografibilde. Pasientens hoyre side ligger til venstre.</text>
<path d="M 246,138 C 288,112 400,108 452,140 C 496,166 502,238 474,292 C 442,352 372,400 306,418 C 266,384 232,320 216,262 C 202,214 212,164 246,138 Z" fill="#6b7280" fill-opacity="0.05" stroke="#6b7280" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 220,236 C 288,262 382,262 476,224" fill="none" fill-opacity="0.0" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="206.0" y="224.0" font-size="8.5" text-anchor="end" fill="#6b7280" font-weight="400" font-style="italic">sulcus coronarius (AV-furen)</text>
<path d="M 358,252 C 346,300 326,356 306,414" fill="none" fill-opacity="0.0" stroke="#6b7280" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="196.0" y="420.0" font-size="8.5" text-anchor="end" fill="#6b7280" font-weight="400" font-style="italic">sulcus interventricularis anterior</text>
<line x1="200.0" y1="416.0" x2="300.0" y2="400.0" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<ellipse cx="352.0" cy="192.0" rx="18.0" ry="14.0" fill="#dc2626" fill-opacity="0.16" stroke="#dc2626" stroke-width="1.8"/>
<text x="352.0" y="154.0" font-size="9" text-anchor="middle" fill="#dc2626" font-weight="600">aortarot — begge kransarteriene</text>
<text x="352.0" y="166.0" font-size="9" text-anchor="middle" fill="#dc2626" font-weight="600">starter her</text>
<polyline points="336.0,200.0 300.0,226.0 258.0,242.0 228.0,250.0 222.0,288.0 238.0,334.0 264.0,372.0" fill="none" stroke="#dc2626" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="224.0,296.0 258.0,330.0 290.0,366.0" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="196.0" y="262.0" font-size="10" text-anchor="end" fill="#dc2626" font-weight="700">a. coronaria dextra (RCA)</text>
<line x1="200.0" y1="256.0" x2="226.0" y2="250.0" stroke="#dc2626" stroke-width="1.0" stroke-linecap="round"/>
<text x="196.0" y="330.0" font-size="10" text-anchor="end" fill="#dc2626" font-weight="700">ramus marginalis dexter</text>
<line x1="200.0" y1="324.0" x2="240.0" y2="314.0" stroke="#dc2626" stroke-width="1.0" stroke-linecap="round"/>
<polyline points="370.0,200.0 390.0,212.0" fill="none" stroke="#dc2626" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516.0" y="152.0" font-size="10" text-anchor="start" fill="#dc2626" font-weight="700">a. coronaria sinistra</text>
<text x="516.0" y="166.0" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400">kort hovedstamme,</text>
<text x="516.0" y="180.0" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400">deler seg straks i to</text>
<line x1="512.0" y1="168.0" x2="394.0" y2="208.0" stroke="#dc2626" stroke-width="1.0" stroke-linecap="round"/>
<polyline points="390.0,212.0 372.0,258.0 350.0,316.0 326.0,372.0 308.0,414.0" fill="none" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="492.0" y="452.0" font-size="10" text-anchor="end" fill="#dc2626" font-weight="700">ramus interventricularis anterior (RIVA / LAD)</text>
<line x1="370.0" y1="446.0" x2="330.0" y2="394.0" stroke="#dc2626" stroke-width="1.0" stroke-linecap="round"/>
<polyline points="390.0,212.0 428.0,226.0 462.0,248.0 470.0,288.0 458.0,326.0" fill="none" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516.0" y="268.0" font-size="10" text-anchor="start" fill="#dc2626" font-weight="700">ramus circumflexus</text>
<line x1="512.0" y1="262.0" x2="468.0" y2="268.0" stroke="#dc2626" stroke-width="1.0" stroke-linecap="round"/>
<ellipse cx="280.0" cy="306.0" rx="42.0" ry="54.0" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="280.0" y="292.0" font-size="9" text-anchor="middle" fill="#2563eb" font-weight="600">hoyre kammer</text>
<ellipse cx="400.0" cy="312.0" rx="48.0" ry="62.0" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="400.0" y="296.0" font-size="9" text-anchor="middle" fill="#8b5cf6" font-weight="600">venstre kammers</text>
<text x="400.0" y="308.0" font-size="9" text-anchor="middle" fill="#8b5cf6" font-weight="600">forvegg + septum</text>
<text x="28.0" y="480.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">RCA forsyner hoyre forkammer og hoyre kammer, og hos de aller fleste ogsa hjertets bakvegg og AV-knuten.</text>
<text x="28.0" y="498.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">RIVA tar venstre kammers forvegg, fremre del av septum og apex; ramus circumflexus tar sideveggen.</text>
<text x="28.0" y="516.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">Hvem som gir den bakre nedadgaende grenen varierer mellom mennesker (dominans). Figuren viser den vanligste losningen.</text>
</svg>
