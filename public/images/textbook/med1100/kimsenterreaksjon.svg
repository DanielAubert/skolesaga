<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="pd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs>
<circle cx="70" cy="182" r="24" fill="none" stroke="#2563eb" stroke-width="1.9"/>
<text x="70" y="186" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold">naiv B</text>
<text x="70" y="226" font-size="10" fill="#6b7280" text-anchor="middle">IgM + IgD</text>
<text x="70" y="240" font-size="10" fill="#6b7280" text-anchor="middle">samme V-region</text>
<line x1="98" y1="182" x2="150" y2="182" stroke="#6b7280" stroke-width="1.8" marker-end="url(#p)"/>
<text x="124" y="170" font-size="9.5" fill="#6b7280" text-anchor="middle">aktivert</text>
<rect x="164" y="72" width="342" height="238" rx="46" fill="none" stroke="#7c3aed" stroke-width="2"/>
<text x="335" y="100" font-size="12.5" fill="#7c3aed" font-weight="bold" text-anchor="middle">kimsenteret (centrum germinale)</text>
<text x="335" y="116" font-size="10" fill="#6b7280" text-anchor="middle">inne i en lymfefollikkel</text>
<rect x="190" y="136" width="290" height="46" rx="10" fill="none" stroke="#0d9488" stroke-width="1.6"/>
<text x="204" y="156" font-size="11" fill="#0d9488" font-weight="bold">1. Somatisk hypermutasjon</text>
<text x="204" y="172" font-size="10" fill="#6b7280">endrer V-regionen → varierende bindingsstyrke</text>
<line x1="335" y1="182" x2="335" y2="204" stroke="#6b7280" stroke-width="1.6" marker-end="url(#p)"/>
<text x="204" y="222" font-size="11" fill="#6b7280" font-weight="bold">2. Utvelgelse mot antigen</text>
<text x="204" y="237" font-size="10" fill="#6b7280">best binding overlever → affinitetsmodning</text>
<line x1="470" y1="222" x2="536" y2="200" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pd)"/>
<text x="546" y="192" font-size="9.5" fill="#9ca3af">dårlig binding → dør</text>
<line x1="335" y1="243" x2="335" y2="258" stroke="#6b7280" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="190" y="262" width="290" height="40" rx="10" fill="none" stroke="#d97706" stroke-width="1.6"/>
<text x="204" y="279" font-size="11" fill="#d97706" font-weight="bold">3. Isotypeskift</text>
<text x="204" y="294" font-size="10" fill="#6b7280">endrer C-regionen: IgM → IgG / IgA / IgE</text>
<line x1="506" y1="140" x2="576" y2="112" stroke="#2563eb" stroke-width="1.8" marker-end="url(#pb)"/>
<line x1="506" y1="278" x2="576" y2="290" stroke="#2563eb" stroke-width="1.8" marker-end="url(#pb)"/>
<text x="584" y="100" font-size="11" fill="#2563eb" font-weight="bold">langlivet plasmacelle</text>
<text x="584" y="115" font-size="10" fill="#6b7280">vandrer til benmargen</text>
<text x="584" y="129" font-size="10" fill="#6b7280">og skiller ut antistoff</text>
<text x="584" y="288" font-size="11" fill="#2563eb" font-weight="bold">hukommelses-B-celle</text>
<text x="584" y="303" font-size="10" fill="#6b7280">gir rask sekundær respons</text>
<line x1="40" y1="342" x2="740" y2="342" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.7"/>
<text x="40" y="368" font-size="11.5" fill="#0d9488" font-weight="bold">Somatisk hypermutasjon → V-region</text>
<text x="300" y="368" font-size="10" fill="#6b7280">bindingsstyrken endres — spesifisiteten finpusses</text>
<text x="40" y="390" font-size="11.5" fill="#d97706" font-weight="bold">Isotypeskift → C-region</text>
<text x="300" y="390" font-size="10" fill="#6b7280">effektorfunksjonen endres — spesifisiteten er UENDRET</text>
<text x="40" y="418" font-size="9" fill="#6b7280">Skjematisk tegning — ikke et mikroskopibilde. Cellene er ikke i målestokk.</text>
</svg>
