<text x="556" y="100" font-size="10" text-anchor="middle" fill="#dc2626" font-weight="700" font-style="normal">Høyreforskyvning</text>
<text x="556" y="118" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">• lav pH</text>
<text x="556" y="133" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">• høyt CO₂</text>
<text x="556" y="148" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">• høy temperatur</text>
<text x="556" y="163" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">• høyt 2,3-BPG</text>
<text x="556" y="184" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">→ oksygen slippes</text>
<text x="556" y="197" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">lettere ut i vevet</text>
<rect x="480" y="220" width="152" height="66" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8"/>
<text x="556" y="240" font-size="9.5" text-anchor="middle" fill="#3b82f6" font-weight="700" font-style="normal">Heltrukket blå kurve</text>
<text x="556" y="256" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">= hvileforhold</text>
<text x="556" y="272" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">Rød stiplet = arbeidende vev</text>
<text x="320" y="348" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">Kurven er S-formet fordi hemoglobinets fire bindingsseter samarbeider: det første oksygenet</text>
<text x="320" y="364" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">binder seg tregt, de neste stadig lettere.</text>
