<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="stopp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 8 0 L 8 10" stroke="#dc2626" stroke-width="3" fill="none"/></marker></defs><text x="20" y="24" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">Cellesyklusen, restriksjonspunktet og de to bremsene</text><path d="M 250.0 280.0 A 90 90 0 0 1 172.1 145.0" fill="none" stroke="#3b82f6" stroke-width="7"/><text x="192.84232335022705" y="227.0" font-size="13" text-anchor="middle" fill="#3b82f6" font-weight="700" font-style="normal">G1</text><path d="M 172.1 145.0 A 90 90 0 0 1 250.0 100.0" fill="none" stroke="#8b5cf6" stroke-width="7"/><text x="216.99999999999997" y="136.84232335022708" font-size="13" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">S</text><path d="M 250.0 100.0 A 90 90 0 0 1 327.9 145.0" fill="none" stroke="#0d9488" stroke-width="7"/><text x="283.0" y="136.84232335022705" font-size="13" text-anchor="middle" fill="#0d9488" font-weight="700" font-style="normal">G2</text><path d="M 327.9 145.0 A 90 90 0 0 1 250.0 280.0" fill="none" stroke="#d97706" stroke-width="7"/><text x="307.15767664977295" y="227.0" font-size="13" text-anchor="middle" fill="#d97706" font-weight="700" font-style="normal">M</text><text x="250" y="194" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">cellesyklus</text><line x1="154" y1="190" x2="100" y2="190" stroke="#6b7280" stroke-width="1.6" marker-end="url(#pil)" stroke-dasharray="4 3"/><text x="94" y="194" font-size="10" text-anchor="end" fill="#6b7280" font-weight="700" font-style="normal">G0 (hvile)</