<text x="350.0" y="24.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="700">Diafragmas tre store apninger og nivaene deres</text>
<text x="350.0" y="42.0" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">Skjematisk tegning av mellomgulvet sett ovenfra — ikke et rontgen- eller CT-bilde. Fremre kant overst.</text>
