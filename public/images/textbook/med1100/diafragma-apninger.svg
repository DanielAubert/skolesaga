<text x="616.0" y="386.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400">cava - oesophagus - aorta</text>
<text x="616.0" y="402.0" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">tallene stiger nedover</text>
<text x="350.0" y="472.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">Vena cava gar gjennom senesentret; oesophagus gjennom muskeldelen; aorta bak, mellom de to crura.</text>
