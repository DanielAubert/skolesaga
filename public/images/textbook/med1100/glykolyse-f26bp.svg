<text x="202.0" y="81.0" font-size="9" text-anchor="start" fill="#d97706" font-weight="normal" font-style="normal">(kun lever og nyrebark)</text>
<text x="88.0" y="24.0" font-size="11" text-anchor="middle" fill="#3b82f6" font-weight="700" font-style="normal">glykolyse</text>
<text x="220.0" y="24.0" font-size="11" text-anchor="middle" fill="#d97706" font-weight="700" font-style="normal">glukoneogenese</text>
<rect x="372.0" y="186.0" width="212" height="46" rx="9" fill="#0d9488" opacity="0.14"/>
