<text x="300.0" y="258.0" font-size="10" text-anchor="middle" fill="#e11d48" font-weight="700" font-style="normal">- hemmer FBPase-1</text>
<rect x="372.0" y="84" width="212" height="66" rx="9" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="478.0" y="106.0" font-size="11" text-anchor="middle" fill="#3b82f6" font-weight="700" font-style="normal">Insulin (mett): F2,6BP opp</text>
<text x="478.0" y="126.0" font-size="11" text-anchor="middle" fill="#d97706" font-weight="700" font-style="normal">Glukagon (fastende): F2,6BP ned</text>
<text x="478.0" y="142.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="normal" font-style="normal">via PFK-2/FBPase-2 (ett bifunksjonelt enzym)</text>
<line x1="478.0" y1="150" x2="478.0" y2="186.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="20" y="344" width="580" height="46" rx="9" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<text x="32.0" y="364.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">Netto glykolyse per glukose: 2 ATP investert, 4 ATP hostet = netto 2 ATP, 2 NADH og 2 pyruvat.</text>
<text x="32.0" y="382.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal" font-style="normal">Anaerobt (pyruvat blir laktat): NADH forbrukes igjen = netto 2 ATP og 0 NADH.</text>
<text x="20.0" y="414.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal" font-style="normal">Skjematisk oversiktsfigur - bare de regulerte trinnene er tegnet inn; de ovrige mellomproduktene i glykolysen er utelatt med vilje.</text>
</svg>
