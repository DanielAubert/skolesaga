<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 496" width="670" height="496" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="330" y="22" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Hematopoiesens forgreningstre</text>
<text x="330" y="40" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">Skjematisk oversikt — ikke et mikroskopibilde</text>
<rect x="16" y="190" width="104" height="46" rx="6" fill="#8b5cf6" opacity="0.20" stroke="#8b5cf6" stroke-width="1.6"/>
<text x="68.0" y="211.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">Hematopoietisk</text>
<text x="68.0" y="223.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">stamcelle</text>
<rect x="150" y="120" width="104" height="40" rx="6" fill="#0d9488" opacity="0.20" stroke="#0d9488" stroke-width="1.6"/>
<text x="202.0" y="138.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Myeloid</text>
<text x="202.0" y="150.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">stamcelle</text>
<rect x="150" y="268" width="104" height="40" rx="6" fill="#3b82f6" opacity="0.20" stroke="#3b82f6" stroke-width="1.6"/>
<text x="202.0" y="286.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Lymfoid</text>
<text x="202.0" y="298.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">stamcelle</text>
<path d="M120 213 C 146 213, 124 140, 150 140" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.75"/>
<path d="M120 213 C 146 213, 124 288, 150 288" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.75"/>
<rect x="330" y="44" width="150" height="34" rx="6" fill="#0d9488" opacity="0.20" stroke="#0d9488" stroke-width="1.6"/>
<text x="405.0" y="65.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Erytrocytt</text>
<path d="M254 140 C 280 140, 304 61, 330 61" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.75"/>
<rect x="330" y="88" width="150" height="34" rx="6" fill="#0d9488" opacity="0.20" stroke="#0d9488" stroke-width="1.6"/>
<text x="405.0" y="103.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Trombocytt</text>
<text x="405.0" y="115.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">(fra megakaryocytt)</text>
<path d="M254 140 C 280 140, 304 105, 330 105" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.75"/>
<rect x="330" y="136" width="150" height="34" rx="6" fill="#0d9488" opacity="0.20" stroke="#0d9488" stroke-width="1.6"/>
<text x="405.0" y="151.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Nøytrofil</text>
<text x="405.0" y="163.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">granulocytt</text>
<path d="M254 140 C 280 140, 304 153, 330 153" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.75"/>
<rect x="330" y="184" width="150" height="34" rx="6" fill="#0d9488" opacity="0.20" stroke="#0d9488" stroke-width="1.6"/>
<text x="405.0" y="199.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Eosinofil</text>
<text x="405.0" y="211.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">granulocytt</text>
<path d="M254 140 C 280 140, 304 201, 330 201" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.75"/>
<rect x="330" y="228" width="150" height="34" rx="6" fill="#0d9488" opacity="0.20" stroke="#0d9488" stroke-width="1.6"/>
<text x="405.0" y="243.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Basofil</text>
<text x="405.0" y="255.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">granulocytt</text>
<path d="M254 140 C 280 140, 304 245, 330 245" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.75"/>
<rect x="330" y="272" width="150" height="34" rx="6" fill="#0d9488" opacity="0.20" stroke="#0d9488" stroke-width="1.6"/>
<text x="405.0" y="287.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Monocytt</text>
<text x="405.0" y="299.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">(→ makrofag i vev)</text>
<path d="M254 140 C 280 140, 304 289, 330 289" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.75"/>
<rect x="330" y="321" width="150" height="32" rx="6" fill="#3b82f6" opacity="0.20" stroke="#3b82f6" stroke-width="1.6"/>
<text x="405.0" y="341.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">B-lymfocytt</text>
<path d="M254 288 C 280 288, 304 337, 330 337" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.75"/>
<rect x="330" y="361" width="150" height="32" rx="6" fill="#3b82f6" opacity="0.20" stroke="#3b82f6" stroke-width="1.6"/>
<text x="405.0" y="381.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">T-lymfocytt</text>
<path d="M254 288 C 280 288, 304 377, 330 377" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.75"/>
<rect x="330" y="401" width="150" height="32" rx="6" fill="#3b82f6" opacity="0.20" stroke="#3b82f6" stroke-width="1.6"/>
<text x="405.0" y="421.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">NK-celle</text>
<path d="M254 288 C 280 288, 304 417, 330 417" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.75"/>
<rect x="506" y="52" width="148" height="150" rx="8" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
<text x="580" y="72" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">Hvor foregår det?</text>
<text x="580" y="92" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">Tidlig foster:</text>
<text x="580" y="106" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">plommesekken</text>
<text x="580" y="120" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal"></text>
<text x="580" y="134" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">Midt i fosterlivet:</text>
<text x="580" y="148" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">lever (og milt)</text>
<text x="580" y="162" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal"></text>
<text x="580" y="176" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">Fra fødsel og voksen:</text>
<text x="580" y="190" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">benmargen</text>
<rect x="506" y="214" width="148" height="134" rx="8" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
<text x="580" y="234" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">Hos den voksne</text>
<text x="580" y="250" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">ligger den røde</text>
<text x="580" y="262" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">margen igjen i det</text>
<text x="580" y="274" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">aksiale skjelettet:</text>
<text x="580" y="286" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">ryggvirvler, ribben,</text>
<text x="580" y="298" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">brystben, bekken,</text>
<text x="580" y="310" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">kraniet og de</text>
<text x="580" y="322" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">proksimale endene av</text>
<text x="580" y="334" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">lårben og overarmsben</text>
<line x1="16" y1="448" x2="654" y2="448" stroke="#6b7280" stroke-width="1" opacity="0.4"/>
<text x="330" y="468" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">Alle blodcellene stammer fra én stamcelletype. Treet forklarer hvorfor en stans i modningen</text>
<text x="330" y="484" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">gir opphopning av umodne forstadier i stedet for ferdige celler.</text>
</svg>
