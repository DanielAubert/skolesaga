<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="stopp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 8 0 L 8 10" stroke="#dc2626" stroke-width="3" fill="none"/></marker></defs><text x="20" y="24" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">Insulinsignalveien: fra reseptor til GLUT4</text><rect x="20" y="70" width="680" height="26" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/><text x="28" y="62" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">utsiden av cellen</text><text x="28" y="116" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">cytosol</text><circle cx="110" cy="42" r="12" fill="#d97706" opacity="0.85"/><text x="130" y="40" font-size="9" text-anchor="start" fill="#d97706" font-weight="700" font-style="normal">insulin</text><line x1="110" y1="54" x2="110" y2="66" stroke="#d97706" stroke-width="1.8" marker-end="url(#pil)"/><rect x="88" y="66" width="16" height="40" rx="3" fill="none" stroke="#3b82f6" stroke-width="2"/><rect x="116" y="66" width="16" height="40" rx="3" fill="none" stroke="#3b82f6" stroke-width="2"/><circle cx="96" cy="112" r="5" fill="#dc2626"/><circle cx="124" cy="112" r="5" fill="#dc2626"/><text x="96" y="115.5" font-size="7" text-anchor="middle" fill="#ffffff" font-weight="700" font-style="normal">P</text><text x="124" y="115.5" font-size="7" text-anchor="middle" fill="#ffffff" font-weight="700" font-style="normal">P</text><text x="150" y="116" font-size="9" text-anchor="start" fill="#3b82f6" font-weight="600" font-style="normal">1. insulinreseptoren er en RTK — den autofosforylerer seg selv</text><line x1="112" y1="124" x2="92" y2="158" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><rect x="40.0" y="163.0" width="100" height="34" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8"/><text x="90" y="184" font-size="10" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">2. IRS</text><rect x="180.0" y="163.0" width="100" height="34" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8"/><text x="230" y="184" font-size="10" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">3. PI3K</text><rect x="320.0" y="163.0" width="100" height="34" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8"/><text x="370" y="184" font-size="10" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">4. PIP₃</text><rect x="460.0" y="163.0" width="100" height="34" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8"/><text x="510" y="184" font-size="10" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">5. Akt (PKB)</text><line x1="142" y1="180" x2="176" y2="180" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><line x1="282" y1="180" x2="316" y2="180" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><line x1="422" y1="180" x2="456" y2="180" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><line x1="510" y1="199" x2="510" y2="227" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><rect x="425.0" y="231.0" width="170" height="38" rx="6" fill="none" stroke="#0d9488" stroke-width="1.8"/><text x="510" y="254" font-size="10" text-anchor="middle" fill="#0d9488" font-weight="700" font-style="normal">6. GLUT4-vesikler</text><line x1="595" y1="250" x2="646" y2="250" stroke="#0d9488" stroke-width="1.8"/><line x1="646" y1="250" x2="646" y2="100" stroke="#0d9488" stroke-width="1.8" marker-end="url(#pil)"/><text x="300" y="142" font-size="9" text-anchor="start" fill="#0d9488" font-weight="700" font-style="normal">7. GLUT4 settes inn i membranen</text><rect x="632" y="66" width="28" height="30" rx="4" fill="none" stroke="#0d9488" stroke-width="2"/><circle cx="596" cy="36" r="8" fill="#0d9488" opacity="0.8"/><text x="576" y="40" font-size="9" text-anchor="end" fill="#0d9488" font-weight="700" font-style="normal">glukose</text><line x1="604" y1="44" x2="628" y2="62" stroke="#0d9488" stroke-width="1.8" marker-end="url(#pil)"/><text x="20" y="300" font-size="10" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">Kjeden du skal kunne skrive i riktig rekkefølge:</text><text x="20" y="320" font-size="10" text-anchor="start" fill="#8b5cf6" font-weight="600" font-style="normal">insulin → RTK (autofosforylering) → IRS → PI3K → PIP₃ → Akt → GLUT4 til membranen → glukoseopptak</text><text x="20" y="346" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="italic">Røde sirkler med P er fosfatgrupper. Skjematisk tegning — ikke et mikroskopibilde og ikke i målestokk.</text></svg>