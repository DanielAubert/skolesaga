<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="pd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="p4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/></marker><marker id="p8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker></defs>
<rect x="92" y="96" width="548" height="234" rx="72" fill="none" stroke="#2563eb" stroke-width="2"/>
<rect x="382" y="134" width="228" height="158" rx="48" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
<text x="430" y="76" font-size="13" fill="#6b7280" font-weight="bold" text-anchor="middle">THYMUS</text>
<text x="232" y="124" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">cortex thymi — ytre sone</text>
<text x="496" y="160" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="middle">medulla thymi — indre sone</text>
<text x="8" y="200" font-size="11" fill="#6b7280">benmargen</text>
<text x="8" y="215" font-size="10" fill="#6b7280">(forløper)</text>
<line x1="76" y1="211" x2="146" y2="211" stroke="#6b7280" stroke-width="1.8" marker-end="url(#p)"/>
<circle cx="176" cy="211" r="19" fill="none" stroke="#2563eb" stroke-width="1.9"/>
<text x="176" y="216" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">DN</text>
<text x="176" y="256" font-size="10" fill="#6b7280" text-anchor="middle">verken CD4 eller CD8</text>
<text x="176" y="272" font-size="10" fill="#6b7280" text-anchor="middle">VDJ-rekombinasjon</text>
<line x1="197" y1="211" x2="255" y2="211" stroke="#6b7280" stroke-width="1.8" marker-end="url(#p)"/>
<circle cx="290" cy="211" r="19" fill="none" stroke="#2563eb" stroke-width="1.9"/>
<text x="290" y="216" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">DP</text>
<text x="298" y="256" font-size="10" fill="#6b7280" text-anchor="middle">både CD4 og CD8</text>
<text x="298" y="274" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="bold">POSITIV seleksjon</text>
<line x1="290" y1="190" x2="290" y2="62" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pd)"/>
<text x="256" y="42" font-size="9.5" fill="#9ca3af" text-anchor="middle">binder ikke eget MHC</text>
<text x="256" y="54" font-size="9.5" fill="#9ca3af" text-anchor="middle">→ dør</text>
<line x1="311" y1="211" x2="366" y2="211" stroke="#6b7280" stroke-width="1.8" marker-end="url(#p)"/>
<circle cx="452" cy="186" r="19" fill="none" stroke="#0d9488" stroke-width="1.9"/>
<text x="452" y="191" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="bold">SP</text>
<text x="482" y="191" font-size="10.5" fill="#0d9488">CD4⁺</text>
<circle cx="452" cy="248" r="19" fill="none" stroke="#d97706" stroke-width="1.9"/>
<text x="452" y="253" font-size="11" fill="#d97706" text-anchor="middle" font-weight="bold">SP</text>
<text x="482" y="253" font-size="10.5" fill="#d97706">CD8⁺</text>
<text x="496" y="282" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="bold">NEGATIV seleksjon</text>
<line x1="470" y1="170" x2="556" y2="62" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#pd)"/>
<text x="596" y="42" font-size="9.5" fill="#9ca3af" text-anchor="middle">binder eget peptid for sterkt</text>
<text x="596" y="54" font-size="9.5" fill="#9ca3af" text-anchor="middle">→ fjernes</text>
<line x1="524" y1="182" x2="656" y2="158" stroke="#0d9488" stroke-width="1.8" marker-end="url(#p4)"/>
<line x1="524" y1="252" x2="656" y2="276" stroke="#d97706" stroke-width="1.8" marker-end="url(#p8)"/>
<text x="664" y="150" font-size="11" fill="#0d9488" font-weight="bold">modne CD4⁺</text>
<text x="664" y="164" font-size="10" fill="#6b7280">hjelpeceller</text>
<text x="664" y="272" font-size="11" fill="#d97706" font-weight="bold">modne CD8⁺</text>
<text x="664" y="286" font-size="10" fill="#6b7280">drapsceller</text>
<line x1="60" y1="356" x2="720" y2="356" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.7"/>
<text x="60" y="382" font-size="11.5" fill="#d97706" font-weight="bold">MHC klasse I → CD8⁺</text>
<text x="240" y="382" font-size="10" fill="#6b7280">alle celler med kjerne · peptid fra cellens eget indre</text>
<text x="60" y="402" font-size="11.5" fill="#0d9488" font-weight="bold">MHC klasse II → CD4⁺</text>
<text x="240" y="402" font-size="10" fill="#6b7280">antigenpresenterende celler · peptid tatt opp utenfra</text>
<text x="60" y="428" font-size="9" fill="#6b7280">Skjematisk tegning — ikke et mikroskopibilde. Cellene og sonene er ikke i målestokk.</text>
</svg>
