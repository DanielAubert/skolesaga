<text x="656.0" y="260.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="700">EKSPIRASJON</text>
<text x="656.0" y="278.0" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400">ingen aktiv muskel</text>
<text x="656.0" y="292.0" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400">— elastisk</text>
<text x="656.0" y="306.0" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400">tilbaketrekning</text>
<text x="360.0" y="448.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">Pleura visceralis (heltrukket) ligger PA lungen; pleura parietalis (stiplet) kler brystveggen og diafragma.</text>
<text x="360.0" y="466.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">Mellom bladene ligger cavitas pleuralis — en tynn vaeskespalte, sterkt overdrevet i tegningen.</text>
<text x="360.0" y="484.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">Recessus costodiaphragmaticus er lommen lungen ikke fyller ved rolig pust.</text>
