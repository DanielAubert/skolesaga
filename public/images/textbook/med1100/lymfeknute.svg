<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs><marker id="pl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/></marker></defs>
<ellipse cx="350" cy="196" rx="176" ry="126" fill="none" stroke="#2563eb" stroke-width="2"/>
<ellipse cx="350" cy="196" rx="126" ry="86" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4"/>
<ellipse cx="350" cy="196" rx="66" ry="44" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 3"/>
<circle cx="298" cy="102" r="18" fill="none" stroke="#2563eb" stroke-width="1.7"/>
<circle cx="298" cy="102" r="8" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="2 2"/>
<circle cx="350" cy="96" r="18" fill="none" stroke="#2563eb" stroke-width="1.7"/>
<circle cx="402" cy="102" r="18" fill="none" stroke="#2563eb" stroke-width="1.7"/>
<circle cx="402" cy="102" r="8" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="2 2"/>
<circle cx="212" cy="236" r="18" fill="none" stroke="#2563eb" stroke-width="1.7"/>
<line x1="420" y1="180" x2="456" y2="206" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
<circle cx="430" cy="187" r="2.4" fill="#0d9488"/>
<circle cx="440" cy="194" r="2.4" fill="#0d9488"/>
<circle cx="450" cy="201" r="2.4" fill="#0d9488"/>
<text x="350" y="192" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="bold">medulla</text>
<text x="350" y="206" font-size="9.5" fill="#6b7280" text-anchor="middle">plasmaceller</text>
<text x="350" y="218" font-size="9.5" fill="#6b7280" text-anchor="middle">og makrofager</text>
<text x="350" y="258" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="bold">paracortex — T-celler</text>
<text x="350" y="302" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="bold">cortex — B-celler i follikler</text>
<line x1="96" y1="140" x2="176" y2="140" stroke="#d97706" stroke-width="1.9" marker-end="url(#pl)"/>
<line x1="96" y1="196" x2="176" y2="196" stroke="#d97706" stroke-width="1.9" marker-end="url(#pl)"/>
<line x1="96" y1="252" x2="176" y2="252" stroke="#d97706" stroke-width="1.9" marker-end="url(#pl)"/>
<text x="90" y="118" font-size="11" fill="#d97706" text-anchor="end" font-weight="bold">vasa afferentia</text>
<text x="90" y="133" font-size="10" fill="#6b7280" text-anchor="end">FLERE tilførende</text>
<text x="90" y="146" font-size="10" fill="#6b7280" text-anchor="end">lymfekar inn</text>
<text x="90" y="272" font-size="10" fill="#6b7280" text-anchor="end">lymfen bringer</text>
<text x="90" y="285" font-size="10" fill="#6b7280" text-anchor="end">antigenet</text>
<path d="M 514 176 q -24 20 0 40" fill="none" stroke="#6b7280" stroke-width="1.6"/>
<line x1="516" y1="168" x2="548" y2="146" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="552" y="143" font-size="10" fill="#6b7280">hilus</text>
<line x1="524" y1="196" x2="612" y2="196" stroke="#d97706" stroke-width="1.9" marker-end="url(#pl)"/>
<text x="620" y="192" font-size="11" fill="#d97706" font-weight="bold">vas efferens</text>
<text x="620" y="207" font-size="10" fill="#6b7280">ETT fraførende</text>
<text x="620" y="220" font-size="10" fill="#6b7280">lymfekar ut</text>
<text x="620" y="256" font-size="11" fill="#0d9488" font-weight="bold">høyendotelvenyler</text>
<text x="620" y="271" font-size="10" fill="#6b7280">naive lymfocytter</text>
<text x="620" y="284" font-size="10" fill="#6b7280">kommer inn med BLODET</text>
<line x1="612" y1="250" x2="462" y2="212" stroke="#0d9488" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="288" y1="86" x2="250" y2="56" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
<text x="244" y="44" font-size="10" fill="#2563eb" text-anchor="end" font-weight="bold">follikkel med kimsenter</text>
<text x="244" y="58" font-size="9.5" fill="#6b7280" text-anchor="end">(lysere senter = respons pågår)</text>
<line x1="60" y1="342" x2="700" y2="342" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.7"/>
<text x="60" y="368" font-size="11" fill="#6b7280">To innganger, to strømmer: <tspan fill="#d97706" font-weight="bold">lymfen</tspan> bringer antigenet inn gjennom vasa afferentia, <tspan fill="#0d9488" font-weight="bold">blodet</tspan> bringer cellene</text>
<text x="60" y="384" font-size="11" fill="#6b7280">inn gjennom høyendotelvenylene. Møtet mellom dem er hele organets hensikt.</text>
<text x="60" y="412" font-size="9" fill="#6b7280">Skjematisk tegning — ikke et mikroskopibilde. Sonene og cellene er ikke i målestokk.</text>
</svg>
