<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="stopp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 8 0 L 8 10" stroke="#dc2626" stroke-width="3" fill="none"/></marker></defs><text x="20" y="24" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">Den indre (mitokondrielle) apoptoseveien</text><rect x="45.0" y="50.0" width="210" height="32" rx="6" fill="none" stroke="#6b7280" stroke-width="1.8"/><text x="150" y="70" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">1. cellestress / DNA-skade</text><line x1="150" y1="83" x2="150" y2="110" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><rect x="65.0" y="112.0" width="170" height="32" rx="6" fill="none" stroke="#d97706" stroke-width="1.8"/><text x="150" y="132" font-size="9" text-anchor="middle" fill="#d97706" font-weight="700" font-style="normal">2. Bax aktiveres</text><line x1="48" y1="176" x2="104" y2="146" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#stopp)"/><text x="20" y="194" font-size="9" text-anchor="start" fill="#dc2626" font-weight="700" font-style="normal">Bcl-2 hemmer Bax</text><text x="20" y="208" font-size="9" text-anchor="start" fill="#dc2626" font-weight="700" font-style="normal">(anti-apoptotisk)</text><line x1="150" y1="145" x2="150" y2="180" stroke="#d97706" stroke-width="1.8" marker-end="url(#pil)"/><text x="168" y="166" font-size="9" text-anchor="start" fill="#d97706" font-weight="700" font-style="normal">3. porer i ytre mitokondriemembran</text><ellipse cx="170" cy="242" rx="100" ry="44" fill="none" stroke="#0d9488" stroke-width="2"/><path d="M 88 228 q 24 -14 48 0 q 24 14 48 0 q 24 -14 48 0" fill="none" stroke="#0d9488" stroke-width="1.3" opacity="0.7"/><path d="M 88 262 q 24 -14 48 0 q 24 14 48 0 q 24 -14 48 0" fill="none" stroke="#0d9488" stroke-width="1.3" opacity="0.7"/><text x="170" y="246" font-size="9" text-anchor="middle" fill="#0d9488" font-weight="700" font-style="normal">mitokondrie</text><circle cx="262" cy="214" r="7" fill="#8b5cf6" opacity="0.9"/><line x1="272" y1="206" x2="452" y2="84" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#pil)"/><text x="300" y="196" font-size="9" text-anchor="start" fill="#8b5cf6" font-weight="700" font-style="normal">4. cytokrom c ut i cytosol</text><rect x="460.0" y="54.0" width="200" height="32" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8"/><text x="560" y="74" font-size="9" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">5. APAF-1 + ATP</text><rect x="460.0" y="116.0" width="200" height="32" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8"/><text x="560" y="136" font-size="9" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">6. apoptosomet dannes</text><rect x="460.0" y="178.0" width="200" height="32" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.8"/><text x="560" y="198" font-size="9" text-anchor="middle" fill="#3b82f6" font-weight="700" font-style="normal">7. caspase-9</text><rect x="460.0" y="240.0" width="200" height="32" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.8"/><text x="560" y="260" font-size="9" text-anchor="middle" fill="#3b82f6" font-weight="700" font-style="normal">8. effektorcaspaser</text><rect x="460.0" y="302.0" width="200" height="32" rx="6" fill="none" stroke="#6b7280" stroke-width="1.8"/><text x="560" y="322" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">9. CAD kutter DNA</text><rect x="460.0" y="364.0" width="200" height="32" rx="6" fill="none" stroke="#6b7280" stroke-width="1.8"/><text x="560" y="384" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">DNA-«stigemønster»: n · ~200 bp</text><line x1="560" y1="87" x2="560" y2="114" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><line x1="560" y1="149" x2="560" y2="176" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><line x1="560" y1="211" x2="560" y2="238" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><line x1="560" y1="273" x2="560" y2="300" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><line x1="560" y1="335" x2="560" y2="362" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><text x="20" y="316" font-size="10" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">Rekkefølgen sensor ser etter:</text><text x="20" y="336" font-size="9" text-anchor="start" fill="#8b5cf6" font-weight="600" font-style="normal">Bax → cytokrom c → APAF-1 → apoptosom → caspase-9 → effektorcaspaser</text><text x="20" y="364" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">Apoptose: cellen krymper og pakkes i</text><text x="20" y="378" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">legemer som spises — ingen betennelse.</text><text x="20" y="398" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">Nekrose: cellen sprekker — betennelse.</text><text x="20" y="426" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="italic">Skjematisk tegning — ikke et mikroskopibilde og ikke i målestokk.</text></svg>