<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" width="800" height="316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="400" y="24" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Fire angrepspunkter i bakteriecellen</text>
<text x="400" y="42" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">Skjematisk stavbakterie — ikke et mikroskopibilde</text>
<defs><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#dc2626"/></marker></defs>
<rect x="268" y="96" width="264" height="140" rx="66" fill="none" stroke="#0d9488" stroke-width="3"/>
<rect x="280" y="108" width="240" height="116" rx="56" fill="none" stroke="#3b82f6" stroke-width="2"/>
<text x="400" y="88" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">cellevegg (grønn) og cellemembran (blå)</text>
<path d="M334 172 q 22 -28 44 0 q 22 28 44 0 q 22 -28 44 0" fill="none" stroke="#8b5cf6" stroke-width="2.4"/>
<path d="M334 182 q 22 -28 44 0 q 22 28 44 0 q 22 -28 44 0" fill="none" stroke="#8b5cf6" stroke-width="2.4" opacity="0.6"/>
<text x="400" y="208" font-size="9" text-anchor="middle" fill="#8b5cf6" font-weight="600" font-style="normal">bakterie-DNA</text>
<circle cx="316" cy="134" r="7" fill="#d97706" opacity="0.55"/>
<circle cx="316" cy="130" r="4.4" fill="#d97706" opacity="0.85"/>
<circle cx="342" cy="126" r="7" fill="#d97706" opacity="0.55"/>
<circle cx="342" cy="122" r="4.4" fill="#d97706" opacity="0.85"/>
<circle cx="462" cy="134" r="7" fill="#d97706" opacity="0.55"/>
<circle cx="462" cy="130" r="4.4" fill="#d97706" opacity="0.85"/>
<circle cx="478" cy="150" r="7" fill="#d97706" opacity="0.55"/>
<circle cx="478" cy="146" r="4.4" fill="#d97706" opacity="0.85"/>
<circle cx="322" cy="200" r="7" fill="#d97706" opacity="0.55"/>
<circle cx="322" cy="196" r="4.4" fill="#d97706" opacity="0.85"/>
<text x="390" y="124" font-size="9" text-anchor="middle" fill="#b45309" font-weight="600" font-style="normal">ribosomer</text>
<text x="20" y="108" font-size="10.5" text-anchor="start" fill="#dc2626" font-weight="700" font-style="normal">1  Kryssbindingen i celleveggen</text>
<text x="20" y="122" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">enzymet som knytter kjedene sammen</text>
<line x1="212" y1="116" x2="290" y2="122" stroke="#dc2626" stroke-width="1.8" marker-end="url(#p)"/>
<text x="20" y="208" font-size="10.5" text-anchor="start" fill="#dc2626" font-weight="700" font-style="normal">2  Selve byggesteinen</text>
<text x="20" y="222" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">bindes opp før den kan monteres inn</text>
<line x1="212" y1="216" x2="286" y2="208" stroke="#dc2626" stroke-width="1.8" marker-end="url(#p)"/>
<text x="596" y="116" font-size="10.5" text-anchor="start" fill="#dc2626" font-weight="700" font-style="normal">3  Ribosomet</text>
<text x="596" y="130" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">proteinsyntesen stanser</text>
<line x1="588" y1="124" x2="490" y2="146" stroke="#dc2626" stroke-width="1.8" marker-end="url(#p)"/>
<text x="596" y="208" font-size="10.5" text-anchor="start" fill="#dc2626" font-weight="700" font-style="normal">4  Kveilingen av DNA-et</text>
<text x="596" y="222" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">enzymene som vrir opp dobbelheliksen</text>
<line x1="588" y1="214" x2="470" y2="186" stroke="#dc2626" stroke-width="1.8" marker-end="url(#p)"/>
<line x1="30" y1="262" x2="770" y2="262" stroke="#6b7280" stroke-width="1" opacity="0.4"/>
<text x="400" y="284" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">Angrepspunktene finnes bare hos bakterien. Menneskeceller har verken cellevegg,</text>
<text x="400" y="300" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">bakterielt ribosom eller disse DNA-enzymene — og det er hele grunnlaget for selektiviteten.</text>
</svg>
