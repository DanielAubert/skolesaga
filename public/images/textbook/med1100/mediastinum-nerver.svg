<text x="277.0" y="300.0" font-size="8.5" text-anchor="start" fill="#6b7280" font-weight="600" transform="rotate(-90 277 300)">posterius</text>
<path d="M 62,336 C 128,362 224,360 288,338" fill="none" fill-opacity="0.0" stroke="#0d9488" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="186.0" y="384.0" font-size="9.5" text-anchor="middle" fill="#0d9488" font-weight="700">diaphragma — gulvet i mediastinum</text>
<text x="186.0" y="406.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400">Mediastinum er rommet MELLOM lungene: alt i</text>
<text x="186.0" y="420.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400">brystkassen som ikke er lunge.</text>
<rect x="366.0" y="60.0" width="314.0" height="372.0" rx="8" fill="none" fill-opacity="0" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
<text x="523.0" y="82.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="700">B. Snitt gjennom lungeroten</text>
<polyline points="480.0,104.0 396.0,104.0" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="396.0,104.0 403.3,100.7 403.3,107.3" fill="#6b7280"/>
