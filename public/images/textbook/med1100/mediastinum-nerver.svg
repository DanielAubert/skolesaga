<text x="300.0" y="358.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600">columna</text>
<text x="300.0" y="370.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="600">vertebralis</text>
<line x1="56.0" y1="186.0" x2="330.0" y2="186.0" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="292.0" y="180.0" font-size="9" text-anchor="end" fill="#d97706" font-weight="700">angulus sterni = T4/T5</text>
<text x="186.0" y="164.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="700">mediastinum superius</text>
<rect x="86.0" y="198.0" width="26.0" height="122.0" rx="4" fill="#6b7280" fill-opacity="0.1" stroke="#6b7280" stroke-width="1.2"/>
<text x="99.0" y="300.0" font-size="8.5" text-anchor="start" fill="#6b7280" font-weight="600" transform="rotate(-90 99 300)">anterius</text>
<ellipse cx="190.0" cy="260.0" rx="62.0" ry="58.0" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="1.6"/>
