<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="350.0" y="24.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="700">Mediastinum og de to nervene ved lungeroten</text>
<text x="350.0" y="42.0" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">Skjematisk tegning — ikke et rontgen- eller CT-bilde.</text>
<rect x="20.0" y="60.0" width="330.0" height="372.0" rx="8" fill="none" fill-opacity="0" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
<text x="185.0" y="82.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="700">A. Mediastinum sett fra siden</text>
<polyline points="150.0,104.0 64.0,104.0" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="64.0,104.0 71.3,100.7 71.3,107.3" fill="#6b7280"/>
<text x="107.0" y="118.0" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400">ventralt — mot sternum</text>
