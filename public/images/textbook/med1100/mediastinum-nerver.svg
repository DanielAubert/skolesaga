<polyline points="566.0,104.0 650.0,104.0" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="650.0,104.0 642.7,107.3 642.7,100.7" fill="#6b7280"/>
<text x="608.0" y="120.0" font-size="8.5" text-anchor="middle" fill="#6b7280" font-weight="400">dorsalt</text>
<ellipse cx="523.0" cy="282.0" rx="74.0" ry="58.0" fill="#6b7280" fill-opacity="0.08" stroke="#6b7280" stroke-width="1.8"/>
<text x="523.0" y="210.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="700">radix pulmonis — lungeroten</text>
<ellipse cx="504.0" cy="268.0" rx="20.0" ry="15.0" fill="#6b7280" fill-opacity="0.2" stroke="#6b7280" stroke-width="1.5"/>
<text x="504.0" y="272.0" font-size="7.5" text-anchor="middle" fill="#6b7280" font-weight="600">bronchus</text>
<ellipse cx="546.0" cy="266.0" rx="15.0" ry="12.0" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5"/>
<text x="546.0" y="270.0" font-size="7" text-anchor="middle" fill="#2563eb" font-weight="600">a. pulm.</text>
<ellipse cx="508.0" cy="306.0" rx="15.0" ry="12.0" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="1.5"/>
<text x="508.0" y="310.0" font-size="7" text-anchor="middle" fill="#dc2626" font-weight="600">v. pulm.</text>
<ellipse cx="550.0" cy="304.0" rx="15.0" ry="12.0" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="1.5"/>
<text x="550.0" y="308.0" font-size="7" text-anchor="middle" fill="#dc2626" font-weight="600">v. pulm.</text>
<polyline points="400.0,200.0 396.0,260.0 400.0,320.0 406.0,368.0" fill="none" stroke="#d97706" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="380.0" y="152.0" font-size="10" text-anchor="start" fill="#d97706" font-weight="700">n. phrenicus</text>
<text x="380.0" y="166.0" font-size="9" text-anchor="start" fill="#d97706" font-weight="700">gar FORAN</text>
<text x="380.0" y="180.0" font-size="9" text-anchor="start" fill="#d97706" font-weight="700">lungeroten</text>
<polyline points="406.0,368.0 424.0,390.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="424.0,390.0 416.8,386.4 421.9,382.3" fill="#d97706"/>
<text x="428.0" y="398.0" font-size="9" text-anchor="start" fill="#d97706" font-weight="600">til diaphragma</text>
<polyline points="658.0,200.0 662.0,260.0 656.0,320.0 642.0,368.0" fill="none" stroke="#8b5cf6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668.0" y="152.0" font-size="10" text-anchor="end" fill="#8b5cf6" font-weight="700">n. vagus</text>
<text x="668.0" y="166.0" font-size="9" text-anchor="end" fill="#8b5cf6" font-weight="700">gar BAK</text>
<text x="668.0" y="180.0" font-size="9" text-anchor="end" fill="#8b5cf6" font-weight="700">lungeroten</text>
<polyline points="642.0,368.0 624.0,390.0" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="624.0,390.0 626.1,382.3 631.2,386.4" fill="#8b5cf6"/>
<text x="620.0" y="398.0" font-size="9" text-anchor="end" fill="#8b5cf6" font-weight="600">til spiseror og buk</text>
<text x="523.0" y="420.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400">C3-C5 forsyner n. phrenicus.</text>
<text x="350.0" y="462.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">Nerven foran (ventralt) for lungeroten er n. phrenicus. Nerven bak (dorsalt) er n. vagus.</text>
<text x="350.0" y="480.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">Denne ene relasjonen er den mest testede enkeltopplysningen i thoraksanatomien.</text>
</svg>
