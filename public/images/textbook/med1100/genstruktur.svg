<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><defs><marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="stopp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 8 0 L 8 10" stroke="#dc2626" stroke-width="3" fill="none"/></marker></defs><text x="20" y="24" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">Fra gen til mRNA — og hva du regner på</text><text x="20" y="50" font-size="10" text-anchor="start" fill="#6b7280" font-weight="600" font-style="normal">Genet (DNA)</text><line x1="60" y1="82" x2="540" y2="82" stroke="#6b7280" stroke-width="1.6"/><rect x="60" y="70" width="46" height="24" rx="3" fill="none" stroke="#3b82f6" stroke-width="1.8"/><text x="83.0" y="86" font-size="9" text-anchor="middle" fill="#3b82f6" font-weight="600" font-style="normal">E1</text><rect x="150" y="70" width="62" height="24" rx="3" fill="none" stroke="#3b82f6" stroke-width="1.8"/><text x="181.0" y="86" font-size="9" text-anchor="middle" fill="#3b82f6" font-weight="600" font-style="normal">E2</text><rect x="270" y="70" width="54" height="24" rx="3" fill="none" stroke="#3b82f6" stroke-width="1.8"/><text x="297.0" y="86" font-size="9" text-anchor="middle" fill="#3b82f6" font-weight="600" font-style="normal">E3</text><rect x="390" y="70" width="70" height="24" rx="3" fill="none" stroke="#3b82f6" stroke-width="1.8"/><text x="425.0" y="86" font-size="9" text-anchor="middle" fill="#3b82f6" font-weight="600" font-style="normal">E4</text><rect x="500" y="70" width="40" height="24" rx="3" fill="none" stroke="#3b82f6" stroke-width="1.8"/><text x="520.0" y="86" font-size="9" text-anchor="middle" fill="#3b82f6" font-weight="600" font-style="normal">E5</text><text x="128.0" y="108" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">I1</text><text x="241.0" y="108" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">I2</text><text x="357.0" y="108" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">I3</text><text x="480.0" y="108" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">I4</text><text x="300" y="124" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">5 eksoner gir 4 introner — alltid ett færre</text><line x1="300" y1="134" x2="300" y2="156" stroke="#6b7280" stroke-width="1.8" marker-end="url(#pil)"/><text x="310" y="150" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="normal">transkripsjon + spleising</text><rect x="60" y="176" width="76.8" height="30" rx="4" fill="none" stroke="#0d9488" stroke-width="1.8"/><rect x="136.8" y="176" width="316.8" height="30" rx="4" fill="none" stroke="#8b5cf6" stroke-width="1.8"/><rect x="453.6" y="176" width="86.39999999999999" height="30" rx="4" fill="none" stroke="#d97706" stroke-width="1.8"/><text x="98.4" y="196" font-size="10" text-anchor="middle" fill="#0d9488" font-weight="700" font-style="normal">5′UTR</text><text x="295.20000000000005" y="196" font-size="10" text-anchor="middle" fill="#8b5cf6" font-weight="700" font-style="normal">ORF (kodende område)</text><text x="496.8" y="196" font-size="10" text-anchor="middle" fill="#d97706" font-weight="700" font-style="normal">3′UTR</text><text x="54" y="196" font-size="10" text-anchor="end" fill="#6b7280" font-weight="600" font-style="normal">5′</text><text x="546" y="196" font-size="10" text-anchor="start" fill="#6b7280" font-weight="600" font-style="normal">3′</text><text x="20" y="166" font-size="10" text-anchor="start" fill="#6b7280" font-weight="600" font-style="normal">Moden mRNA (uten poly-A-hale)</text><line x1="136.8" y1="168" x2="136.8" y2="214" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/><line x1="453.6" y1="168" x2="453.6" y2="214" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/><text x="136.8" y="226" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">startkodon AUG</text><text x="453.6" y="226" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">stoppkodon</text><text x="20" y="256" font-size="10" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">Regnereglene:</text><text x="20" y="274" font-size="10" text-anchor="start" fill="#0d9488" font-weight="600" font-style="normal">5′UTR = startkodonets posisjon − 1</text><text x="20" y="290" font-size="10" text-anchor="start" fill="#8b5cf6" font-weight="600" font-style="normal">ORF = 3 · (antall aminosyrer) + 3   (de +3 er stoppkodonet)</text><text x="20" y="306" font-size="10" text-anchor="start" fill="#d97706" font-weight="600" font-style="normal">3′UTR = mRNA-lengde − 5′UTR − ORF</text><text x="430" y="290" font-size="9" text-anchor="start" fill="#6b7280" font-weight="400" font-style="italic">Skjematisk tegning, ikke i målestokk.</text></svg>