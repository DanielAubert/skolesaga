<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" width="640" height="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="320" y="22" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Celleveggen hos gram-positive og gram-negative bakterier</text>
<text x="320" y="40" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">Skjematisk snitt gjennom celleoverflaten — ikke et mikroskopibilde</text>
