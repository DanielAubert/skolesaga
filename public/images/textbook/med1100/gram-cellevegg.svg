<text x="165" y="156" font-size="11" text-anchor="middle" fill="#0f766e" font-weight="700" font-style="normal">tykt peptidoglykan</text>
<text x="165" y="194" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">mange lag — holder på fargekomplekset</text>
<rect x="46" y="206" width="238" height="16" rx="3" fill="#3b82f6" opacity="0.30" stroke="#3b82f6" stroke-width="1.6"/>
<text x="165" y="218" font-size="10" text-anchor="middle" fill="#1d4ed8" font-weight="600" font-style="normal">cellemembran</text>
<text x="165" y="244" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">cytoplasma</text>
<text x="165" y="274" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Ingen ytre membran, intet LPS</text>
<rect x="330" y="56" width="290" height="238" rx="8" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
<text x="475" y="76" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="700" font-style="normal">GRAM-NEGATIV</text>
<text x="475" y="92" font-size="10" text-anchor="middle" fill="#dc2626" font-weight="600" font-style="normal">farges rød/rosa</text>
<text x="475" y="112" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">utsiden av cellen</text>
