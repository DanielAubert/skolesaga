<text x="475" y="188" font-size="10" text-anchor="middle" fill="#0f766e" font-weight="700" font-style="normal">tynt peptidoglykan (i periplasma)</text>
<rect x="356" y="200" width="238" height="16" rx="3" fill="#3b82f6" opacity="0.30" stroke="#3b82f6" stroke-width="1.6"/>
<text x="475" y="212" font-size="10" text-anchor="middle" fill="#1d4ed8" font-weight="600" font-style="normal">cellemembran (indre membran)</text>
<text x="475" y="238" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">cytoplasma</text>
<text x="475" y="268" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">Ytre membran + LPS gjør at fargekomplekset</text>
<text x="475" y="281" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">vaskes ut igjen — cellen tar motfargen</text>
<line x1="20" y1="306" x2="620" y2="306" stroke="#6b7280" stroke-width="1" opacity="0.4"/>
<text x="320" y="324" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="600" font-style="normal">Gram-fargingen måler ÉN ting: hvor tykt peptidoglykanlaget er.</text>
<text x="320" y="340" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="normal">Tykt lag holder på fargen (blå) — tynt lag mister den (rød).</text>
