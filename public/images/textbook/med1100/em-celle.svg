<text x="20.0" y="356.0" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700" font-style="normal">Tolkningen: mye ruER + stor nukleolus = cellen driver høy proteinsyntese for eksport.</text>
<text x="20.0" y="380.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal" font-style="normal">Heterokromatinet ligger som mørke klumper langs kjernemembranen; eukromatinet er det lyse feltet innenfor.</text>
<text x="20.0" y="404.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal" font-style="normal">Skjematisk tegning — ikke et elektronmikroskopibilde. Strukturene er tegnet forenklet og ikke i målestokk.</text>
