<text x="265.0" y="330.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400">hoyre kammer</text>
<text x="265.0" y="346.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">tynn vegg</text>
