<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" width="700" height="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="350.0" y="24.0" font-size="13" text-anchor="middle" fill="#6b7280" font-weight="700">Hjertets kamre, klaffer og de store karene</text>
<text x="350.0" y="42.0" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">Skjematisk koblingstegning — ikke et rontgen- eller CT-bilde.</text>
<text x="350.0" y="60.0" font-size="9.5" text-anchor="middle" fill="#6b7280" font-weight="400" font-style="italic">Hjertet er sett forfra, sa pasientens hoyre side ligger til venstre i figuren.</text>
<rect x="190.0" y="160.0" width="330.0" height="280.0" rx="26" fill="none" fill-opacity="0" stroke="#0d9488" stroke-width="3"/>
<text x="355.0" y="462.0" font-size="9.5" text-anchor="middle" fill="#0d9488" font-weight="600">myocardium — hjertemuskelen. Legg merke til at veggen er mye tykkere rundt venstre kammer.</text>
