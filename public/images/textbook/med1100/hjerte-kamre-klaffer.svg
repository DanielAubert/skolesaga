<text x="419.0" y="214.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400">venstre forkammer</text>
<rect x="332.0" y="174.0" width="24.0" height="56.0" rx="4" fill="#0d9488" fill-opacity="0.2" stroke="#0d9488" stroke-width="1.2"/>
