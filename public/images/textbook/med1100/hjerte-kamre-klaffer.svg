<text x="552.0" y="274.0" font-size="10" text-anchor="start" fill="#dc2626" font-weight="700">aorta ascendens</text>
<text x="552.0" y="330.0" font-size="9.5" text-anchor="start" fill="#dc2626" font-weight="700">valva aortae</text>
<text x="552.0" y="344.0" font-size="8.5" text-anchor="start" fill="#6b7280" font-weight="400">porten ut av venstre kammer</text>
<text x="28.0" y="490.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">Blodets vei: vv. cavae → atrium dextrum → valva tricuspidalis → ventriculus dexter → valva trunci pulmonalis → lungene</text>
<text x="28.0" y="508.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">→ vv. pulmonales → atrium sinistrum → valva mitralis → ventriculus sinister → valva aortae → aorta.</text>
