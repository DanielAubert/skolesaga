<text x="269.0" y="198.0" font-size="11" text-anchor="middle" fill="#2563eb" font-weight="700">atrium dextrum</text>
<text x="269.0" y="214.0" font-size="9" text-anchor="middle" fill="#6b7280" font-weight="400">hoyre forkammer</text>
