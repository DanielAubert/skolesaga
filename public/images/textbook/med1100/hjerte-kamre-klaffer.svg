<line x1="449.0" y1="234.0" x2="425.0" y2="246.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
<text x="419.0" y="262.0" font-size="9.5" text-anchor="middle" fill="#dc2626" font-weight="700">valva mitralis</text>
