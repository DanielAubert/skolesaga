  <text x="66" y="120" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">f&#8242; &gt; 0</text>
  <text x="222" y="326" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">f&#8242; &lt; 0</text>
  <text x="374" y="120" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">f&#8242; &gt; 0</text>
  <text x="30" y="348" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">f vokser &#8212; f avtar &#8212; f vokser. Stasjon&#230;rpunkter i x = 0 (topp) og x = 2 (bunn).</text>
