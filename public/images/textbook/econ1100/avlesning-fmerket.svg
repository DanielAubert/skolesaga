<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <text x="30" y="26" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">Gitt grafen til f&#8242; &#8212; hva sier den om f?</text>
