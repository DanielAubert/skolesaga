  <circle cx="155" cy="80" r="5" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="345" cy="80" r="5" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="70" fill="#2563eb" font-family="system-ui, sans-serif" font-size="18">+</text>
  <text x="245" y="70" fill="#2563eb" font-family="system-ui, sans-serif" font-size="18">&#8722;</text>
  <text x="390" y="70" fill="#2563eb" font-family="system-ui, sans-serif" font-size="18">+</text>
  <text x="147" y="100" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">&#8722;1</text>
  <text x="341" y="100" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">3</text>
  <text x="76" y="118" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">vokser</text>
  <text x="228" y="118" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">avtar</text>
  <text x="366" y="118" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">vokser</text>

  <text x="20" y="172" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="14">f&#8243;</text>
  <line x1="60" y1="180" x2="440" y2="180" stroke="#6b7280" stroke-width="1.6"/>
  <circle cx="250" cy="180" r="5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="150" y="170" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="18">&#8722;</text>
  <text x="340" y="170" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="18">+</text>
  <text x="246" y="200" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">1</text>
  <text x="126" y="218" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">konkav</text>
  <text x="316" y="218" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">konveks</text>

  <line x1="60" y1="252" x2="440" y2="252" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="20" y="284" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">Konklusjon: toppunkt i x = &#8722;1, bunnpunkt i x = 3,</text>
  <text x="20" y="304" fill="#6b7280" font-family="system-ui, sans-serif" font-size="13">vendepunkt i x = 1 (der f&#8243; skifter fortegn).</text>
  <text x="20" y="330" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">Skjemaet ER begrunnelsen &#8212; intervallene skal leses av her, ikke pastas.</text>
