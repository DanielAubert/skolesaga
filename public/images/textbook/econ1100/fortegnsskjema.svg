  <text x="20" y="26" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">Fortegnsskjema for f(x) = x&#179; &#8722; 3x&#178; &#8722; 9x + 5</text>

  <text x="20" y="72" fill="#2563eb" font-family="system-ui, sans-serif" font-size="14">f&#8242;</text>
