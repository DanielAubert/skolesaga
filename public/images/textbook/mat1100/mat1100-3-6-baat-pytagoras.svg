<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Baat trukket mot kai - Pytagoras-modell</title>
  <!-- vannlinje -->
  <line x1="40" y1="280" x2="440" y2="280" stroke="#6b7280" stroke-width="2"/>
  <text x="60" y="300" fill="#6b7280" font-size="14">vannlinje</text>
  <!-- kai (vertikal) -->
  <line x1="400" y1="280" x2="400" y2="130" stroke="#6b7280" stroke-width="2"/>
  <!-- vinsj (punkt oppe paa kaia) -->
  <circle cx="400" cy="130" r="5" fill="#2563eb"/>
  <text x="360" y="120" fill="#2563eb" font-size="14">vinsj</text>
  <!-- rett vinkel ved kaifot -->
  <rect x="384" y="264" width="16" height="16" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <!-- baat (punkt paa vannet) -->
  <circle cx="90" cy="280" r="5" fill="#dc2626"/>
  <text x="70" y="272" fill="#dc2626" font-size="14">baat</text>
  <!-- tau (hypotenus) -->
  <line x1="90" y1="280" x2="400" y2="130" stroke="#dc2626" stroke-width="2.5"/>
  <!-- maalelabels -->
  <text x="230" y="300" fill="#111827" font-size="16">x</text>
  <text x="410" y="210" fill="#111827" font-size="16">3 m</text>
  <text x="220" y="190" fill="#dc2626" font-size="16">L (tau)</text>
  <!-- fartsretning: tauet trekkes inn -->
  <text x="230" y="150" fill="#111827" font-size="13">dL/dt = -1 m/s</text>
</svg>
