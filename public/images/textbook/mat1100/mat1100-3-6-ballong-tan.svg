<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Heliumballong stiger - tan-vinkelmodell</title>
  <!-- bakken -->
  <line x1="40" y1="300" x2="440" y2="300" stroke="#6b7280" stroke-width="2"/>
  <text x="60" y="320" fill="#6b7280" font-size="14">bakken</text>
  <!-- observatoer -->
  <circle cx="80" cy="300" r="5" fill="#2563eb"/>
  <text x="45" y="292" fill="#2563eb" font-size="14">observatoer</text>
  <!-- vertikal oppstigning -->
  <line x1="380" y1="300" x2="380" y2="120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- rett vinkel ved bakken -->
  <rect x="364" y="284" width="16" height="16" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <!-- ballong -->
  <circle cx="380" cy="120" r="14" fill="#dc2626"/>
  <text x="398" y="118" fill="#dc2626" font-size="14">ballong</text>
  <!-- synslinje (hypotenus) -->
  <line x1="80" y1="300" x2="380" y2="120" stroke="#111827" stroke-width="2.5"/>
  <!-- vinkel theta ved observatoer -->
  <path d="M 130 300 A 50 50 0 0 0 122 273" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="135" y="288" fill="#059669" font-size="16">&#952;</text>
  <!-- labels -->
  <text x="210" y="320" fill="#111827" font-size="16">50 m</text>
  <text x="390" y="220" fill="#111827" font-size="16">h</text>
  <text x="300" y="150" fill="#111827" font-size="13">dh/dt = 3 m/s</text>
</svg>
