<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Stige som glir ned langs vegg - Pytagoras-modell</title>
  <!-- bakken -->
  <line x1="40" y1="300" x2="440" y2="300" stroke="#6b7280" stroke-width="2"/>
  <text x="55" y="320" fill="#6b7280" font-size="14">bakken</text>
  <!-- vegg (vertikal) -->
  <line x1="110" y1="300" x2="110" y2="90" stroke="#6b7280" stroke-width="2"/>
  <text x="60" y="150" fill="#6b7280" font-size="14">vegg</text>
  <!-- rett vinkel -->
  <rect x="110" y="284" width="16" height="16" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <!-- stige (hypotenus) -->
  <line x1="110" y1="130" x2="330" y2="300" stroke="#dc2626" stroke-width="3"/>
  <!-- topp-punkt paa vegg -->
  <circle cx="110" cy="130" r="5" fill="#dc2626"/>
  <!-- fot-punkt paa bakken -->
  <circle cx="330" cy="300" r="5" fill="#dc2626"/>
  <!-- labels -->
  <text x="75" y="220" fill="#111827" font-size="16">y</text>
  <text x="215" y="320" fill="#111827" font-size="16">x</text>
  <text x="240" y="205" fill="#dc2626" font-size="16">L = 5 m</text>
  <!-- foten glir utover -->
  <text x="250" y="290" fill="#111827" font-size="13">dx/dt = 0,5 m/s</text>
</svg>
