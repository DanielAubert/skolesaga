<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Omdreiningsomraade om x-aksen - skivemetoden</title>
  <!-- akser -->
  <line x1="60" y1="250" x2="450" y2="250" stroke="#6b7280" stroke-width="2"/>
  <polygon points="450,250 440,245 440,255" fill="#6b7280"/>
  <text x="452" y="255" fill="#6b7280" font-size="15">x</text>
  <line x1="95" y1="320" x2="95" y2="40" stroke="#6b7280" stroke-width="2"/>
  <polygon points="95,40 90,50 100,50" fill="#6b7280"/>
  <text x="80" y="52" fill="#6b7280" font-size="15">y</text>
  <!-- omraade under kurven (skyggelagt) -->
  <path d="M130,250 Q250,-70 370,250 Z" fill="#3b82f6" fill-opacity="0.15" stroke="none"/>
  <!-- kurven y=f(x) -->
  <path d="M130,250 Q250,-70 370,250" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="300" y="120" fill="#2563eb" font-size="15">y = f(x)</text>
  <!-- representativ skive (vertikal stripe) ved x -->
  <line x1="250" y1="250" x2="250" y2="90" stroke="#dc2626" stroke-width="2"/>
  <line x1="245" y1="90" x2="255" y2="90" stroke="#dc2626" stroke-width="2"/>
  <text x="258" y="175" fill="#dc2626" font-size="13">f(x)</text>
  <!-- skive som ellipse under aksen (omdreining) -->
  <ellipse cx="250" cy="290" rx="16" ry="40" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.5"/>
  <text x="270" y="300" fill="#dc2626" font-size="12">skive, radius f(x)</text>
  <!-- grenser a og b -->
  <line x1="130" y1="246" x2="130" y2="254" stroke="#6b7280" stroke-width="2"/>
  <text x="124" y="270" fill="#111827" font-size="14">a</text>
  <line x1="370" y1="246" x2="370" y2="254" stroke="#6b7280" stroke-width="2"/>
  <text x="366" y="270" fill="#111827" font-size="14">b</text>
  <!-- rotasjonsnotat -->
  <text x="120" y="30" fill="#111827" font-size="13">dreies om x-aksen &#8594; V = &#960; &#8747; f(x)&#178; dx</text>
</svg>
