<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Omraadet under y=ln x fra x=1 til x=e dreid om y-aksen (sylinderskall)</title>
  <!-- akser -->
  <line x1="60" y1="250" x2="450" y2="250" stroke="#6b7280" stroke-width="2"/>
  <polygon points="450,250 440,245 440,255" fill="#6b7280"/>
  <text x="452" y="255" fill="#6b7280" font-size="15">x</text>
  <line x1="90" y1="320" x2="90" y2="40" stroke="#6b7280" stroke-width="2"/>
  <polygon points="90,40 85,50 95,50" fill="#6b7280"/>
  <text x="72" y="52" fill="#6b7280" font-size="15">y</text>
  <!-- x=1 og x=e markeringer -->
  <line x1="180" y1="246" x2="180" y2="254" stroke="#6b7280" stroke-width="2"/>
  <text x="176" y="270" fill="#111827" font-size="14">1</text>
  <line x1="335" y1="246" x2="335" y2="254" stroke="#6b7280" stroke-width="2"/>
  <text x="330" y="270" fill="#111827" font-size="14">e</text>
  <!-- y=1 markering -->
  <line x1="86" y1="160" x2="94" y2="160" stroke="#6b7280" stroke-width="2"/>
  <text x="74" y="165" fill="#111827" font-size="13">1</text>
  <!-- omraade under y=ln x fra x=1 til x=e (skyggelagt) -->
  <path d="M180,250 L335,250 L335,160 Q262,196 180,250 Z" fill="#3b82f6" fill-opacity="0.15" stroke="none"/>
  <!-- kurven y=ln x -->
  <path d="M180,250 Q262,196 335,160" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="300" y="150" fill="#2563eb" font-size="15">y = ln x</text>
  <!-- representativt sylinderskall ved avstand x -->
  <rect x="265" y="188" width="10" height="62" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.5"/>
  <!-- avstand x fra y-aksen -->
  <line x1="90" y1="272" x2="270" y2="272" stroke="#111827" stroke-width="1.5"/>
  <text x="175" y="288" fill="#111827" font-size="14">x</text>
  <ellipse cx="180" cy="250" rx="90" ry="13" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="282" y="210" fill="#dc2626" font-size="12">skall, radius x</text>
  <!-- rotasjonsnotat -->
  <text x="100" y="30" fill="#111827" font-size="13">dreies om y-aksen &#8594; V = 2&#960; &#8747;&#8321;&#7497; x&#183;ln x dx</text>
</svg>
