<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Omdreiningsomraade om y-aksen - sylinderskallmetoden</title>
  <!-- akser -->
  <line x1="60" y1="250" x2="450" y2="250" stroke="#6b7280" stroke-width="2"/>
  <polygon points="450,250 440,245 440,255" fill="#6b7280"/>
  <text x="452" y="255" fill="#6b7280" font-size="15">x</text>
  <line x1="110" y1="320" x2="110" y2="40" stroke="#6b7280" stroke-width="2"/>
  <polygon points="110,40 105,50 115,50" fill="#6b7280"/>
  <text x="92" y="52" fill="#6b7280" font-size="15">y</text>
  <!-- omraade under kurven fra x=0 (skyggelagt) -->
  <path d="M110,250 L110,110 Q240,110 360,250 Z" fill="#3b82f6" fill-opacity="0.15" stroke="none"/>
  <!-- kurven y=f(x) -->
  <path d="M110,110 Q240,110 360,250" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="250" y="150" fill="#2563eb" font-size="15">y = f(x)</text>
  <!-- representativ vertikal stripe (skall) ved avstand x -->
  <rect x="215" y="163" width="10" height="87" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.5"/>
  <!-- avstand x fra y-aksen -->
  <line x1="110" y1="270" x2="220" y2="270" stroke="#111827" stroke-width="1.5"/>
  <text x="150" y="286" fill="#111827" font-size="14">x</text>
  <!-- speilet stripe (rotasjonen) -->
  <rect x="-5" y="163" width="10" height="87" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1" transform="translate(220,0)"/>
  <ellipse cx="167.5" cy="250" rx="57.5" ry="12" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="238" y="200" fill="#dc2626" font-size="12">skall, radius x</text>
  <!-- rotasjonsnotat -->
  <text x="120" y="30" fill="#111827" font-size="13">dreies om y-aksen &#8594; V = 2&#960; &#8747; x&#183;f(x) dx</text>
</svg>
