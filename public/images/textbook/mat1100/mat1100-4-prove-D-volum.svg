<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Prove 4.D - omraade under y=e^(x^2) dreid om y-aksen</title>
  <!-- akser -->
  <line x1="60" y1="280" x2="450" y2="280" stroke="#6b7280" stroke-width="2"/>
  <polygon points="450,280 440,275 440,285" fill="#6b7280"/>
  <text x="452" y="285" fill="#6b7280" font-size="15">x</text>
  <line x1="120" y1="330" x2="120" y2="40" stroke="#6b7280" stroke-width="2"/>
  <polygon points="120,40 115,50 125,50" fill="#6b7280"/>
  <text x="102" y="52" fill="#6b7280" font-size="15">y</text>
  <!-- x=1 markering -->
  <line x1="320" y1="276" x2="320" y2="284" stroke="#6b7280" stroke-width="2"/>
  <text x="315" y="300" fill="#111827" font-size="14">1</text>
  <!-- y=1 (e^0) og y=e markeringer -->
  <line x1="116" y1="230" x2="124" y2="230" stroke="#6b7280" stroke-width="2"/>
  <text x="96" y="235" fill="#111827" font-size="13">1</text>
  <line x1="116" y1="90" x2="124" y2="90" stroke="#6b7280" stroke-width="2"/>
  <text x="92" y="95" fill="#111827" font-size="13">e</text>
  <!-- omraade under y=e^(x^2) fra x=0 til x=1 (skyggelagt): fra y=1 opp til kurven -->
  <path d="M120,230 L320,230 L320,90 Q220,205 120,230 Z" fill="#3b82f6" fill-opacity="0.15" stroke="none"/>
  <!-- kurven y=e^(x^2): (0,1)->(1,e), konveks stigende -->
  <path d="M120,230 Q220,205 320,90" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="250" y="140" fill="#2563eb" font-size="15">y = e^(x&#178;)</text>
  <!-- representativt sylinderskall ved avstand x -->
  <rect x="215" y="147" width="10" height="83" fill="#dc2626" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="120" y1="255" x2="220" y2="255" stroke="#111827" stroke-width="1.5"/>
  <text x="160" y="271" fill="#111827" font-size="14">x</text>
  <ellipse cx="220" cy="230" rx="100" ry="14" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="232" y="180" fill="#dc2626" font-size="12">skall, radius x</text>
  <!-- rotasjonsnotat -->
  <text x="130" y="30" fill="#111827" font-size="13">dreies om y-aksen &#8594; V = 2&#960; &#8747;&#8320;&#185; x&#183;e^(x&#178;) dx</text>
</svg>
