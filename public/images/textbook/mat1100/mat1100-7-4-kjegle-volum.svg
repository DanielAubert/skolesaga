<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Omraadet under linjen y=mx fra x=0 til x=h dreid om x-aksen (kjegle)</title>
  <!-- akser -->
  <line x1="50" y1="200" x2="450" y2="200" stroke="#6b7280" stroke-width="2"/>
  <polygon points="450,200 440,195 440,205" fill="#6b7280"/>
  <text x="452" y="205" fill="#6b7280" font-size="15">x</text>
  <line x1="90" y1="320" x2="90" y2="40" stroke="#6b7280" stroke-width="2"/>
  <polygon points="90,40 85,50 95,50" fill="#6b7280"/>
  <text x="72" y="52" fill="#6b7280" font-size="15">y</text>
  <!-- x=h markering -->
  <line x1="330" y1="196" x2="330" y2="204" stroke="#6b7280" stroke-width="2"/>
  <text x="322" y="220" fill="#111827" font-size="14">h</text>
  <!-- omraade under y=mx fra x=0 til x=h (trekant, skyggelagt) -->
  <path d="M90,200 L330,200 L330,90 Z" fill="#3b82f6" fill-opacity="0.15" stroke="none"/>
  <!-- linjen y=mx -->
  <line x1="90" y1="200" x2="330" y2="90" stroke="#2563eb" stroke-width="2.5"/>
  <text x="200" y="120" fill="#2563eb" font-size="15">y = mx</text>
  <!-- speilet linje (rotasjonen om x-aksen) -->
  <line x1="90" y1="200" x2="330" y2="310" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3"/>
  <!-- endeflate (sirkel-ellipse) ved x=h -->
  <ellipse cx="330" cy="200" rx="14" ry="110" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.3"/>
  <!-- representativ skive ved x -->
  <line x1="230" y1="154" x2="230" y2="246" stroke="#dc2626" stroke-width="1.4"/>
  <text x="236" y="150" fill="#dc2626" font-size="12">skive, radius mx</text>
  <!-- rotasjonsnotat -->
  <text x="100" y="30" fill="#111827" font-size="13">dreies om x-aksen &#8594; V = &#960; &#8747;&#8320;&#8340; (mx)&#178; dx</text>
</svg>
