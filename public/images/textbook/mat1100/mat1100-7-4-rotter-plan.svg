<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>Roettene til p(z)=z^3-5z^2+11z-15 i det komplekse planet: 1+2i, 1-2i og 3</title>
  <!-- akser (reell = x, imaginaer = y) -->
  <line x1="40" y1="180" x2="450" y2="180" stroke="#6b7280" stroke-width="2"/>
  <polygon points="450,180 440,175 440,185" fill="#6b7280"/>
  <text x="452" y="185" fill="#6b7280" font-size="14">Re</text>
  <line x1="90" y1="330" x2="90" y2="30" stroke="#6b7280" stroke-width="2"/>
  <polygon points="90,30 85,40 95,40" fill="#6b7280"/>
  <text x="72" y="42" fill="#6b7280" font-size="14">Im</text>
  <!-- rutenett-markeringer paa reell akse: 1 og 3 -->
  <line x1="160" y1="176" x2="160" y2="184" stroke="#6b7280" stroke-width="2"/>
  <text x="155" y="200" fill="#111827" font-size="13">1</text>
  <line x1="300" y1="176" x2="300" y2="184" stroke="#6b7280" stroke-width="2"/>
  <text x="296" y="200" fill="#111827" font-size="13">3</text>
  <!-- imaginaer akse: 2 og -2 -->
  <line x1="86" y1="110" x2="94" y2="110" stroke="#6b7280" stroke-width="2"/>
  <text x="70" y="115" fill="#111827" font-size="13">2</text>
  <line x1="86" y1="250" x2="94" y2="250" stroke="#6b7280" stroke-width="2"/>
  <text x="66" y="255" fill="#111827" font-size="13">-2</text>
  <!-- hjelpelinje som viser konjugatsymmetri om reell akse -->
  <line x1="160" y1="110" x2="160" y2="250" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- rot z0 = 1+2i -->
  <circle cx="160" cy="110" r="5" fill="#2563eb"/>
  <text x="168" y="106" fill="#2563eb" font-size="14">z&#8320; = 1 + 2i</text>
  <!-- konjugatrot 1-2i -->
  <circle cx="160" cy="250" r="5" fill="#2563eb"/>
  <text x="168" y="262" fill="#2563eb" font-size="14">z&#772;&#8320; = 1 &#8722; 2i</text>
  <!-- reell rot 3 -->
  <circle cx="300" cy="180" r="5" fill="#dc2626"/>
  <text x="308" y="172" fill="#dc2626" font-size="14">z = 3 (reell rot)</text>
  <text x="120" y="320" fill="#111827" font-size="12">Konjugatparet ligger speilet om den reelle aksen.</text>
</svg>
