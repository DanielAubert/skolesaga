<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Diagram med pris p på den loddrette aksen og mengde x på den vannrette. En fallende etterspørselskurve og en stigende tilbudskurve krysser i likevektspunktet A ved likevektspris p-stjerne og likevektsmengde x-stjerne. Trekanten over p-stjerne og under etterspørselskurven er skravert rødt og merket KO. Trekanten under p-stjerne og over tilbudskurven er skravert blått og merket PO.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic" fill="#000">x</text>
  <text x="60" y="26" font-size="16" font-style="italic" fill="#000">p</text>
  <polygon points="70,170 70,50 230,170" fill="#c0392b" opacity="0.15"/>
  <polygon points="70,170 70,280 230,170" fill="#2471a3" opacity="0.15"/>
  <line x1="70" y1="50" x2="390" y2="290" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="70" y1="280" x2="390" y2="60" stroke="#2471a3" stroke-width="2.4"/>
  <text x="396" y="284" font-size="16" font-weight="bold" fill="#c0392b">E</text>
  <text x="396" y="68" font-size="16" font-weight="bold" fill="#2471a3">T</text>
  <line x1="70" y1="170" x2="230" y2="170" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="230" y1="170" x2="230" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="230" cy="170" r="4" fill="#222"/>
  <text x="238" y="163" font-size="15" font-weight="bold" fill="#000">A</text>
  <text x="44" y="175" font-size="14" font-style="italic" fill="#000">p*</text>
  <text x="223" y="318" font-size="14" font-style="italic" fill="#000">x*</text>
  <text x="112" y="138" font-size="14" font-weight="bold" fill="#c0392b">KO</text>
  <text x="112" y="216" font-size="14" font-weight="bold" fill="#2471a3">PO</text>
</svg>
