<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Naturlig monopol: gjennomsnittskostnaden GK faller mot den konstante marginalkostnaden MK fordi den store faste kostnaden fordeles på flere enheter. Regulatoren står i et dilemma: pris lik GK gjør bedriften selvfinansierende (punktet der E møter GK), men pris lik MK er samfunnsøkonomisk effektivt og gir underskudd (der E møter MK, under GK).">
