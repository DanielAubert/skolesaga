  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <polyline points="94.9,81.7 103.8,122.0 115.7,153.6 130.5,176.9 148.3,194.0 172.1,207.8 201.8,218.4 243.4,227.2 288.0,233.0 332.6,236.9 392.0,240.5" fill="none" stroke="#8250df" stroke-width="2.4"/>
  <line x1="80.0" y1="256.3" x2="392.0" y2="256.3" stroke="#1a7f37" stroke-width="2.2"/>
  <line x1="80.0" y1="69.7" x2="392.0" y2="276.0" stroke="#c0392b" stroke-width="2.4"/>
  <circle cx="332.9" cy="236.9" r="4" fill="#222"/>
  <circle cx="362.3" cy="256.3" r="4" fill="#222"/>
  <text x="92.9" y="75.7" font-size="14" fill="#8250df" font-weight="bold">GK</text>
  <text x="300.0" y="248.3" font-size="14" fill="#1a7f37" font-weight="bold">MK</text>
  <text x="192.0" y="134.4" font-size="15" fill="#c0392b" font-weight="bold">E</text>
  <text x="328.9" y="226.9" font-size="11" fill="#8250df" font-style="italic">pris = GK</text>
  <text x="360.3" y="318.0" font-size="11" fill="#1a7f37" font-style="italic">pris = MK</text>
