<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Komparativ statikk: et tilbudsskift. Den fallende E-kurven ligger fast. Tilbudet skifter inn (opp til venstre) fra T til T-merket fordi innsatsen blir dyrere. Likevekten flytter seg fra A til A-merket: høyere pris og lavere mengde. Stiplede hjelpelinjer viser begge prisene og mengdene på aksene.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <line x1="85.0" y1="60.0" x2="385.0" y2="290.0" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="95.0" y1="290.0" x2="385.0" y2="70.0" stroke="#2471a3" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="95.0" y1="242.0" x2="385.0" y2="22.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="365.0" y="285.0" font-size="16" fill="#c0392b" font-weight="bold">E</text>
  <text x="300.0" y="60.0" font-size="15" fill="#2471a3" font-weight="bold">T'</text>
  <text x="352.0" y="92.0" font-size="13" fill="#2471a3" font-weight="bold">T</text>
  <line x1="70.0" y1="179.4" x2="240.8" y2="179.4" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="240.8" y1="179.4" x2="240.8" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="240.8" cy="179.4" r="4" fill="#222"/>
  <line x1="70.0" y1="155.3" x2="209.3" y2="155.3" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="209.3" y1="155.3" x2="209.3" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="209.3" cy="155.3" r="4" fill="#222"/>
  <text x="247.8" y="194.4" font-size="14" fill="#000" font-style="italic" font-weight="bold">A</text>
  <text x="193.3" y="148.3" font-size="14" fill="#000" font-style="italic" font-weight="bold">A'</text>
  <text x="40.0" y="184.4" font-size="13" fill="#000" font-style="italic">p*</text>
  <text x="34.0" y="160.3" font-size="13" fill="#000" font-style="italic">p<tspan font-size="9" dy="4" font-style="normal">1</tspan></text>
  <text x="234.8" y="318.0" font-size="13" fill="#000" font-style="italic">x*</text>
  <text x="201.3" y="318.0" font-size="13" fill="#000" font-style="italic">x<tspan font-size="9" dy="4" font-style="normal">1</tspan></text>
</svg>
