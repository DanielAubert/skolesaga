<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Negativ eksternalitet: etterspørselskurven, den private marginalkostnaden MK (privat tilbud) og den samfunnsøkonomiske marginalkostnaden SMK som ligger over MK med den marginale eksterne skaden. Markedet havner der E møter MK (for stor mengde x_marked), mens samfunnsøkonomisk optimum er der E møter SMK (lavere x_opt). Trekanten mellom de to mengdene er dødvektstapet.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <polygon points="202.5,157.1 241.2,185.8 241.2,130.8" fill="#bf8700" opacity="0.26"/>
  <line x1="85.0" y1="70.0" x2="375.0" y2="285.0" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="95.0" y1="285.0" x2="375.0" y2="95.0" stroke="#2471a3" stroke-width="2.4"/>
  <line x1="95.0" y1="230.0" x2="375.0" y2="40.0" stroke="#a94db0" stroke-width="2.2"/>
  <text x="381.0" y="291.0" font-size="16" fill="#c0392b" font-weight="bold">E</text>
  <text x="381.0" y="99.0" font-size="13" fill="#2471a3" font-weight="bold">MK</text>
  <text x="381.0" y="44.0" font-size="13" fill="#a94db0" font-weight="bold">SMK</text>
  <circle cx="241.2" cy="185.8" r="4" fill="#222"/>
  <circle cx="202.5" cy="157.1" r="4" fill="#222"/>
  <line x1="241.2" y1="185.8" x2="241.2" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="202.5" y1="157.1" x2="202.5" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="227.2" y="318" font-size="12" font-style="italic">x<tspan font-size="9" dy="4" font-style="normal">marked</tspan></text>
  <text x="189.5" y="318" font-size="12" font-style="italic">x<tspan font-size="9" dy="4" font-style="normal">opt</tspan></text>
</svg>
