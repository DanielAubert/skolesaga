<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Monopoltilpasning: den fallende etterspørselskurven, marginalinntekten MI som faller dobbelt så bratt, og en vannrett marginalkostnad MK. Monopolisten velger mengden x_M der MI er lik MK, og leser prisen p_M rett opp på etterspørselskurven. Stiplede hjelpelinjer viser p_M på prisaksen og x_M på mengdeaksen.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <line x1="78.0" y1="70.0" x2="360.0" y2="300.0" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="70.0" y1="63.5" x2="215.0" y2="300.0" stroke="#a94db0" stroke-width="2.0"/>
  <line x1="70.0" y1="235.0" x2="395.0" y2="235.0" stroke="#1a7f37" stroke-width="2.2"/>
  <text x="345.0" y="279.8" font-size="16" fill="#c0392b" font-weight="bold">E</text>
  <text x="213.0" y="292.0" font-size="14" fill="#a94db0" font-weight="bold">MI</text>
  <text x="398.0" y="240.0" font-size="14" fill="#1a7f37" font-weight="bold">MK</text>
  <line x1="70.0" y1="149.2" x2="175.2" y2="149.2" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="175.2" y1="149.2" x2="175.2" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="175.2" cy="149.2" r="4" fill="#222"/>
  <text x="36.0" y="154.2" font-size="13" fill="#000" font-style="italic">p<tspan font-size="9" dy="4" font-style="normal">M</tspan></text>
  <text x="167.2" y="318.0" font-size="13" fill="#000" font-style="italic">x<tspan font-size="9" dy="4" font-style="normal">M</tspan></text>
</svg>
