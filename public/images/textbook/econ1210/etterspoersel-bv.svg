<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Etterspørselskurven bygges av betalingsvillighet: still kjøperne opp etter hvor mye de maksimalt vil betale, fra høyest til lavest. Hver kjøper er ett trinn — de med høy betalingsvillighet kjøper først. Den glatte, fallende E-kurven er denne trappa når kjøperne er mange.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <polyline points="78.0,86.0 78.0,86.0 128.0,86.0 128.0,116.0 178.0,116.0 178.0,148.0 228.0,148.0 228.0,182.0 278.0,182.0 278.0,214.0 328.0,214.0 328.0,244.0 378.0,244.0" fill="none" stroke="#d19a94" stroke-width="2.0"/>
  <line x1="78.0" y1="78.0" x2="378.0" y2="252.0" stroke="#c0392b" stroke-width="2.4"/>
  <text x="374.0" y="260.0" font-size="16" fill="#c0392b" font-weight="bold">E</text>
  <text x="134.0" y="96.0" font-size="10" fill="#555" font-style="italic">hvert trinn = én kjøpers betalingsvillighet</text>
</svg>
