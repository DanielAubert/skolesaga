<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Stykkskatt som en kile: kjøperprisen p-kjøper leses opp på E-kurven og selgerprisen p-selger ned på T-kurven ved den nye, lavere mengden x1. Den loddrette avstanden mellom dem er skatten t. Trekanten mellom kilen og likevektspunktet A er dødvektstapet.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <polygon points="175.9,129.7 175.9,228.6 240.8,179.4" fill="#bf8700" opacity="0.28"/>
  <line x1="85.0" y1="60.0" x2="385.0" y2="290.0" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="95.0" y1="290.0" x2="385.0" y2="70.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="365.0" y="285.0" font-size="16" fill="#c0392b" font-weight="bold">E</text>
  <text x="365.0" y="82.0" font-size="16" fill="#2471a3" font-weight="bold">T</text>
  <line x1="175.9" y1="129.7" x2="175.9" y2="228.6" stroke="#222" stroke-width="1.6"/>
  <line x1="70.0" y1="129.7" x2="175.9" y2="129.7" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="228.6" x2="175.9" y2="228.6" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="175.9" y1="179.2" x2="175.9" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="175.9" cy="129.7" r="4" fill="#222"/>
  <circle cx="175.9" cy="228.6" r="4" fill="#222"/>
  <circle cx="240.8" cy="179.4" r="4" fill="#222"/>
  <text x="248.8" y="173.4" font-size="15" font-weight="bold">A</text>
  <text x="16.0" y="134.7" font-size="13" fill="#000" font-style="italic">p<tspan font-size="9" dy="4" font-style="normal">kjøper</tspan></text>
  <text x="18.0" y="233.6" font-size="13" fill="#000" font-style="italic">p<tspan font-size="9" dy="4" font-style="normal">selger</tspan></text>
  <text x="182.9" y="183.2" font-size="15" fill="#000" font-style="italic" font-weight="bold">t</text>
  <text x="167.9" y="318.0" font-size="14" fill="#000" font-style="italic">x<tspan font-size="10" dy="4" font-style="normal">1</tspan></text>
  <text x="234.8" y="318.0" font-size="14" fill="#000" font-style="italic">x*</text>
</svg>
