<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Arbeidsmarkedet som marked: lønn w loddrett, sysselsetting N vannrett. Fallende arbeidsetterspørsel (AE, bedriftene) og stigende arbeidstilbud (AT, arbeiderne) krysser i likevekten med lønn w-stjerne og sysselsetting N-stjerne.">
