  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <line x1="192.0" y1="70.0" x2="268.0" y2="270.0" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="85.0" y1="105.0" x2="395.0" y2="245.0" stroke="#bf8700" stroke-width="2.4"/>
  <circle cx="230.0" cy="175.0" r="4" fill="#222"/>
  <text x="162.0" y="76.0" font-size="12" fill="#c0392b" font-style="italic">bratt</text>
  <text x="162.0" y="92.0" font-size="11" fill="#c0392b" font-style="italic">(uelastisk)</text>
  <text x="325.0" y="261.0" font-size="12" fill="#bf8700" font-style="italic">slak (elastisk)</text>
</svg>
