<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Elastisitet: to etterspørselskurver gjennom samme punkt. Den bratte kurven er lite elastisk (uelastisk) — mengden endrer seg lite når prisen endrer seg. Den slake kurven er svært elastisk — mengden endrer seg mye ved samme prisendring.">
