  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <polyline points="78.0,252.0 78.0,252.0 128.0,252.0 128.0,222.0 178.0,222.0 178.0,194.0 228.0,194.0 228.0,168.0 278.0,168.0 278.0,144.0 328.0,144.0 328.0,122.0 378.0,122.0" fill="none" stroke="#7a9cc0" stroke-width="2.0"/>
  <line x1="78.0" y1="262.0" x2="378.0" y2="118.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="372.0" y="132.0" font-size="16" fill="#2471a3" font-weight="bold">T</text>
  <text x="140.0" y="270.0" font-size="11" fill="#555" font-style="italic">hvert trinn = ett anlegg</text>
</svg>
