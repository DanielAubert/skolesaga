<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Tilbudskurven i anleggsmodellen: hvert anlegg produserer til sin egen konstante enhetskostnad. Ordner vi anleggene fra billigst til dyrest, danner de en stigende trapp — hvert trinn er ett anlegg som slås på når prisen når enhetskostnaden. Den glatte, stigende tilbudskurven er trappa når anleggene er mange og små.">
