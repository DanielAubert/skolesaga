<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Elastisiteten varierer langs én rett etterspørselskurve: i den øvre delen (høy pris, lav mengde) er den elastisk (tallverdi over 1), i den nedre delen (lav pris, høy mengde) er den uelastisk (tallverdi under 1), og nøyaktig i midtpunktet er den enhetselastisk (tallverdi lik 1). Stigningstallet er det samme hele veien — elastisiteten er det ikke.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <line x1="76.0" y1="64.8" x2="364.0" y2="295.2" stroke="#c0392b" stroke-width="2.4"/>
  <text x="368.0" y="296.2" font-size="15" fill="#c0392b" font-weight="bold">E</text>
  <circle cx="220.0" cy="180.0" r="4" fill="#222"/>
  <text x="232.0" y="172.0" font-size="12" fill="#222" font-style="italic">|ε| = 1</text>
  <text x="160.0" y="106.0" font-size="13" fill="#1a7f37" font-weight="bold">elastisk</text>
  <text x="160.0" y="122.0" font-size="12" fill="#1a7f37" font-style="italic">|ε| &gt; 1</text>
  <text x="222.0" y="258.0" font-size="13" fill="#bf8700" font-weight="bold">uelastisk</text>
  <text x="222.0" y="274.0" font-size="12" fill="#bf8700" font-style="italic">|ε| &lt; 1</text>
</svg>
