<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Markedslikevekt: fallende E-kurve og stigende T-kurve krysser i punktet A, med likevektspris p-stjerne og likevektsmengde x-stjerne markert med stiplede hjelpelinjer.">
  <rect width="440" height="360" fill="#ffffff"/>
  <!-- Axes -->
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <!-- Axis arrows -->
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <!-- Axis labels -->
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <!-- E-kurve (fallende): from (85,60) to (380,290) -->
  <line x1="85" y1="60" x2="380" y2="290" stroke="#c0392b" stroke-width="2.4"/>
  <text x="360" y="285" font-size="16" fill="#c0392b" font-weight="bold">E</text>
  <!-- T-kurve (stigende): from (95,290) to (380,70) -->
  <line x1="95" y1="290" x2="380" y2="70" stroke="#2471a3" stroke-width="2.4"/>
  <text x="360" y="82" font-size="16" fill="#2471a3" font-weight="bold">T</text>
  <!-- Intersection A approx at (232,178) -->
  <circle cx="232" cy="178" r="4" fill="#222"/>
  <text x="238" y="172" font-size="15" font-weight="bold">A</text>
  <!-- Dashed helper lines -->
  <line x1="70" y1="178" x2="232" y2="178" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="232" y1="178" x2="232" y2="300" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- p* and x* labels -->
  <text x="40" y="183" font-size="14" font-style="italic">p*</text>
  <text x="224" y="318" font-size="14" font-style="italic">x*</text>
</svg>
