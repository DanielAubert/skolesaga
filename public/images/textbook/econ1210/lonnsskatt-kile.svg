<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Lønnsskatt som kile i arbeidsmarkedet: skatten skifter arbeidsetterspørselen ned fra AE til AE-merket. Ved den nye, lavere sysselsettingen N1 betaler arbeidsgiveren w_AG (lest opp på AE) mens arbeidstakeren sitter igjen med w_AT (lest ned på arbeidstilbudet AT). Den loddrette avstanden er lønnsskatten t. Trekanten fram til likevekten er dødvektstapet.">
