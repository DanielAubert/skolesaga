<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Tilbudskutt i strømmarkedet: tilbudskurven skifter parallelt innover til T-prime (x=2p-400). Ny likevekt B (mengde 300, pris 350) ligger oppe til venstre for den opprinnelige likevekten A (400, 300). Ved den gamle prisen 300 tilbyr det skadde markedet bare 200 GWh, men omsatt mengde faller bare til 300 fordi den høyere prisen trekker inn igjen anlegg — lekkasjen.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="406" y="326" font-size="13" font-style="italic" text-anchor="end">x (GWh)</text>
  <text x="62" y="24" font-size="13" font-style="italic">p (øre/kWh)</text>
  <line x1="70.0" y1="63.6" x2="370.0" y2="300.0" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="70.0" y1="252.7" x2="310.0" y2="63.6" stroke="#2471a3" stroke-width="2.4"/>
  <line x1="70.0" y1="205.5" x2="250.0" y2="63.6" stroke="#2471a3" stroke-width="2.4" stroke-dasharray="6 4"/>
  <line x1="70.0" y1="158.2" x2="190.0" y2="158.2" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="190.0" y1="158.2" x2="190.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="134.5" x2="160.0" y2="134.5" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="160.0" y1="134.5" x2="160.0" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="190.0" cy="158.2" r="4" fill="#222"/>
  <text x="198.0" y="150.2" font-size="16" font-weight="bold">A</text>
  <circle cx="160.0" cy="134.5" r="4" fill="#222"/>
  <text x="140.0" y="128.5" font-size="16" font-weight="bold">B</text>
  <text x="334.0" y="239.3" font-size="16" fill="#c0392b" font-weight="bold" font-style="italic">E</text>
  <text x="286.0" y="59.6" font-size="16" fill="#2471a3" font-weight="bold" font-style="italic">T</text>
  <text x="238.0" y="59.6" font-size="15" fill="#2471a3" font-weight="bold" font-style="italic">T′</text>
  <text x="64.0" y="163.2" font-size="13" fill="#666" text-anchor="end">300</text>
  <text x="64.0" y="131.5" font-size="13" fill="#666" text-anchor="end">350</text>
  <text x="160.0" y="316.0" font-size="12" fill="#666" text-anchor="middle">300</text>
  <text x="190.0" y="332.0" font-size="12" fill="#666" text-anchor="middle">400</text>
</svg>
