<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Stykksubsidie som kile: subsidien utvider mengden til x1, større enn likevektsmengden x*. Ved x1 får selgeren p_selger (lest opp på T-kurven) mens kjøperen betaler p_kjøper (lest ned på E-kurven). Avstanden er subsidien s. Trekanten mellom likevekten A og den nye mengden er dødvektstapet — samfunnet taper selv om begge sider «vinner» (subsidie-paradokset).">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">x</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <polygon points="240.8,179.4 301.3,133.5 301.3,225.9" fill="#bf8700" opacity="0.28"/>
  <line x1="85.0" y1="60.0" x2="385.0" y2="290.0" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="95.0" y1="290.0" x2="385.0" y2="70.0" stroke="#2471a3" stroke-width="2.4"/>
  <text x="363.0" y="285.0" font-size="13" fill="#c0392b" font-weight="bold">E</text>
  <text x="345.0" y="82.0" font-size="13" fill="#2471a3" font-weight="bold">T</text>
  <line x1="301.3" y1="225.9" x2="301.3" y2="133.5" stroke="#222" stroke-width="1.6"/>
  <line x1="70.0" y1="225.9" x2="301.3" y2="225.9" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="133.5" x2="301.3" y2="133.5" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="301.3" y1="179.7" x2="301.3" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="301.3" cy="225.9" r="4" fill="#222"/>
  <circle cx="301.3" cy="133.5" r="4" fill="#222"/>
  <circle cx="240.8" cy="179.4" r="4" fill="#222"/>
  <text x="224.8" y="175.4" font-size="15" font-weight="bold">A</text>
  <text x="18.0" y="138.5" font-size="12" fill="#000" font-style="italic">p<tspan font-size="9" dy="4" font-style="normal">selger</tspan></text>
  <text x="16.0" y="230.9" font-size="12" fill="#000" font-style="italic">p<tspan font-size="9" dy="4" font-style="normal">kjøper</tspan></text>
  <text x="308.3" y="183.7" font-size="15" fill="#000" font-style="italic" font-weight="bold">s</text>
  <text x="224.8" y="318.0" font-size="13" fill="#000" font-style="italic">x*</text>
  <text x="293.3" y="318.0" font-size="13" fill="#000" font-style="italic">x<tspan font-size="9" dy="4" font-style="normal">1</tspan></text>
</svg>
