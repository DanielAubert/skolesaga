<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Householder-refleksjon: en vektor speiles om hyperplanet vinkelrett på v">
  <!-- koordinatakser -->
  <line x1="30" y1="180" x2="450" y2="180" stroke="#6b7280" stroke-width="1" opacity="0.45"/>
  <line x1="240" y1="30" x2="240" y2="330" stroke="#6b7280" stroke-width="1" opacity="0.45"/>
  <!-- speilplanet v-perp (hyperplanet) -->
  <line x1="94" y1="233" x2="386" y2="127" stroke="#6b7280" stroke-width="2"/>
  <text x="96" y="250" font-family="sans-serif" font-size="14" font-style="italic" fill="#6b7280">v<tspan baseline-shift="super" font-size="10">⊥</tspan> (speilplan)</text>
  <!-- normalvektoren v -->
  <line x1="240" y1="180" x2="214" y2="110" stroke="#6b7280" stroke-width="2"/>
  <polygon points="214,110 221.6,118.9 214.1,121.7" fill="#6b7280"/>
  <text x="196" y="104" font-family="sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#6b7280">v</text>
  <!-- vektor x -->
  <line x1="240" y1="180" x2="335" y2="95" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="335,95 329.5,105.3 324.1,99.3" fill="#2563eb"/>
  <text x="340" y="92" font-family="sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#2563eb">x</text>
  <!-- speilbildet Rx -->
  <line x1="240" y1="180" x2="367" y2="184" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="367,184 355.9,187.6 356.1,179.6" fill="#2563eb"/>
  <text x="372" y="196" font-family="sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#2563eb">Rx</text>
  <!-- forbindelseslinje (vinkelrett på speilplanet, halvert av det) -->
  <line x1="335" y1="95" x2="367" y2="184" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4" opacity="0.8"/>
  <circle cx="351" cy="140" r="2.5" fill="#6b7280"/>
  <!-- origo -->
  <circle cx="240" cy="180" r="2.5" fill="#6b7280"/>
  <text x="224" y="196" font-family="sans-serif" font-size="12" fill="#6b7280">O</text>
</svg>
