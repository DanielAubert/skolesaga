<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Beholdningsbudsjettet. Budsjettlinja går fra 450 kilo poteter på den loddrette aksen til 300 kilo gulrøtter på den vannrette, med helning minus 1,5. Beholdningspunktet W, to hundre kilo gulrøtter og hundre og femti kilo poteter, ligger på linja og er markert med stiplede hjelpelinjer til begge akser. Delen av linja til venstre for W er merket at hun selger vare én, delen til høyre at hun kjøper vare én.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="413.0" y="306.0" font-size="15" fill="#000" font-style="italic">c<tspan font-size="10" dy="4.2" font-style="normal">1</tspan></text>
  <text x="54.0" y="25.0" font-size="15" fill="#000" font-style="italic">c<tspan font-size="10" dy="4.2" font-style="normal">2</tspan></text>
  <text x="413.0" y="332.0" font-size="10.5" fill="#666" text-anchor="end">gulrøtter, kg</text>
  <text x="78.0" y="42.0" font-size="10.5" fill="#666">poteter, kg</text>
  <line x1="70.0" y1="114.2" x2="362.7" y2="300.0" stroke="#222" stroke-width="2.6"/>
  <line x1="265.2" y1="238.1" x2="265.2" y2="300.0" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="265.2" y1="238.1" x2="70.0" y2="238.1" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="265.2" cy="238.1" r="4" fill="#222"/>
  <text x="241.2" y="256.1" font-size="14" font-weight="bold" fill="#222">W</text>
  <text x="265.2" y="316.0" font-size="11" fill="#666" text-anchor="middle">200</text>
  <text x="64.0" y="242.1" font-size="11" fill="#666" text-anchor="end">150</text>
  <line x1="235.9" y1="210.4" x2="163.7" y2="164.6" stroke="#1a7f37" stroke-width="1.6"/>
  <polygon points="157.8,160.9 165.3,162.1 162.2,167.1" fill="#1a7f37" opacity="1.0"/>
  <text x="163.7" y="173.2" font-size="11.5" fill="#1a7f37">selger vare 1</text>
  <line x1="296.4" y1="250.5" x2="344.1" y2="280.8" stroke="#c0392b" stroke-width="1.6"/>
  <polygon points="350.0,284.5 342.6,283.2 345.7,278.3" fill="#c0392b" opacity="1.0"/>
  <text x="292.5" y="251.7" font-size="11.5" fill="#c0392b">kjøper vare 1</text>
  <text x="216.4" y="122.5" font-size="11.5" fill="#222">helning −p₁/p₂ = −1,5</text>
  <text x="216.4" y="134.8" font-size="10.5" fill="#666">linja går alltid gjennom W</text>
</svg>
