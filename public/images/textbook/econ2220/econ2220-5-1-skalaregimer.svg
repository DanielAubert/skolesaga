<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Skalautbytte-testen i tre ruter side om side. Hver rute har arbeidsmengden L på den vannrette aksen og kapitalmengden K på den loddrette, to isokvanter — én for produksjonsnivå én og én for nivå to — og en rett stråle fra origo gjennom utgangspunktet på den nederste isokvanten. Doblingspunktet D ligger dobbelt så langt ut på strålen. I den første ruta, konstant skalautbytte, treffer D nøyaktig isokvanten for nivå to. I den andre, tiltakende skalautbytte, ligger D utenfor den. I den tredje, avtakende skalautbytte, ligger D innenfor den.">
