<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Renteøkning for en sparer. Den gamle budsjettlinja går fra 735 til 700 kroner, den nye fra 835 til 668 kroner, og begge går gjennom inntektspunktet fem hundre og to hundre og ti, hvor det er tegnet en rotasjonspil. Den stiplede kompenserte linja har den nye helningen minus 1,25 og går gjennom det gamle optimum A ved 350 kroner. Punktet B ligger ved 322 kroner og det nye optimum C ved 334 kroner på en høyere indifferenskurve. Piler viser substitusjonseffekten fra A til B og inntektsvirkningen fra B til C. Området til venstre for inntektspunktet er merket sparerens side, der den nye linja ligger over den gamle.">
