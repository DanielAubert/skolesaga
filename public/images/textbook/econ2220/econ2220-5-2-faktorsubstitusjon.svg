<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Faktorsubstitusjon når lønna stiger. Arbeid L på den vannrette aksen, kapital K på den loddrette. Én isokvant er uendret. Den opprinnelige isokostlinja med den lave lønna tangerer isokvanten i punktet A. Den nye og brattere isokostlinja med høyere lønn tangerer den samme isokvanten i punktet B, som ligger lenger opp og til venstre. Stiplede hjelpelinjer fra A og B til begge akser viser at arbeidsbruken faller og kapitalbruken stiger. En merknad sier at bedriften beveger seg langs isokvanten, så produksjonsmengden er uendret.">
