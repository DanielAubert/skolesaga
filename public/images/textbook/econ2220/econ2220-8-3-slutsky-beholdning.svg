<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Slutsky-dekomponering med beholdning. Vedmengden i favner er på den vannrette aksen, alt annet forbruk på den loddrette. Beholdningspunktet W med fire favner ved og tjuefire enheter annet forbruk ligger på begge budsjettlinjer. Den opprinnelige linja har helning minus to og skjærer aksene i seksten favner og trettito enheter; tilpasningen er punktet A med åtte favner og seksten enheter, der en konveks indifferenskurve tangerer linja. Etter prisøkningen roterer linja om W og blir brattere, med helning minus fire, og skjærer aksene i ti favner og førti enheter; den nye tilpasningen er punktet C med fem favner og tjue enheter. Den stiplede kompenserte linja har samme helning som den nye, men går gjennom det gamle punktet A og skjærer aksene i tolv favner og førtiåtte enheter; på den ligger punktet B med seks favner og tjuefire enheter. Stiplede hjelpelinjer ned til den vannrette aksen merker åtte, seks og fem. En pil fra A til B er merket substitusjonseffekt lik minus to, og en pil fra B til C er merket inntektsvirkning lik minus én.">
