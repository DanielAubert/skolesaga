<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Slutsky-dekomponering. Den opprinnelige budsjettlinja tangerer en indifferenskurve i A, tre hundre kilowattimer og hundre og tjue enheter annet konsum. Den nye, brattere linja har samme skjæring på den loddrette aksen og tangerer en lavere kurve i C, to hundre kilowattimer. Den stiplede kompenserte linja er parallell med den nye og går gjennom A; den tangerer i B, to hundre og femti kilowattimer. Piler under den vannrette aksen viser substitusjonseffekten fra tre hundre til to hundre og femti og inntektseffekten fra to hundre og femti til to hundre.">
