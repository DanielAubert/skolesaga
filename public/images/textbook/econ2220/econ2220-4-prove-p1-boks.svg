<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Bytteboksen for de to gårdsbrukene i prøve 1. Boksen er tolv høyballer bred og seksten saltsekker høy. Beholdningspunktet W med ti høyballer og to saltsekker til A ligger nede til høyre, med stiplede hjelpelinjer til kantene. Gjennom W er As indifferenskurve svært flat, med helning i tallverdi en femdel, og Bs svært bratt, med tallverdi sju. Linsen mellom dem er skravert og strekker seg opp og til venstre. Den stiplede rette linja fra As origo til Bs origo er kontraktkurven, gitt ved at As forbruk av vare to er fire tredeler av As forbruk av vare en. Punktet E med seks høyballer og åtte saltsekker til A ligger på kontraktkurven, og der tangerer de to indifferenskurvene hverandre med felles helning i tallverdi fire tredeler. Den heltrukne linja gjennom W og E er byttelinja: den realiserte handelen på halvannen saltsekk per høyball, som ligger mellom en femdel og sju og derfor godtas av begge.">
