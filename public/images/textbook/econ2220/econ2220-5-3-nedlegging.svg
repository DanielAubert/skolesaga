<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Nedleggingsbetingelsen med sunkne kostnader. Mengden y på den vannrette aksen, kroner per enhet på den loddrette. Tre kurver: en rett, stigende marginalkostnadskurve gjennom origo, en U-formet kurve for full gjennomsnittskostnad medregnet alle faste kostnader, og en lavere U-formet kurve for gjennomsnittlig unngåelig kostnad. Bunnpunktet på den unngåelige kurven er merket N ved mengde tre og kostnadsnivå hundre og tjue, med stiplede hjelpelinjer til begge akser, og marginalkostnadskurven skjærer den nøyaktig der. En vannrett linje ved hundre og tjue er merket nedleggingspris. Området under denne linja er lett skyggelagt og merket legg ned. En merknad sier at differansen mellom de to gjennomsnittskurvene er den sunkne kostnaden fordelt per enhet.">
