<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Budsjettlinje med fire navngitte punkter for den kvasi-lineære konsumenten. Kinobilletter er på den vannrette aksen, alt annet forbruk på den loddrette. Budsjettlinja går fra null og tjue til tjue og null og har helning minus én. Punktene A med fire billetter og seksten enheter, B med ni og elleve, og C med seksten og fire ligger alle på linja, mens punktet D med fem og ti ligger innenfor linja. Indifferenskurven gjennom B tangerer budsjettlinja. Den lavere indifferenskurven går gjennom både A og C og skjærer budsjettlinja i nettopp de to punktene: brattere i A og slakere i C. Stiplede hjelpelinjer går fra B til ni på den vannrette aksen og elleve på den loddrette. Piler langs linja fra A og fra C peker mot B og er merket kan bytte seg til høyere nytte.">
