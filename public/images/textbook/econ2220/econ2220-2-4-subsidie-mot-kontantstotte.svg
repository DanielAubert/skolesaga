<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Tre budsjettlinjer i samme diagram. Den opprinnelige er bratt, med helning minus fire, og har tilpasningen uten tiltak ved ti kilowattimer. Subsidielinja har samme skjæring på den loddrette aksen, er slak med helning minus én, og tangerer en indifferenskurve i S med førti kilowattimer og førti enheter annet konsum. Kontantstøttelinja er parallell med den opprinnelige og går gjennom S, men indifferenskurven gjennom S skjærer den. Langs kontantstøttelinja finnes et høyere tangeringspunkt K med tjuefem kilowattimer og hundre enheter annet konsum, og en pil går fra S til K.">
