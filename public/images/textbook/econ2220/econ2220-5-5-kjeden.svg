<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Studiekart over de åtte stegene i produsentoppgaven, som et flytskjema med åtte bokser i to kolonner og piler nedover. Steg én: klassifiser teknologien med testen på produktfunksjonen når begge faktorer skaleres. Steg to: kostnadsminimer med Lagrange-funksjonen og førsteordensbetingelsene, slik at forholdet mellom marginalproduktene blir lik forholdet mellom faktorprisene. Steg tre: utled kostnadsfunksjonen. Steg fire: bestem kurveformen fra fortegnet på den andrederiverte. Steg fem: profittmaksimer med prisen lik marginalkostnaden. Steg seks: tilbudskurven, som avhenger av skalaregimet, og nedleggingsprisen. Steg sju: nullprofitt der skalaen er konstant. Steg åtte: halen, altså påstand eller åpen drøfting. En sidepil går fra steg tre til steg fem og er merket at kostnadsfunksjonen er innsatsvaren der. En tekstboks til høyre minner om at steg to og tre alltid kommer før steg fem.">
  <rect width="580" height="400" fill="#ffffff"/>
  <rect x="24.0" y="48.0" width="196.0" height="56.0" fill="#f7f9fb" stroke="#2471a3" stroke-width="1.6" opacity="1.0" rx="6"/>
  <text x="37" y="83" font-size="19" font-weight="bold" fill="#2471a3">1</text>
  <text x="58.0" y="72.0" font-size="11.5" fill="#222">Klassifiser teknologien:</text>
  <text x="58.0" y="87.0" font-size="11.5" fill="#222">F(tK, tL)-testen</text>
  <rect x="24.0" y="132.0" width="196.0" height="56.0" fill="#f7f9fb" stroke="#2471a3" stroke-width="1.6" opacity="1.0" rx="6"/>
  <text x="37" y="167" font-size="19" font-weight="bold" fill="#2471a3">2</text>
  <text x="58.0" y="156.0" font-size="11.5" fill="#222">Kostnadsminimer: Lagrange,</text>
  <text x="58.0" y="171.0" font-size="11.5" fill="#222">FOB, F'K/F'L = r/w</text>
  <rect x="24.0" y="216.0" width="196.0" height="56.0" fill="#f7f9fb" stroke="#2471a3" stroke-width="1.6" opacity="1.0" rx="6"/>
  <text x="37" y="251" font-size="19" font-weight="bold" fill="#2471a3">3</text>
  <text x="58.0" y="240.0" font-size="11.5" fill="#222">Utled kostnadsfunksjonen</text>
  <text x="58.0" y="255.0" font-size="11.5" fill="#222">c(y) = rK* + wL*</text>
  <rect x="24.0" y="300.0" width="196.0" height="56.0" fill="#f7f9fb" stroke="#2471a3" stroke-width="1.6" opacity="1.0" rx="6"/>
  <text x="37" y="335" font-size="19" font-weight="bold" fill="#2471a3">4</text>
  <text x="58.0" y="324.0" font-size="11.5" fill="#222">Kurveform: fortegnet</text>
  <text x="58.0" y="339.0" font-size="11.5" fill="#222">på c''(y)</text>
  <rect x="246.0" y="48.0" width="196.0" height="56.0" fill="#f7f9fb" stroke="#1a7f37" stroke-width="1.6" opacity="1.0" rx="6"/>
  <text x="259" y="83" font-size="19" font-weight="bold" fill="#1a7f37">5</text>
  <text x="280.0" y="72.0" font-size="11.5" fill="#222">Profittmaksimer:</text>
  <text x="280.0" y="87.0" font-size="11.5" fill="#222">p = c'(y)</text>
  <rect x="246.0" y="132.0" width="196.0" height="56.0" fill="#f7f9fb" stroke="#1a7f37" stroke-width="1.6" opacity="1.0" rx="6"/>
  <text x="259" y="167" font-size="19" font-weight="bold" fill="#1a7f37">6</text>
  <text x="280.0" y="156.0" font-size="11.5" fill="#222">Tilbudskurve (avhenger av</text>
  <text x="280.0" y="171.0" font-size="11.5" fill="#222">regimet) + nedleggingspris</text>
  <rect x="246.0" y="216.0" width="196.0" height="56.0" fill="#f7f9fb" stroke="#1a7f37" stroke-width="1.6" opacity="1.0" rx="6"/>
  <text x="259" y="251" font-size="19" font-weight="bold" fill="#1a7f37">7</text>
  <text x="280.0" y="240.0" font-size="11.5" fill="#222">Nullprofitt der skalaen</text>
  <text x="280.0" y="255.0" font-size="11.5" fill="#222">er konstant</text>
  <rect x="246.0" y="300.0" width="196.0" height="56.0" fill="#f7f9fb" stroke="#1a7f37" stroke-width="1.6" opacity="1.0" rx="6"/>
  <text x="259" y="335" font-size="19" font-weight="bold" fill="#1a7f37">8</text>
  <text x="280.0" y="324.0" font-size="11.5" fill="#222">Halen: påstand eller</text>
  <text x="280.0" y="339.0" font-size="11.5" fill="#222">åpen drøfting</text>
  <line x1="122.0" y1="104.0" x2="122.0" y2="121.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="122.0,129.0 118.6,121.0 125.4,121.0" fill="#666" opacity="1.0"/>
  <line x1="122.0" y1="188.0" x2="122.0" y2="205.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="122.0,213.0 118.6,205.0 125.4,205.0" fill="#666" opacity="1.0"/>
  <line x1="122.0" y1="272.0" x2="122.0" y2="289.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="122.0,297.0 118.6,289.0 125.4,289.0" fill="#666" opacity="1.0"/>
  <line x1="344.0" y1="104.0" x2="344.0" y2="121.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="344.0,129.0 340.6,121.0 347.4,121.0" fill="#666" opacity="1.0"/>
  <line x1="344.0" y1="188.0" x2="344.0" y2="205.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="344.0,213.0 340.6,205.0 347.4,205.0" fill="#666" opacity="1.0"/>
  <line x1="344.0" y1="272.0" x2="344.0" y2="289.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="344.0,297.0 340.6,289.0 347.4,289.0" fill="#666" opacity="1.0"/>
  <text x="122.0" y="372.0" font-size="10.5" fill="#666" text-anchor="middle">fortsetter i høyre kolonne →</text>
  <line x1="344.0" y1="24.0" x2="344.0" y2="37.0" stroke="#666" stroke-width="1.6"/>
  <polygon points="344.0,45.0 340.6,37.0 347.4,37.0" fill="#666" opacity="1.0"/>
  <path d="M 220 244.0 C 254 244.0, 212 76.0, 240 76.0" fill="none" stroke="#bf8700" stroke-width="1.6"/>
  <line x1="232.0" y1="76.0" x2="236.0" y2="76.0" stroke="#bf8700" stroke-width="1.6"/>
  <polygon points="243.0,76.0 236.0,78.9 236.0,73.1" fill="#bf8700" opacity="1.0"/>
  <text x="246.0" y="376.0" font-size="10" fill="#bf8700">oransje pil: c(y) fra steg 3 er innsatsvaren i steg 5</text>
  <rect x="448.0" y="284.0" width="126.0" height="76.0" fill="#ffffff" stroke="#bf8700" stroke-width="1.4" opacity="1.0" rx="6"/>
  <text x="456.0" y="302.0" font-size="10.5" fill="#bf8700">Steg 2–3 kommer</text>
  <text x="456.0" y="317.0" font-size="10.5" fill="#bf8700">ALLTID før steg 5 —</text>
  <text x="456.0" y="332.0" font-size="10.5" fill="#bf8700">ellers har du ingen</text>
  <text x="456.0" y="347.0" font-size="10.5" fill="#bf8700">c(y) å derivere.</text>
  <text x="24.0" y="24.0" font-size="15" fill="#222" font-weight="bold">Produsentoppgaven, steg for steg</text>
</svg>
