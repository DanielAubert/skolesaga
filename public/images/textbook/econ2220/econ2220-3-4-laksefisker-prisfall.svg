<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Laksefiskeren og prisfallet. Den gamle budsjettlinja går fra 800 enheter annet konsum til 666,7 enheter fisk med helning minus 1,2, den nye fra 600 enheter til 750 enheter fisk med den slakere helningen minus 0,8. Begge går gjennom beholdningspunktet W ved fem hundre enheter fisk og to hundre enheter annet konsum, hvor det er tegnet en rotasjonspil. Optimum A ved 333,3 enheter fisk og det nye optimum C ved 375 enheter ligger begge til venstre for W, og C ligger på en lavere indifferenskurve. Området til venstre for W er skyggelagt og merket selgerens side, der den nye linja ligger under den gamle.">
