<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Andre velferdsteorem i bytteboksen. Kontraktkurven er tegnet stiplet fra As origo nede til venstre til Bs origo oppe til høyre. Den gamle budsjettlinja går gjennom beholdningspunktet W, og likevekten E ligger på kontraktkurven. Den ønskede allokeringen E-merket ligger et annet sted på kontraktkurven, lenger ut mot Bs origo. Gjennom E-merket går en ny og brattere budsjettlinje som tangerer både As og Bs indifferenskurve der. Det nye beholdningspunktet W-merket ligger på den nye linja, og en pil fra W til W-merket er merket kostnadsfri omfordeling.">
