<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Omfordeling av fyringsolje i prøve 4. Kvadratisk bytteboks tolv ganger tolv. Det gamle beholdningspunktet W med fire fat olje og seks kilo fisk til A og det nye W-merket med ni fat og seks kilo er forbundet med en vannrett pil merket fem fat olje fra B til A. Den gamle budsjettlinja gjennom W har helning minus tre halve, med likevekten E i seks fat og tre kilo, der de to indifferenskurvene tangerer hverandre. Den nye, brattere budsjettlinja gjennom W-merket har helning minus to, og der sammenfaller likevekten E-merket med W-merket selv. Kontraktkurven er tegnet stiplet fra As origo til Bs origo og går gjennom begge likevektene.">
