<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Isokvantkart for produktfunksjonen kvadratrota av kapital ganger arbeid. Arbeidsmengden L er på den vannrette aksen, kapitalmengden K på den loddrette. Tre fallende, konvekse kurver bøyer mot origo og nærmer seg aksene asymptotisk uten å krysse hverandre. Innerst ligger kurven for produksjonsnivå fire, i midten seks og ytterst åtte. På mellomkurven er punktet A merket med fire arbeidsenheter og ni kapitalenheter, og punktet B med ni arbeidsenheter og fire kapitalenheter; begge har stiplede hjelpelinjer ned til begge akser. En pil utover fra origo er merket høyere produksjon.">
