<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Konstruksjonen av den kompenserte budsjettlinja. Den opprinnelige linja går gjennom punktet A. Den kompenserte linja er brattere, stiplet, og trukket gjennom nøyaktig samme punkt A. Skjæringene på den loddrette aksen er merket inntekten delt på prisen på vare to og den kompenserte inntekten delt på samme pris, med en klamme mellom dem merket kompensasjonen: prisøkningen ganget med det opprinnelige konsumet av vare én. Figuren viser bare konstruksjonen, uten indifferenskurver.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="413.0" y="306.0" font-size="15" fill="#000" font-style="italic">c<tspan font-size="10" dy="4.2" font-style="normal">1</tspan></text>
  <text x="54.0" y="25.0" font-size="15" fill="#000" font-style="italic">c<tspan font-size="10" dy="4.2" font-style="normal">2</tspan></text>
  <text x="413.0" y="332.0" font-size="10.5" fill="#666" text-anchor="end">kilowattimer</text>
  <text x="78.0" y="42.0" font-size="10.5" fill="#666">alt annet</text>
  <line x1="70.0" y1="113.8" x2="362.7" y2="300.0" stroke="#666" stroke-width="2.4" stroke-dasharray="6 4"/>
  <line x1="70.0" y1="67.3" x2="313.9" y2="300.0" stroke="#222" stroke-width="2.0" stroke-dasharray="2 3"/>
  <line x1="216.4" y1="206.9" x2="216.4" y2="300.0" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="216.4" y1="206.9" x2="70.0" y2="206.9" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="216.4" cy="206.9" r="4" fill="#222"/>
  <text x="228.4" y="196.9" font-size="14" font-weight="bold" fill="#222">A</text>
  <text x="216.4" y="316.0" font-size="11" fill="#666" text-anchor="middle">300</text>
  <line x1="86.0" y1="113.8" x2="86.0" y2="67.3" stroke="#bf8700" stroke-width="1.4"/>
  <line x1="82.0" y1="113.8" x2="90.0" y2="113.8" stroke="#bf8700" stroke-width="1.4"/>
  <line x1="82.0" y1="67.3" x2="90.0" y2="67.3" stroke="#bf8700" stroke-width="1.4"/>
  <text x="86.0" y="94.5" font-size="10.5" fill="#bf8700"></text>
  <text x="129.5" y="70.4" font-size="10.5" fill="#bf8700">kompensasjonen:</text>
  <text x="129.5" y="82.4" font-size="10.5" fill="#bf8700">Δp₁ · c₁ = 1 · 300 = 300 kr</text>
  <text x="129.5" y="94.4" font-size="10.5" fill="#bf8700">= 60 enheter av vare 2</text>
  <text x="64.0" y="117.8" font-size="11" fill="#666" text-anchor="end">240</text>
  <text x="64.0" y="71.3" font-size="11" fill="#666" text-anchor="end">300</text>
  <text x="279.8" y="218.5" font-size="11" fill="#666">opprinnelig linje</text>
  <text x="231.0" y="133.2" font-size="11" fill="#222">kompensert linje:</text>
  <text x="231.0" y="148.0" font-size="11" fill="#222">ny helning, gjennom A</text>
  <text x="83.7" y="281.4" font-size="10.5" fill="#666">de nye, overkommelige kurvene ligger til venstre for A</text>
</svg>
