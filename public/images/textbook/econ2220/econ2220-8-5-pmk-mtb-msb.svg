<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Produksjonsmulighetskurve der marginal transformasjonsbrøk er lik marginal substitusjonsbrøk. Kvadratmeter skifer er på den vannrette aksen, kubikkmeter grus på den loddrette. Kurven er en konkav kvartsirkel fra null og tjue til tjue og null. En rett verdilinje med helning minus fire tredeler tangerer buen i punktet P med seksten kvadratmeter skifer og tolv kubikkmeter grus, med stiplede hjelpelinjer til seksten på den vannrette aksen og tolv på den loddrette. Konsumentens indifferenskurve er tegnet gjennom samme punkt og har samme helning der, slik at de to brøkene sammenfaller. I tillegg er det tegnet en brattere stiplet tangent i et annet punkt lenger til høyre på buen, merket at brøkene er ulike og at en Pareto-forbedring da er mulig.">
