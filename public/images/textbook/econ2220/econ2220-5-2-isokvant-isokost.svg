<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Kostnadsminimering med isokvant og isokostlinjer. Arbeid L på den vannrette aksen, kapital K på den loddrette. Én fallende, konveks isokvant er merket produktfunksjonen lik en gitt mengde. Tre parallelle, fallende rette isokostlinjer med helning minus lønna delt på kapitalprisen er tegnet. Den nederste treffer ikke isokvanten og er merket for lavt kostnadsnivå. Den midterste tangerer isokvanten i punktet A, med stiplede hjelpelinjer til begge akser. Den øverste skjærer isokvanten i to punkter B og D, som begge gir riktig mengde, men er for dyre. En pil mot origo er merket lavere kostnad. Ved A står det at helningene er like, altså at forholdet mellom marginalproduktene er lik forholdet mellom faktorprisene.">
