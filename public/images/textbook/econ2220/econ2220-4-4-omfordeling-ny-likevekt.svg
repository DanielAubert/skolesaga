<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Omfordeling av beholdningen gir en ny likevekt. Bytteboksen er ti sekker ved bred og tjue enheter strøm høy. Det gamle beholdningspunktet W med åtte og åtte til A og det nye W-merket med fire og åtte til A er forbundet med en vannrett pil merket fire sekker ved fra A til B. To parallelle budsjettlinjer med helning minus to er tegnet: den ene gjennom W med likevekten E i seks og tolv, den andre gjennom W-merket med likevekten E-merket som sammenfaller med W-merket. Diagonalen fra As origo til Bs origo er stiplet og merket kontraktkurven, og både E og E-merket ligger på den.">
