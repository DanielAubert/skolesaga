<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Vannrett tilbudskurve ved konstant skalautbytte. Mengden y på den vannrette aksen, prisen p på den loddrette. En vannrett linje ved enhetskostnaden tolv strekker seg mot høyre og er merket tilbud. Under linja står tilbud lik null, på linja står at bedriften er likegyldig, og over linja står ubegrenset tilbud. En fallende etterspørselskurve krysser den vannrette tilbudslinja i punktet E, med en stiplet hjelpelinje ned til likevektsmengden. En merknad sier at prisen bestemmes fra kostnadssiden, mens etterspørselen bare bestemmer mengden.">
