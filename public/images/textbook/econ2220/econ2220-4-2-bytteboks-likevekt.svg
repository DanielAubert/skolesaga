<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Markedslikevekt i bytteboksen mellom to hyttenaboer. Boksen er seks sekker ved bred og tjue enheter strøm høy. Beholdningspunktet W med to sekker ved og tolv enheter strøm til A ligger oppe til venstre. Den felles budsjettlinja gjennom W har helning minus to. Likevektsallokeringen E med fire sekker ved og åtte enheter strøm til A ligger nede til høyre for W på samme linje. Der tangerer As og Bs indifferenskurve både hverandre og budsjettlinja. Stiplede hjelpelinjer går fra E ned til fire på nedre kant og bort til åtte på venstre kant. En pil langs linja fra W til E viser at A kjøper to sekker ved og betaler fire enheter strøm.">
