<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Effektiv og ineffektiv allokering i samme bytteboks, tolv enheter av vare en bred og atten enheter av vare to høy. Diagonalen fra As origo nede til venstre til Bs origo oppe til høyre er stiplet og merket kontraktkurven. Punktet P med åtte enheter av vare en og tolv av vare to til A ligger på kontraktkurven, og der tangerer As og Bs indifferenskurve hverandre — allokeringen er Pareto-effektiv. Punktet Q med ni og seks til A ligger nede til høyre for kontraktkurven, og der krysser de to kurvene hverandre og avgrenser en skravert linse opp og til venstre. Punktet med åtte og åtte til A er merket inne i linsen.">
