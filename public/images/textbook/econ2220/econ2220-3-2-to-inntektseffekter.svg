<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Samme fire linjer som i Slutsky-figuren, men uten indifferenskurver: gammel linje, ny linje gjennom beholdningspunktet W, den stiplede kompenserte linja gjennom A, og en tynn hjelpelinje med den nye helningen og den gamle pengeinntekten. Punktene A ved trettifem kilo, B ved 31,5 kilo, B-strek ved tjueåtte kilo på hjelpelinja og C ved trettifire kilo. Pilen fra B til B-strek er merket ordinær inntektseffekt minus 3,5 kilo, og pilen fra B-strek til C er merket beholdnings-inntektseffekt pluss seks kilo.">
