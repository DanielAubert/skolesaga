<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Kort sikt med sunk kost og nedleggingsgrense, øvingseksamen 3, oppgave to. Mengden y på den vannrette aksen, kroner per enhet på den loddrette. Marginalkostnaden er en rett, stigende linje gjennom origo. Den relevante gjennomsnittskostnaden, som teller variable kostnader pluss den gjenvinnbare husleia, er U-formet med minimum i mengde tre og nivå atten, og marginalkostnadskurven skjærer den nøyaktig der. En stiplet vannrett linje ved atten er merket nedleggingsgrense. Prislinja ved tjuefire er vannrett og skjærer marginalkostnaden ved mengde fire, med en stiplet loddrett linje ned til aksen. Den relevante gjennomsnittskostnaden i mengde fire er atten og syttifem hundredeler. Rektangelet fra mengde null til fire, mellom atten og syttifem hundredeler og tjuefire, er skravert og merket dekningsbidrag lik tjueen.">
