<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Kort sikt med sunk kost og nedleggingsgrense, øvingseksamen 3, oppgave to. Mengden y på den vannrette aksen, kroner per enhet på den loddrette. Marginalkostnaden er en rett, stigende linje gjennom origo. Den relevante gjennomsnittskostnaden, som teller variable kostnader pluss den gjenvinnbare tomteleia, er U-formet med minimum i mengde fire og nivå trettito, og marginalkostnadskurven skjærer den nøyaktig der. En stiplet vannrett linje ved trettito er merket nedleggingsgrense. Prislinja ved førti er vannrett og skjærer marginalkostnaden ved mengde fem, med en stiplet loddrett linje ned til aksen. Den relevante gjennomsnittskostnaden i mengde fem er trettito og åtte tideler. Rektangelet fra mengde null til fem, mellom trettito og åtte tideler og førti, er skravert og merket dekningsbidrag lik trettiseks.">
