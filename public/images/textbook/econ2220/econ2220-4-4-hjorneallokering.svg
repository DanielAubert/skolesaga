<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Hjørneallokeringen der A eier alt. Kvadratisk bytteboks. Allokeringen H ligger i hjørnet oppe til høyre, altså i Bs origo: A får hele totalmengden av begge varer og B ingenting. As indifferenskurve gjennom H berører boksen bare i selve hjørnet og buer utenfor boksen ellers, så hele boksen ligger på As lavere side. Boksen er lett skyggelagt og merket alle andre allokeringer gir A lavere nytte. En pil fra H innover i boksen er merket enhver overføring til B senker A.">
