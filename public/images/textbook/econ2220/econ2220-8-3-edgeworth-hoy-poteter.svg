<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Edgeworth-boksen for de to gårdsbrukene i øvingseksamen 1. Boksen er tolv enheter høy bred og tjuefire enheter poteter høy. As origo ligger nede til venstre, Bs origo oppe til høyre. Beholdningspunktet W med to enheter høy og seksten poteter til A ligger oppe til venstre, med stiplede hjelpelinjer til begge kanter. Den felles budsjettlinja gjennom W har helning minus to. Likevektsallokeringen E med fem enheter høy og ti poteter til A ligger nede til høyre for W på linja; der tangerer As og Bs indifferenskurver hverandre, og kurvene krummer mot hvert sitt origo. Linsen mellom de to kurvene gjennom W er skravert og merket Pareto-forbedringer fra W. Piler viser at A kjøper tre enheter høy og betaler seks poteter.">
