<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Indifferenskart med tre fallende, konvekse kurver som ikke krysser hverandre og som nærmer seg begge akser. Den midterste er merket nyttenivå 6 og går gjennom punktene A, som er fire enheter av vare én og ni av vare to, og B, som er ni av vare én og fire av vare to. Det rette linjestykket mellom A og B ligger over kurven, og midtpunktet M ligger tydelig over kurven, altså på en høyere indifferenskurve. En pil oppover mot høyre er merket høyere nytte.">
