<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Engel-kurven for togbilletter: inntekt i kroner langs den vannrette aksen og antall billetter langs den loddrette. En rett linje gjennom origo stiger med brøken 0,35 delt på 45. Ved inntekt åtte tusen kroner leses 62,2 billetter av, ved tolv tusen kroner 93,3 billetter, begge markert med stiplede hjelpelinjer.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="413.0" y="306.0" font-size="15" fill="#000" font-style="italic">m<tspan font-size="10" dy="4.2" font-style="normal"></tspan></text>
  <text x="54.0" y="25.0" font-size="15" fill="#000" font-style="italic">c<tspan font-size="10" dy="4.2" font-style="normal">1</tspan></text>
  <text x="413.0" y="332.0" font-size="10.5" fill="#666" text-anchor="end">kroner per måned</text>
  <text x="78.0" y="42.0" font-size="10.5" fill="#666">togbilletter</text>
  <line x1="70.0" y1="300.0" x2="382.8" y2="53.8" stroke="#2471a3" stroke-width="2.6"/>
  <line x1="254.0" y1="155.2" x2="254.0" y2="300.0" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="254.0" y1="155.2" x2="70.0" y2="155.2" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="254.0" cy="155.2" r="4" fill="#222"/>
  <text x="254.0" y="316.0" font-size="11" fill="#666" text-anchor="middle">8 000</text>
  <text x="64.0" y="159.2" font-size="11" fill="#666" text-anchor="end">62,2</text>
  <line x1="346.0" y1="82.8" x2="346.0" y2="300.0" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="346.0" y1="82.8" x2="70.0" y2="82.8" stroke="#666" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="346.0" cy="82.8" r="4" fill="#222"/>
  <text x="346.0" y="316.0" font-size="11" fill="#666" text-anchor="middle">12 000</text>
  <text x="64.0" y="86.8" font-size="11" fill="#666" text-anchor="end">93,3</text>
  <text x="293.1" y="114.4" font-size="12.5" fill="#2471a3">Engel-kurven</text>
  <text x="81.5" y="53.3" font-size="11" fill="#222">∂c₁/∂m = a/p₁ = 0,35/45 ≈ 0,0078 &gt; 0</text>
  <text x="81.5" y="71.9" font-size="10" fill="#666">billetter per ekstra krone</text>
  <text x="81.5" y="83.9" font-size="10" fill="#666">— altså et normalt gode.</text>
  <text x="81.5" y="95.9" font-size="10" fill="#666">Linja går gjennom origo:</text>
  <text x="81.5" y="107.9" font-size="10" fill="#666">budsjettandelen står stille.</text>
</svg>
