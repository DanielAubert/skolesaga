<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Tilbudskurven ved avtakende skalautbytte, med sprang. Mengden y på den vannrette aksen, prisen p på den loddrette. Kurven består av tre deler: en loddrett strek langs prisaksen fra null opp til hundre og tjue, som betyr at tilbudet er null; deretter et vannrett sprang bort til punktet N ved mengde tre og pris hundre og tjue; og derfra den rette, stigende linja p lik førti ganger y oppover mot høyre. Punktet N er merket nedleggingspunkt, med stiplede hjelpelinjer til begge akser. En tekstboks noterer at tapet ved drift i dette punktet er nøyaktig lik den sunkne kostnaden.">
  <rect width="440" height="360" fill="#ffffff"/>
  <line x1="70" y1="300" x2="410" y2="300" stroke="#222" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#222" stroke-width="1.6"/>
  <polygon points="410,300 402,296 402,304" fill="#222"/>
  <polygon points="70,30 66,38 74,38" fill="#222"/>
  <text x="416" y="305" font-size="16" font-style="italic">y</text>
  <text x="60" y="26" font-size="16" font-style="italic">p</text>
  <line x1="70.0" y1="300.0" x2="70.0" y2="204.0" stroke="#2471a3" stroke-width="3.0"/>
  <line x1="70.0" y1="204.0" x2="190.8" y2="204.0" stroke="#2471a3" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="190.8" y1="204.0" x2="392.0" y2="44.0" stroke="#2471a3" stroke-width="3.0"/>
  <text x="361.8" y="105.6" font-size="12" fill="#2471a3" font-style="italic">p = 40y</text>
  <line x1="70.0" y1="204.0" x2="190.8" y2="204.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="190.8" y1="204.0" x2="190.8" y2="300.0" stroke="#666" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="190.8" cy="204.0" r="4" fill="#222"/>
  <text x="198.8" y="220.0" font-size="12" fill="#222" font-weight="bold">N = (3, 120)</text>
  <text x="198.8" y="234.0" font-size="11" fill="#222">nedleggingspunkt</text>
  <text x="80.1" y="253.6" font-size="12" fill="#2471a3">tilbud = 0</text>
  <text x="186.8" y="317.0" font-size="12" fill="#666">3</text>
  <text x="38.0" y="208.0" font-size="12" fill="#666">120</text>
  <rect x="214.9" y="60.0" width="148.0" height="44.0" fill="#ffffff" stroke="#666" stroke-width="1.0" opacity="1.0" rx="4"/>
  <text x="222.9" y="77.0" font-size="10" fill="#666">Ved p = 120 er tapet ved</text>
  <text x="222.9" y="91.0" font-size="10" fill="#666">drift lik den sunkne kostnaden.</text>
</svg>
