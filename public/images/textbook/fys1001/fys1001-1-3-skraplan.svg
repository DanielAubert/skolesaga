<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Frilegemediagram for kloss på skråplan med dekomponert tyngde">
  <title>Frilegemediagram for kloss på skråplan med dekomponert tyngde</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker>
  </defs>
  <line x1="62" y1="300" x2="368.0" y2="176.4" stroke="#6b7280" stroke-width="2"/>
  <line x1="62" y1="300" x2="368.0" y2="300" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="368.0" y1="300" x2="368.0" y2="176.4" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 124 300 A 62 62 0 0 0 119.5 276.8" fill="none" stroke="#6b7280" stroke-width="1.2"/>
  <text x="132.0" y="288.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">θ = 22°</text>
  <g transform="translate(221.1,235.7) rotate(-22)"><rect x="-26.0" y="-30" width="52" height="30" fill="none" stroke="#374151" stroke-width="2"/></g>
  <circle cx="215.5" cy="221.8" r="4" fill="#374151"/>
  <line x1="215.5" y1="221.8" x2="215.5" y2="303.8" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="221.5" y="299.8" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="start">G = mg</text>
  <line x1="215.5" y1="221.8" x2="190.8" y2="160.6" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="182.8" y="154.6" font-family="sans-serif" font-size="12" fill="#059669" text-anchor="end">N</text>
  <line x1="215.5" y1="221.8" x2="154.3" y2="197.1" stroke="#b45309" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="158.3" y="189.1" font-family="sans-serif" font-size="12" fill="#b45309" text-anchor="start">R = μN</text>
  <line x1="215.5" y1="221.8" x2="187.0" y2="233.3" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a4)" stroke-dasharray="4 3"/>
  <text x="179.0" y="247.3" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="end">mg sin θ</text>
  <line x1="215.5" y1="221.8" x2="244.0" y2="292.3" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a4)" stroke-dasharray="4 3"/>
  <text x="250.0" y="296.3" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="start">mg cos θ</text>
  <text x="28.0" y="40.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">Klossen sklir nedover, så friksjonen peker oppover langs planet. Tyngden er dekomponert (stiplet).</text>
  <text x="28.0" y="340.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">Akser: langs planet og normalt på planet — aldri vannrett og loddrett</text>
</svg>
