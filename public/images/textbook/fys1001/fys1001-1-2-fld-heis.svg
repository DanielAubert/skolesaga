<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Frilegemediagram for person på badevekt i heis som akselererer oppover">
  <title>Frilegemediagram for person på badevekt i heis som akselererer oppover</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
  </defs>
  <rect x="128" y="40" width="224" height="272" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="140.0" y="62.0" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="normal">heis</text>
  <line x1="240" y1="40" x2="240" y2="16" stroke="#6b7280" stroke-width="2"/>
  <rect x="196" y="276" width="88" height="14" fill="none" stroke="#374151" stroke-width="1.6"/>
  <text x="240.0" y="306.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-style="normal">badevekt</text>
  <circle cx="240" cy="150" r="16" fill="none" stroke="#374151" stroke-width="1.8"/>
  <line x1="240" y1="166" x2="240" y2="228" stroke="#374151" stroke-width="1.8"/>
  <line x1="240" y1="182" x2="216" y2="206" stroke="#374151" stroke-width="1.8"/>
  <line x1="240" y1="182" x2="264" y2="206" stroke="#374151" stroke-width="1.8"/>
  <line x1="240" y1="228" x2="222" y2="276" stroke="#374151" stroke-width="1.8"/>
  <line x1="240" y1="228" x2="258" y2="276" stroke="#374151" stroke-width="1.8"/>
  <circle cx="240.0" cy="200.0" r="4" fill="#374151"/>
  <line x1="240.0" y1="200.0" x2="240.0" y2="262.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="248.0" y="250.0" font-family="sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-style="normal">G = mg</text>
  <line x1="240.0" y1="200.0" x2="240.0" y2="92.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="248.0" y="104.0" font-family="sans-serif" font-size="13" fill="#059669" text-anchor="start" font-style="normal">N (det vekta viser)</text>
  <line x1="384.0" y1="220.0" x2="384.0" y2="140.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="392.0" y="184.0" font-family="sans-serif" font-size="14" fill="#b45309" text-anchor="start" font-style="normal">a</text>
  <text x="368.0" y="250.0" font-family="sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-style="normal">akselerasjon</text>
  <text x="30.0" y="336.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start" font-style="normal">N − G = ma  ⇒  N = m(g + a):  vekta viser mer enn tyngden</text>
</svg>
