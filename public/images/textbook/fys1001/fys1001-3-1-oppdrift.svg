<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Kraftdiagram for et legeme som er helt nedsenket i vaeske. Oppdriften B peker opp, tyngden G peker ned, og snordraget S i snoren opp til fjaervekta peker ogsaa opp. Trykket paa undersiden er stoerre enn paa oversiden.">
  <title>Kraftdiagram for nedsenket legeme: G, B og snordraget S</title>
  <defs>
    <marker id="o-gro" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#059669"/></marker>
    <marker id="o-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="o-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
  </defs>
  <rect x="60" y="80" width="360" height="240" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="110" x2="420" y2="110" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="102" font-family="sans-serif" font-size="12" fill="#2563eb">væskeoverflate, trykk p₀</text>
  <rect x="200" y="180" width="80" height="70" fill="none" stroke="#374151" stroke-width="2.5"/>
  <text x="240" y="222" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">volum V</text>
  <line x1="240" y1="180" x2="240" y2="120" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="240" y1="250" x2="240" y2="316" stroke="#059669" stroke-width="2.6" marker-end="url(#o-gro)"/>
  <text x="250" y="308" font-family="sans-serif" font-size="14" fill="#059669">G = mg</text>
  <line x1="180" y1="180" x2="180" y2="126" stroke="#2563eb" stroke-width="2.6" marker-end="url(#o-bla)"/>
  <text x="112" y="140" font-family="sans-serif" font-size="14" fill="#2563eb">B = ρVg</text>
  <line x1="300" y1="180" x2="300" y2="126" stroke="#6b7280" stroke-width="2.2" marker-end="url(#o-gra)"/>
  <text x="310" y="140" font-family="sans-serif" font-size="14" fill="#374151">S</text>
  <g stroke="#2563eb" stroke-width="1.6">
    <line x1="205" y1="160" x2="205" y2="176"/><line x1="225" y1="160" x2="225" y2="176"/>
    <line x1="255" y1="160" x2="255" y2="176"/><line x1="275" y1="160" x2="275" y2="176"/>
  </g>
  <polygon points="205,178 202,171 208,171" fill="#2563eb"/>
  <polygon points="225,178 222,171 228,171" fill="#2563eb"/>
  <polygon points="255,178 252,171 258,171" fill="#2563eb"/>
  <polygon points="275,178 272,171 278,171" fill="#2563eb"/>
  <text x="330" y="168" font-family="sans-serif" font-size="12" fill="#2563eb">lite trykk ned på oversiden</text>
  <g stroke="#2563eb" stroke-width="2.4">
    <line x1="205" y1="276" x2="205" y2="254"/><line x1="225" y1="276" x2="225" y2="254"/>
    <line x1="255" y1="276" x2="255" y2="254"/><line x1="275" y1="276" x2="275" y2="254"/>
  </g>
  <polygon points="205,252 201,261 209,261" fill="#2563eb"/>
  <polygon points="225,252 221,261 229,261" fill="#2563eb"/>
  <polygon points="255,252 251,261 259,261" fill="#2563eb"/>
  <polygon points="275,252 271,261 279,261" fill="#2563eb"/>
  <text x="330" y="272" font-family="sans-serif" font-size="12" fill="#2563eb">stort trykk opp på undersiden</text>
  <text x="240" y="344" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">Likevekt: S + B = G   ⇒   S = G − B (tilsynelatende vekt)</text>
</svg>
