<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Kasse som dras langs gulvet: snordrag S i vinkel theta over horisontalen, friksjon R bakover, tyngde G ned, normalkraft N opp, forflytning s mot hoyre">
  <title>Kraft- og bevegelsesretning ved arbeid</title>
  <line x1="20" y1="250" x2="460" y2="250" stroke="#6b7280" stroke-width="2"/>
  <g stroke="#6b7280" stroke-width="1">
    <line x1="40" y1="250" x2="28" y2="262"/>
    <line x1="80" y1="250" x2="68" y2="262"/>
    <line x1="120" y1="250" x2="108" y2="262"/>
    <line x1="160" y1="250" x2="148" y2="262"/>
    <line x1="200" y1="250" x2="188" y2="262"/>
    <line x1="240" y1="250" x2="228" y2="262"/>
    <line x1="280" y1="250" x2="268" y2="262"/>
    <line x1="320" y1="250" x2="308" y2="262"/>
    <line x1="360" y1="250" x2="348" y2="262"/>
    <line x1="400" y1="250" x2="388" y2="262"/>
    <line x1="440" y1="250" x2="428" y2="262"/>
  </g>
  <rect x="130" y="196" width="90" height="54" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="175" cy="223" r="3" fill="#374151"/>
  <defs>
    <marker id="a-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="a-rod" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#dc2626"/></marker>
    <marker id="a-gro" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#059669"/></marker>
    <marker id="a-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
  </defs>
  <line x1="175" y1="223" x2="300" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-bla)"/>
  <text x="306" y="132" font-family="sans-serif" font-size="14" fill="#2563eb">S (snordrag)</text>
  <path d="M 235 223 A 60 60 0 0 0 217 181" fill="none" stroke="#2563eb" stroke-width="1.3"/>
  <text x="243" y="205" font-family="sans-serif" font-size="14" fill="#2563eb">θ</text>
  <line x1="175" y1="223" x2="255" y2="223" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="130" y1="223" x2="58" y2="223" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a-rod)"/>
  <text x="52" y="217" font-family="sans-serif" font-size="14" fill="#dc2626" text-anchor="end">R (friksjon)</text>
  <line x1="175" y1="250" x2="175" y2="320" stroke="#059669" stroke-width="2.5" marker-end="url(#a-gro)"/>
  <text x="182" y="316" font-family="sans-serif" font-size="14" fill="#059669">G = mg</text>
  <line x1="145" y1="250" x2="145" y2="180" stroke="#059669" stroke-width="2.5" marker-end="url(#a-gro)"/>
  <text x="118" y="174" font-family="sans-serif" font-size="14" fill="#059669">N</text>
  <line x1="130" y1="290" x2="330" y2="290" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gra)"/>
  <text x="220" y="308" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">forflytning s</text>
  <text x="240" y="40" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">Bare kraftkomponenten LANGS s gjør arbeid</text>
  <text x="240" y="62" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">W = F s cos θ</text>
  <text x="240" y="90" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">S: positivt · R: negativt · G og N: null (θ = 90°)</text>
</svg>
