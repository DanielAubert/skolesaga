  <text x="240" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Vinklene m&#229;les MOT NORMALEN, ikke mot flaten. Snells lov: n&#8321; sin &#952;&#8321; = n&#8322; sin &#952;&#8322;.</text>
  <text x="240" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Inn i et tettere medium: str&#229;len knekker MOT normalen, s&#229; &#952;&#8322; &lt; &#952;&#8321;.</text>
