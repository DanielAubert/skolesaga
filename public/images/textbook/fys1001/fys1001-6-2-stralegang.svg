  <text x="52" y="70" font-family="sans-serif" font-size="13" fill="#374151">luft, n&#8321; = 1,00</text>
  <text x="52" y="308" font-family="sans-serif" font-size="13" fill="#374151">glass, n&#8322; = 1,52</text>

  <line x1="210" y1="60" x2="210" y2="310" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="218" y="74" font-family="sans-serif" font-size="12" fill="#6b7280">normalen</text>

