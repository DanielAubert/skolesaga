<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Flytende kloss i vaeske. Bare en del av volumet, kalt V-nedsenket, ligger under overflaten. Oppdriften B fra det nedsenkede volumet balanserer tyngden G.">
  <title>Flytende legeme: bare det nedsenkede volumet gir oppdrift</title>
  <defs>
    <marker id="fl-gro" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#059669"/></marker>
    <marker id="fl-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="fl-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
  </defs>
  <rect x="50" y="120" width="380" height="200" fill="none" stroke="#374151" stroke-width="2"/>
  <line x1="50" y1="170" x2="430" y2="170" stroke="#2563eb" stroke-width="1.8"/>
  <text x="58" y="162" font-family="sans-serif" font-size="12" fill="#2563eb">væskeoverflate</text>
  <rect x="190" y="130" width="100" height="90" fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="190" y1="170" x2="290" y2="170" stroke="#374151" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="240" y="152" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">over vann</text>
  <text x="240" y="200" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">V nedsenket</text>
  <line x1="330" y1="170" x2="330" y2="220" stroke="#6b7280" stroke-width="1.3" marker-end="url(#fl-gra)"/>
  <line x1="330" y1="220" x2="330" y2="170" stroke="#6b7280" stroke-width="1.3" marker-end="url(#fl-gra)"/>
  <line x1="292" y1="170" x2="336" y2="170" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="292" y1="220" x2="336" y2="220" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="340" y="200" font-family="sans-serif" font-size="13" fill="#374151">dybde d</text>
  <line x1="240" y1="220" x2="240" y2="296" stroke="#059669" stroke-width="2.6" marker-end="url(#fl-gro)"/>
  <text x="250" y="288" font-family="sans-serif" font-size="14" fill="#059669">G = mg</text>
  <line x1="150" y1="200" x2="150" y2="120" stroke="#2563eb" stroke-width="2.6" marker-end="url(#fl-bla)"/>
  <text x="66" y="134" font-family="sans-serif" font-size="14" fill="#2563eb">B = ρ V_neds g</text>
  <text x="240" y="340" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">Flytelikevekt: B = G   ⇒   V_neds / V = ρ_legeme / ρ_væske</text>
</svg>
