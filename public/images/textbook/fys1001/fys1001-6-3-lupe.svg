  <text x="30" y="342" font-family="sans-serif" font-size="12" fill="#6b7280">De stiplede linjene er str&#229;lene forlenget BAKOVER. Bildet ligger p&#229; samme side som objektet:</text>
  <text x="30" y="356" font-family="sans-serif" font-size="12" fill="#6b7280">b er negativ, bildet er rettvendt og forst&#248;rret - og kan ikke fanges p&#229; en skjerm.</text>
