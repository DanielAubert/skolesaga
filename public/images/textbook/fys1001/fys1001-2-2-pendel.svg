<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Pendel med snorlengde L trukket ut vinkelen theta fra loddlinja. Hoydeforskjellen h = L(1 - cos theta) er markert mellom utgangspunktet og bunnpunktet, der farten er storst.">
  <title>Pendel: høydeforskjell og fart i bunnpunktet</title>
  <defs>
    <marker id="p-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
    <marker id="p-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
  </defs>
  <line x1="150" y1="40" x2="330" y2="40" stroke="#374151" stroke-width="3"/>
  <g stroke="#6b7280" stroke-width="1">
    <line x1="160" y1="40" x2="150" y2="30"/><line x1="185" y1="40" x2="175" y2="30"/>
    <line x1="210" y1="40" x2="200" y2="30"/><line x1="235" y1="40" x2="225" y2="30"/>
    <line x1="260" y1="40" x2="250" y2="30"/><line x1="285" y1="40" x2="275" y2="30"/>
    <line x1="310" y1="40" x2="300" y2="30"/>
  </g>
  <line x1="240" y1="40" x2="240" y2="270" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="240" y1="40" x2="92" y2="216" stroke="#374151" stroke-width="2"/>
  <circle cx="92" cy="216" r="13" fill="#2563eb"/>
  <text x="60" y="240" font-family="sans-serif" font-size="13" fill="#2563eb">v = 0</text>
  <circle cx="240" cy="270" r="13" fill="#059669"/>
  <text x="258" y="300" font-family="sans-serif" font-size="13" fill="#059669">v størst her</text>
  <path d="M 240 130 A 90 90 0 0 0 173 106" fill="none" stroke="#374151" stroke-width="1.3"/>
  <text x="207" y="122" font-family="sans-serif" font-size="14" fill="#374151">θ</text>
  <text x="150" y="120" font-family="sans-serif" font-size="14" fill="#374151">L</text>
  <line x1="40" y1="216" x2="40" y2="270" stroke="#6b7280" stroke-width="1.4" marker-end="url(#p-gra)"/>
  <line x1="40" y1="270" x2="40" y2="216" stroke="#6b7280" stroke-width="1.4" marker-end="url(#p-gra)"/>
  <text x="12" y="248" font-family="sans-serif" font-size="14" fill="#374151">h</text>
  <line x1="40" y1="216" x2="88" y2="216" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="40" y1="270" x2="232" y2="270" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="253" y1="270" x2="330" y2="270" stroke="#2563eb" stroke-width="2" marker-end="url(#p-bla)"/>
  <text x="240" y="332" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">h = L(1 − cos θ)  og  v = √(2gh)</text>
</svg>
