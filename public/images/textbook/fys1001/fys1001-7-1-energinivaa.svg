<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Energinivadiagram for hydrogen. Vannrette streker for n=1 til n=5 og ioniseringsgrensen ved 0 eV. To piler peker nedover fra niva 3 til niva 2 og fra niva 4 til niva 2, merket 656 nm og 486 nm.">
  <text x="240" y="24" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Energinivåer i hydrogen</text>
  <!-- y-akse -->
  <line x1="60" y1="48" x2="60" y2="330" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="60,42 56,52 64,52" fill="#6b7280"/>
  <text x="30" y="190" font-size="12" fill="#6b7280" text-anchor="middle" transform="rotate(-90 30 190)">E (eV)</text>
  <!-- niva 0 = ionisert -->
  <line x1="60" y1="60" x2="400" y2="60" stroke="#111827" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="410" y="64" font-size="11.5" fill="#111827">0 eV (ionisert)</text>
  <!-- n=5 -->
  <line x1="60" y1="76" x2="360" y2="76" stroke="#111827" stroke-width="1.8"/>
  <text x="368" y="80" font-size="11" fill="#374151">n = 5   −0,54 eV</text>
  <!-- n=4 -->
  <line x1="60" y1="96" x2="360" y2="96" stroke="#111827" stroke-width="1.8"/>
  <text x="368" y="100" font-size="11" fill="#374151">n = 4   −0,85 eV</text>
  <!-- n=3 -->
  <line x1="60" y1="130" x2="360" y2="130" stroke="#111827" stroke-width="1.8"/>
  <text x="368" y="134" font-size="11" fill="#374151">n = 3   −1,51 eV</text>
  <!-- n=2 -->
  <line x1="60" y1="205" x2="360" y2="205" stroke="#111827" stroke-width="1.8"/>
  <text x="368" y="209" font-size="11" fill="#374151">n = 2   −3,40 eV</text>
  <!-- n=1 -->
  <line x1="60" y1="310" x2="360" y2="310" stroke="#111827" stroke-width="2.2"/>
  <text x="368" y="314" font-size="11" fill="#374151">n = 1   −13,6 eV</text>
  <text x="368" y="328" font-size="10.5" fill="#6b7280">(grunntilstand)</text>
  <!-- overgang 3 -> 2 -->
  <line x1="140" y1="130" x2="140" y2="199" stroke="#c0392b" stroke-width="2.2"/>
  <polygon points="140,205 135,194 145,194" fill="#c0392b"/>
  <text x="148" y="170" font-size="11" fill="#c0392b">3 → 2: 1,89 eV → 656 nm</text>
  <!-- overgang 4 -> 2 -->
  <line x1="100" y1="96" x2="100" y2="199" stroke="#1e6f5c" stroke-width="2.2"/>
  <polygon points="100,205 95,194 105,194" fill="#1e6f5c"/>
  <text x="66" y="90" font-size="11" fill="#1e6f5c">4 → 2: 2,55 eV → 486 nm</text>
  <!-- absorpsjon 1 -> 2 -->
  <line x1="300" y1="310" x2="300" y2="211" stroke="#7d3c98" stroke-width="2.2" stroke-dasharray="5 3"/>
  <polygon points="300,205 295,216 305,216" fill="#7d3c98"/>
  <text x="196" y="288" font-size="11" fill="#7d3c98">absorpsjon 1 → 2: 10,2 eV</text>
</svg>
