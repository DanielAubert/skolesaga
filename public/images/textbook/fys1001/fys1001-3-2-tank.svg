<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Aapen tank med vann. Punkt 1 er paa den store frie overflaten der farten er tilnaermet null og trykket er atmosfaeretrykket. Punkt 2 er i et lite hull i sideveggen en hoeyde H lenger ned, der trykket ogsaa er atmosfaeretrykket og farten er utstroemningsfarten.">
  <title>Torricelli: punktvalg i en åpen tank med hull</title>
  <defs>
    <marker id="t-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="t-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
  </defs>
  <path d="M 70 60 L 70 290 L 290 290 L 290 218" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 290 200 L 290 60" fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="70" y1="90" x2="290" y2="90" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="180" cy="90" r="5" fill="#2563eb"/>
  <text x="120" y="80" font-family="sans-serif" font-size="13" fill="#2563eb">punkt 1: v₁ ≈ 0, p = p₀</text>
  <circle cx="290" cy="209" r="5" fill="#059669"/>
  <text x="300" y="196" font-family="sans-serif" font-size="13" fill="#059669">punkt 2: hull, p = p₀</text>
  <path d="M 296 209 C 340 212, 380 232, 410 278" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#t-bla)"/>
  <text x="356" y="252" font-family="sans-serif" font-size="13" fill="#2563eb">v₂</text>
  <line x1="42" y1="90" x2="42" y2="209" stroke="#6b7280" stroke-width="1.4" marker-end="url(#t-gra)"/>
  <line x1="42" y1="209" x2="42" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#t-gra)"/>
  <text x="18" y="155" font-family="sans-serif" font-size="14" fill="#374151">H</text>
  <line x1="42" y1="90" x2="66" y2="90" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="42" y1="209" x2="286" y2="209" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="240" y="322" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">p₀ + ρgH + 0 = p₀ + 0 + ½ρv₂²   ⇒   v₂ = √(2gH)</text>
  <text x="240" y="344" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Trykkleddene stryker mot hverandre; overflaten er stor, så v₁ ≈ 0.</text>
</svg>
