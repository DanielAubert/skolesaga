<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Fasitfigur: kraftdiagram i toppunktet av en loop med radius 6,5 meter for en person på 60 kilogram">
  <title>Fasitfigur: kraftdiagram i toppunktet av en loop med radius 6,5 meter for en person på 60 kilogram</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker>
  </defs>
  <circle cx="240" cy="170" r="108" fill="none" stroke="#6b7280" stroke-width="2.5"/>
  <circle cx="240.0" cy="170.0" r="3" fill="#6b7280"/>
  <text x="248.0" y="174.0" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="start">sentrum</text>
  <line x1="240.0" y1="70.0" x2="240.0" y2="136.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a4)" stroke-dasharray="5 3"/>
  <text x="246.0" y="118.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="start">positiv radiell retning: mot sentrum</text>
  <rect x="224" y="49" width="32" height="13" fill="none" stroke="#374151" stroke-width="1.8"/>
  <line x1="240.0" y1="62.0" x2="240.0" y2="124.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="246.0" y="102.0" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="start">G = 589 N</text>
  <line x1="206.0" y1="56.0" x2="206.0" y2="102.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="200.0" y="90.0" font-family="sans-serif" font-size="12" fill="#059669" text-anchor="end">N = 334 N</text>
  <text x="260.0" y="42.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">TOPPUNKT</text>
  <text x="90.0" y="42.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">G + N = mv²/r = 923 N</text>
  <rect x="224" y="278" width="32" height="13" fill="none" stroke="#374151" stroke-width="1.8"/>
  <line x1="240.0" y1="278.0" x2="240.0" y2="336.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="246.0" y="322.0" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="start">G = 589 N</text>
  <line x1="206.0" y1="284.0" x2="206.0" y2="232.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="200.0" y="246.0" font-family="sans-serif" font-size="12" fill="#059669" text-anchor="end">N = 1512 N</text>
  <text x="260.0" y="302.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">BUNNPUNKT</text>
  <text x="90.0" y="302.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">N − G = mv²/r = 923 N</text>
  <line x1="348.0" y1="170.0" x2="348.0" y2="118.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="354.0" y="130.0" font-family="sans-serif" font-size="11" fill="#b45309" text-anchor="start">v (tangentielt)</text>
  <text x="20.0" y="26.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">Fasit: samme fart (10 m/s) og samme radius (6,5 m) i topp og bunn — bare fortegnene skifter.</text>
  <text x="20.0" y="348.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">Merk: mv²/r = 923 N er den SAMME i topp og bunn. Det er N som endrer seg dramatisk.</text>
</svg>
