  <text x="196" y="46" font-family="sans-serif" font-size="13" fill="#dc2626">resultant langs diagonalen</text>

  <text x="245" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">side a</text>
  <text x="240" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Kreftene fra A og C er like store og st&#229;r vinkelrett p&#229; hverandre;</text>
  <text x="240" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">diagonalen halverer vinkelen mellom dem, s&#229; resultanten ligger langs diagonalen.</text>
