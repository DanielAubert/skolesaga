<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Energinivadiagram for gassen i prove 7A. Vannrette streker for nivaene minus 8,60, minus 4,30, minus 2,15 og minus 1,20 elektronvolt, og en stiplet linje ved 0 elektronvolt for ioniseringsgrensen. En pil peker nedover fra niva 3 til niva 2 og er merket 2,15 elektronvolt og 577 nanometer.">
  <text x="240" y="24" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Nivåskjema med overgangen 3 → 2</text>
  <line x1="60" y1="48" x2="60" y2="330" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="60,42 56,52 64,52" fill="#6b7280"/>
  <text x="30" y="190" font-size="12" fill="#6b7280" text-anchor="middle" transform="rotate(-90 30 190)">E (eV)</text>
  <line x1="60" y1="60" x2="400" y2="60" stroke="#111827" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="408" y="64" font-size="11.5" fill="#111827">0 eV (ionisert)</text>
  <line x1="60" y1="92" x2="350" y2="92" stroke="#111827" stroke-width="1.8"/>
  <text x="358" y="96" font-size="11" fill="#374151">n = 4   −1,20 eV</text>
  <line x1="60" y1="128" x2="350" y2="128" stroke="#111827" stroke-width="1.8"/>
  <text x="358" y="132" font-size="11" fill="#374151">n = 3   −2,15 eV</text>
  <line x1="60" y1="212" x2="350" y2="212" stroke="#111827" stroke-width="1.8"/>
  <text x="358" y="216" font-size="11" fill="#374151">n = 2   −4,30 eV</text>
  <line x1="60" y1="312" x2="350" y2="312" stroke="#111827" stroke-width="2.2"/>
  <text x="358" y="316" font-size="11" fill="#374151">n = 1   −8,60 eV</text>
  <text x="358" y="330" font-size="10.5" fill="#6b7280">(grunntilstand)</text>
  <line x1="150" y1="128" x2="150" y2="206" stroke="#c0392b" stroke-width="2.4"/>
  <polygon points="150,212 145,201 155,201" fill="#c0392b"/>
  <text x="160" y="166" font-size="11.5" fill="#c0392b">3 → 2: 2,15 eV → 577 nm (gult)</text>
  <text x="66" y="278" font-size="11" fill="#6b7280">Pil nedover = emisjon (foton ut)</text>
</svg>
