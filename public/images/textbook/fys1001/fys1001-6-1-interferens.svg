  <text x="240" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Ganglengdeforskjellen er &#916;l = |l&#8322; &#8722; l&#8321;|.</text>
  <text x="240" y="354" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">&#916;l = n&#955; gir forsterkning; &#916;l = (n + &#189;)&#955; gir utsletting.</text>
