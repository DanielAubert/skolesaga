<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Venturimaaler: vannrett roer med hovedtverrsnitt 12 kvadratcentimeter som snevres til en hals paa 4,0 kvadratcentimeter og utvider seg igjen. To trykkmaalere er koblet til, en i hovedroeret og en i halsen, og de viser en trykkforskjell paa 3,2 kilopascal.">
  <title>Venturimåler med to trykkuttak</title>
  <defs>
    <marker id="v-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
  </defs>
  <path d="M 20 130 L 150 130 L 205 168 L 275 168 L 330 130 L 460 130" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 20 230 L 150 230 L 205 192 L 275 192 L 330 230 L 460 230" fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="85" y1="130" x2="85" y2="230" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="85" cy="180" r="5" fill="#2563eb"/>
  <text x="30" y="262" font-family="sans-serif" font-size="12" fill="#2563eb">punkt 1: A₁ = 12 cm²</text>
  <line x1="240" y1="168" x2="240" y2="192" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="240" cy="180" r="5" fill="#059669"/>
  <text x="188" y="284" font-family="sans-serif" font-size="12" fill="#059669">punkt 2: A₂ = 4,0 cm² (hals)</text>
  <line x1="85" y1="130" x2="85" y2="66" stroke="#374151" stroke-width="2"/>
  <rect x="66" y="46" width="38" height="20" fill="none" stroke="#374151" stroke-width="1.6"/>
  <text x="85" y="61" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle">p₁</text>
  <line x1="240" y1="168" x2="240" y2="96" stroke="#374151" stroke-width="2"/>
  <rect x="221" y="76" width="38" height="20" fill="none" stroke="#374151" stroke-width="1.6"/>
  <text x="240" y="91" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle">p₂</text>
  <line x1="40" y1="180" x2="72" y2="180" stroke="#2563eb" stroke-width="2.2" marker-end="url(#v-bla)"/>
  <text x="240" y="316" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">p₁ − p₂ = 3,2 kPa   ·   A₁v₁ = A₂v₂   ·   p₁ + ½ρv₁² = p₂ + ½ρv₂²</text>
  <text x="240" y="340" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Trykkforskjellen mellom hovedrør og hals gir volumstrømmen.</text>
</svg>
