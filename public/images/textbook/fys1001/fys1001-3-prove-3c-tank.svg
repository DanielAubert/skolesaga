<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Aapen tank med olje. Punkt 1 er paa den frie oljeflaten der farten er tilnaermet null og trykket er atmosfaeretrykket. Punkt 2 er et hull i sideveggen 4,8 meter lenger ned med areal 3,2 kvadratcentimeter, der trykket ogsaa er atmosfaeretrykket.">
  <title>Prøve 3.C: punktvalg for utstrømning fra oljetank</title>
  <defs>
    <marker id="c-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="c-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
  </defs>
  <path d="M 80 55 L 80 292 L 300 292 L 300 222" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 300 204 L 300 55" fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="80" y1="85" x2="300" y2="85" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="190" cy="85" r="5" fill="#2563eb"/>
  <text x="88" y="76" font-family="sans-serif" font-size="12" fill="#2563eb">punkt 1: fri oljeflate, v₁ ≈ 0, p = p₀</text>
  <text x="96" y="150" font-family="sans-serif" font-size="12" fill="#6b7280">olje, ρ = 0,88·10³ kg/m³</text>
  <circle cx="300" cy="213" r="5" fill="#059669"/>
  <text x="310" y="200" font-family="sans-serif" font-size="12" fill="#059669">punkt 2: hull, A = 3,2 cm², p = p₀</text>
  <path d="M 306 213 C 348 216, 386 236, 414 280" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#c-bla)"/>
  <text x="362" y="256" font-family="sans-serif" font-size="13" fill="#2563eb">v₂</text>
  <line x1="52" y1="85" x2="52" y2="213" stroke="#6b7280" stroke-width="1.4" marker-end="url(#c-gra)"/>
  <line x1="52" y1="213" x2="52" y2="85" stroke="#6b7280" stroke-width="1.4" marker-end="url(#c-gra)"/>
  <text x="14" y="153" font-family="sans-serif" font-size="13" fill="#374151">4,8 m</text>
  <line x1="52" y1="85" x2="76" y2="85" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="52" y1="213" x2="296" y2="213" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="240" y="326" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">p₀ + ρgH + 0 = p₀ + 0 + ½ρv₂²   ⇒   v₂ = √(2gH)</text>
  <text x="240" y="346" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Nullnivå i hullet. Trykkleddene er like og stryker; tettheten forkortes bort.</text>
</svg>
