<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img">
  <defs>
    <marker id="apk51" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="240" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#374151">Feltlinjer i en platekondensator</text>

  <rect x="90" y="70" width="300" height="10" fill="#dc2626"/>
  <rect x="90" y="270" width="300" height="10" fill="#2563eb"/>
  <text x="60" y="82" font-family="sans-serif" font-size="16" fill="#991b1b">+</text>
  <text x="60" y="282" font-family="sans-serif" font-size="18" fill="#1d4ed8">&#8722;</text>

  <line x1="120" y1="86" x2="120" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#apk51)"/>
  <line x1="165" y1="86" x2="165" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#apk51)"/>
  <line x1="210" y1="86" x2="210" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#apk51)"/>
  <line x1="255" y1="86" x2="255" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#apk51)"/>
  <line x1="300" y1="86" x2="300" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#apk51)"/>
  <line x1="345" y1="86" x2="345" y2="264" stroke="#2563eb" stroke-width="2" marker-end="url(#apk51)"/>

  <line x1="410" y1="75" x2="410" y2="275" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="405" y1="75" x2="415" y2="75" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="405" y1="275" x2="415" y2="275" stroke="#6b7280" stroke-width="1.5"/>
  <text x="420" y="180" font-family="sans-serif" font-size="14" fill="#374151">d</text>

  <text x="240" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1d4ed8">E = U/d</text>
  <text x="240" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Linjene er parallelle og like tett: feltet er homogent og peker fra pluss mot minus.</text>
  <text x="240" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Ved kantene buer linjene ut (randfelt) - det ser vi bort fra.</text>
