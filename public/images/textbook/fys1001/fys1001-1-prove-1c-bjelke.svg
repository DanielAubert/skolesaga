<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Fasitfigur: bjelke på 3,6 meter opplagret i A og B med en sekk nær høyre ende">
  <title>Fasitfigur: bjelke på 3,6 meter opplagret i A og B med en sekk nær høyre ende</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="70" y="160" width="360" height="12" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="70.0,172 56.0,214 84.0,214" fill="none" stroke="#6b7280" stroke-width="1.8"/>
  <text x="70.0" y="230.0" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">A</text>
  <line x1="70.0" y1="172.0" x2="70.0" y2="128.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="76.0" y="138.0" font-family="sans-serif" font-size="11" fill="#059669" text-anchor="start">96,8 N</text>
  <polygon points="370.0,172 356.0,214 384.0,214" fill="none" stroke="#6b7280" stroke-width="1.8"/>
  <text x="370.0" y="230.0" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">B</text>
  <line x1="370.0" y1="172.0" x2="370.0" y2="128.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="376.0" y="138.0" font-family="sans-serif" font-size="11" fill="#059669" text-anchor="start">570 N</text>
  <line x1="64" y1="218" x2="436" y2="218" stroke="#6b7280" stroke-width="2"/>
  <line x1="250.0" y1="166.0" x2="250.0" y2="228.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="256.0" y="224.0" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="start">G_bjelke = 275 N</text>
  <rect x="364.0" y="126" width="32" height="34" fill="none" stroke="#374151" stroke-width="1.6"/>
  <text x="400.0" y="120.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">sekk 40 kg</text>
  <line x1="380.0" y1="166.0" x2="380.0" y2="254.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="374.0" y="266.0" font-family="sans-serif" font-size="11" fill="#b45309" text-anchor="middle">G_sekk = 392 N</text>
  <line x1="70" y1="256" x2="250.0" y2="256" stroke="#6b7280" stroke-width="1.1"/>
  <text x="160.0" y="252.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1,80 m</text>
  <line x1="70" y1="280" x2="380.0" y2="280" stroke="#6b7280" stroke-width="1.1"/>
  <text x="225.0" y="294.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3,10 m</text>
  <line x1="70" y1="310" x2="370.0" y2="310" stroke="#6b7280" stroke-width="1.1"/>
  <text x="220.0" y="324.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3,00 m (A til B)</text>
  <text x="24.0" y="40.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">Momentpunkt A: N_B · 3,00 m = 275 N · 1,80 m + 392 N · 3,10 m</text>
  <text x="24.0" y="62.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">⇒ N_B = 570 N, og ΣF gir N_A = 667 N − 570 N = 96,8 N</text>
</svg>
