<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Satellitt i sirkelbane rundt jorda: gravitasjonskraften peker mot jordas sentrum, farten er tangentiell">
  <title>Satellitt i sirkelbane rundt jorda: gravitasjonskraften peker mot jordas sentrum, farten er tangentiell</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker>
  </defs>
  <circle cx="190" cy="190" r="52" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="190.0" y="195.0" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">jorda</text>
  <text x="190.0" y="212.0" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="start">masse M</text>
  <circle cx="190" cy="190" r="118" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 5"/>
  <rect x="272.0" y="108.4" width="22" height="18" fill="none" stroke="#374151" stroke-width="1.8"/>
  <text x="299.0" y="105.4" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">satellitt, masse m</text>
  <line x1="283.0" y1="117.4" x2="234.1" y2="155.5" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="228.1" y="173.5" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="start">F = γmM/r²</text>
  <line x1="283.0" y1="117.4" x2="323.6" y2="169.4" stroke="#b45309" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="329.6" y="173.4" font-family="sans-serif" font-size="13" fill="#b45309" text-anchor="start">v</text>
  <line x1="190" y1="190" x2="283.0" y2="117.4" stroke="#6b7280" stroke-width="1.2"/>
  <text x="240.5" y="145.7" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="start">r</text>
  <text x="20.0" y="30.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">Gravitasjonen ER sentripetalkraften: γmM/r² = mv²/r</text>
  <text x="20.0" y="330.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">Massen m forkortes bort: v = √(γM/r). Banefarten avhenger bare av baneradien.</text>
  <text x="20.0" y="350.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">Omløpstid: T = 2πr/v</text>
</svg>
