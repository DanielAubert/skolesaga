<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Fasitfigur: stige mot glatt vegg med krefter og normalarmer inntegnet">
  <title>Fasitfigur: stige mot glatt vegg med krefter og normalarmer inntegnet</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker>
  </defs>
  <line x1="400" y1="40" x2="400" y2="300" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="60" y1="300" x2="400" y2="300" stroke="#6b7280" stroke-width="2.5"/>
  <text x="406.0" y="60.0" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="start">glatt vegg</text>
  <text x="70.0" y="320.0" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="start">gulv med friksjon</text>
  <line x1="320.0" y1="300" x2="400" y2="73.7" stroke="#374151" stroke-width="3"/>
  <text x="260.0" y="294.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">stige, 6,0 m</text>
  <circle cx="360.0" cy="186.9" r="4" fill="#2563eb"/>
  <line x1="360.0" y1="186.9" x2="360.0" y2="248.9" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="366.0" y="242.9" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="start">G = 118 N</text>
  <line x1="400.0" y1="73.7" x2="344.0" y2="73.7" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="338.0" y="65.7" font-family="sans-serif" font-size="11" fill="#059669" text-anchor="end">N_vegg = 20,8 N</text>
  <line x1="320.0" y1="300.0" x2="320.0" y2="238.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="314.0" y="230.0" font-family="sans-serif" font-size="11" fill="#059669" text-anchor="middle">N_gulv = 118 N</text>
  <line x1="320.0" y1="300.0" x2="374.0" y2="300.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="380.0" y="316.0" font-family="sans-serif" font-size="11" fill="#b45309" text-anchor="start">R = 20,8 N</text>
  <line x1="320.0" y1="334" x2="360.0" y2="334" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="340.0" y="350.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1,0 m</text>
  <line x1="294.0" y1="300" x2="294.0" y2="73.7" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="290.0" y="186.9" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="end">5,66 m</text>
  <text x="24.0" y="34.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">Momentpunkt: stigens fot (der N_gulv og R angriper) ⇒ bare G og N_vegg gir moment</text>
  <text x="24.0" y="348.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">ΣM: N_vegg · 5,66 m = G · 1,0 m  ⇒  N_vegg = 20,8 N</text>
