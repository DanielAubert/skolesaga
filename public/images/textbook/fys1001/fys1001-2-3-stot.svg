<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="For- og etter-skisse av et stot i en dimensjon. Over: to vogner med massene m1 og m2 og fartene v1 og v2 for stotet. Under: samme to vogner koblet sammen med felles fart v-merket etter stotet. En pil viser valgt positiv retning mot hoyre.">
  <title>Før og etter støtet, med valgt positiv retning</title>
  <defs>
    <marker id="s-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="s-gro" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#059669"/></marker>
    <marker id="s-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
  </defs>
  <line x1="150" y1="28" x2="330" y2="28" stroke="#6b7280" stroke-width="1.6" marker-end="url(#s-gra)"/>
  <text x="240" y="20" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">positiv retning</text>
  <text x="20" y="72" font-family="sans-serif" font-size="14" fill="#374151" font-weight="bold">FØR</text>
  <line x1="20" y1="130" x2="460" y2="130" stroke="#6b7280" stroke-width="2"/>
  <rect x="70" y="90" width="70" height="40" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="105" y="115" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">m₁</text>
  <line x1="145" y1="78" x2="215" y2="78" stroke="#2563eb" stroke-width="2.5" marker-end="url(#s-bla)"/>
  <text x="180" y="70" font-family="sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">v₁</text>
  <rect x="280" y="90" width="70" height="40" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="315" y="115" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">m₂</text>
  <line x1="355" y1="78" x2="395" y2="78" stroke="#2563eb" stroke-width="2.5" marker-end="url(#s-bla)"/>
  <text x="375" y="70" font-family="sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">v₂</text>
  <text x="240" y="163" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">m₁v₁ + m₂v₂  =  (m₁ + m₂)v′</text>
  <text x="20" y="222" font-family="sans-serif" font-size="14" fill="#374151" font-weight="bold">ETTER</text>
  <line x1="20" y1="280" x2="460" y2="280" stroke="#6b7280" stroke-width="2"/>
  <rect x="180" y="240" width="70" height="40" fill="none" stroke="#374151" stroke-width="2"/>
  <rect x="250" y="240" width="70" height="40" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="215" y="265" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">m₁</text>
  <text x="285" y="265" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">m₂</text>
  <line x1="325" y1="228" x2="380" y2="228" stroke="#059669" stroke-width="2.5" marker-end="url(#s-gro)"/>
  <text x="352" y="220" font-family="sans-serif" font-size="14" fill="#059669" text-anchor="middle">v′</text>
  <text x="240" y="312" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Fullstendig uelastisk støt: legemene følges at etterpå.</text>
  <text x="240" y="332" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Fart mot venstre settes inn med minustegn.</text>
</svg>
