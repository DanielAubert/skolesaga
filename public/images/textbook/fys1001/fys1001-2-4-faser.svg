<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Stotkjeden i tre faser: fase 1 er en buet rampe der kloss A faller hoyden h og faar farten v; fase 2 er selve stotet mot kloss B i ro, der de kobles sammen til farten v-merket; fase 3 er glidestrekningen s paa gulvet der friksjonen stopper dem.">
  <title>Støt-kjeden i tre faser</title>
  <defs>
    <marker id="f-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
    <marker id="f-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="f-rod" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#dc2626"/></marker>
  </defs>
  <path d="M 55 80 C 55 190, 100 240, 175 240 L 450 240" fill="none" stroke="#374151" stroke-width="2.5"/>
  <rect x="42" y="58" width="26" height="22" fill="#2563eb"/>
  <text x="76" y="72" font-family="sans-serif" font-size="13" fill="#2563eb">A, i ro</text>
  <line x1="24" y1="72" x2="24" y2="240" stroke="#6b7280" stroke-width="1.3" marker-end="url(#f-gra)"/>
  <line x1="24" y1="240" x2="24" y2="72" stroke="#6b7280" stroke-width="1.3" marker-end="url(#f-gra)"/>
  <text x="8" y="160" font-family="sans-serif" font-size="14" fill="#374151">h</text>
  <rect x="200" y="218" width="26" height="22" fill="#2563eb"/>
  <line x1="150" y1="212" x2="196" y2="212" stroke="#2563eb" stroke-width="2.2" marker-end="url(#f-bla)"/>
  <text x="172" y="205" font-family="sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">v</text>
  <rect x="240" y="218" width="30" height="22" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="255" y="212" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">B</text>
  <line x1="300" y1="212" x2="350" y2="212" stroke="#059669" stroke-width="2.2" marker-end="url(#f-bla)"/>
  <text x="325" y="205" font-family="sans-serif" font-size="13" fill="#059669" text-anchor="middle">v′</text>
  <line x1="285" y1="268" x2="430" y2="268" stroke="#dc2626" stroke-width="1.8" marker-end="url(#f-rod)"/>
  <text x="358" y="287" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">s (friksjon μ)</text>
  <text x="16" y="316" font-family="sans-serif" font-size="13" fill="#374151">Fase 1: energi   mgh = ½mv²</text>
  <text x="16" y="334" font-family="sans-serif" font-size="13" fill="#374151">Fase 2: bevegelsesmengde   mv = (m+M)v′</text>
  <text x="16" y="352" font-family="sans-serif" font-size="13" fill="#374151">Fase 3: energi   ½(m+M)v′² = μ(m+M)gs</text>
</svg>
