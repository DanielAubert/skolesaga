<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Vannrett roer som snevres inn. Punkt 1 ligger i det brede partiet med tverrsnitt A1, fart v1 og trykk p1. Punkt 2 ligger i det trange partiet med tverrsnitt A2, fart v2 og trykk p2. Farten er stoerst og trykket lavest i det trange partiet.">
  <title>Strømningsskisse: innsnevret rør med punkt 1 og punkt 2</title>
  <defs>
    <marker id="i-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="i-gro" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#059669"/></marker>
  </defs>
  <path d="M 20 110 L 170 110 L 230 152 L 380 152 L 460 152" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 20 210 L 170 210 L 230 188 L 380 188 L 460 188" fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="95" y1="110" x2="95" y2="210" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="60" y="248" font-family="sans-serif" font-size="13" fill="#374151">A₁, v₁, p₁</text>
  <circle cx="95" cy="160" r="5" fill="#2563eb"/>
  <text x="104" y="150" font-family="sans-serif" font-size="13" fill="#2563eb">punkt 1</text>
  <line x1="305" y1="152" x2="305" y2="188" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="305" cy="170" r="5" fill="#059669"/>
  <text x="314" y="140" font-family="sans-serif" font-size="13" fill="#059669">punkt 2</text>
  <text x="280" y="248" font-family="sans-serif" font-size="13" fill="#374151">A₂, v₂, p₂</text>
  <line x1="40" y1="160" x2="80" y2="160" stroke="#2563eb" stroke-width="2.2" marker-end="url(#i-bla)"/>
  <line x1="330" y1="170" x2="430" y2="170" stroke="#059669" stroke-width="2.2" marker-end="url(#i-gro)"/>
  <text x="240" y="286" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">Kontinuitet: A₁v₁ = A₂v₂   ⇒   v₂ &gt; v₁</text>
  <text x="240" y="310" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">Bernoulli (samme høyde): p₁ + ½ρv₁² = p₂ + ½ρv₂²</text>
  <text x="240" y="334" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Størst fart i det trange partiet gir LAVEST trykk der.</text>
</svg>
