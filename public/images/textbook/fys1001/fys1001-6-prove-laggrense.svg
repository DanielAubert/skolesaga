  <text x="240" y="334" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Farten er h&#248;yere i grunnfjellet, s&#229; str&#229;len knekker BORT fra normalen.</text>
  <text x="240" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Grensevinkelen er 37,5&#176;: ved st&#248;rre innfallsvinkler g&#229;r str&#229;len ikke ned i det nedre laget.</text>
