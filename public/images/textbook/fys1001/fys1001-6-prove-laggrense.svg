  <text x="52" y="70" font-family="sans-serif" font-size="13" fill="#374151">sedimentlag: v&#8321; = 2,8 km/s</text>
  <text x="52" y="304" font-family="sans-serif" font-size="13" fill="#374151">grunnfjell: v&#8322; = 4,6 km/s</text>

  <line x1="190" y1="58" x2="190" y2="300" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
