<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Graf av maksimal kinetisk energi til losrevne elektroner mot lysets frekvens. Rett linje som krysser frekvensaksen ved grensefrekvensen 5,6 ganger 10 opphoyd i 14 hertz. Under grensefrekvensen loses ingen elektroner los, uansett lysstyrke. Stigningstallet er Plancks konstant og skjaeringen med energiaksen er minus losrivingsarbeidet.">
  <text x="240" y="24" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Fotoelektrisk effekt: E_k mot frekvens</text>
  <!-- akser -->
  <line x1="70" y1="60" x2="70" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="70,52 66,62 74,62" fill="#6b7280"/>
  <line x1="50" y1="230" x2="430" y2="230" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="438,230 428,226 428,234" fill="#6b7280"/>
  <text x="400" y="252" font-size="12" fill="#6b7280">f (10^14 Hz)</text>
  <text x="86" y="72" font-size="12" fill="#6b7280">E_k (eV)</text>
  <!-- nullpunkt -->
  <text x="60" y="248" font-size="11" fill="#6b7280">0</text>
  <!-- ingen elektroner-sone -->
  <line x1="70" y1="230" x2="210" y2="230" stroke="#c0392b" stroke-width="4"/>
  <text x="76" y="222" font-size="11" fill="#c0392b">ingen elektroner løsrives</text>
  <text x="76" y="208" font-size="11" fill="#c0392b">(uansett lysstyrke)</text>
  <!-- linje over grensefrekvensen -->
  <line x1="210" y1="230" x2="400" y2="110" stroke="#1f4e79" stroke-width="2.6"/>
  <!-- forlengelse under aksen (stiplet) -->
  <line x1="210" y1="230" x2="70" y2="318" stroke="#1f4e79" stroke-width="1.6" stroke-dasharray="5 4"/>
  <!-- grensefrekvens -->
  <circle cx="210" cy="230" r="4.5" fill="#1f4e79"/>
  <line x1="210" y1="230" x2="210" y2="256" stroke="#374151" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="210" y="272" font-size="11.5" fill="#374151" text-anchor="middle">f_0 = 5,6</text>
  <text x="210" y="286" font-size="10.5" fill="#6b7280" text-anchor="middle">grensefrekvens</text>
  <!-- skjaering med y-aksen -->
  <circle cx="70" cy="318" r="4" fill="#7d3c98"/>
  <text x="80" y="336" font-size="11" fill="#7d3c98">skjæring: −W = −2,30 eV</text>
  <!-- stigningstall -->
  <line x1="300" y1="167" x2="360" y2="167" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="360" y1="167" x2="360" y2="129" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="304" y="122" font-size="11" fill="#1f4e79">stigningstall = h</text>
</svg>
