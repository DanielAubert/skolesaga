<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Vannverk med aapent basseng. Punkt 1 er paa vannflaten 18 meter over en vannrett utloepsledning. En maalboeye flyter i bassenget. Punkt 2 er inne i ledningen med diameter 8,0 cm, og punkt 3 er i kranaapningen med diameter 3,0 cm der straalen gaar ut i lufta.">
  <title>Prøve 3.D: vannverket med basseng, ledning og kran</title>
  <defs>
    <marker id="a-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="a-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
  </defs>
  <path d="M 70 50 L 70 248 L 240 248" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 200 50 L 200 230" fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="70" y1="78" x2="200" y2="78" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="120" cy="78" r="5" fill="#2563eb"/>
  <text x="76" y="69" font-family="sans-serif" font-size="12" fill="#2563eb">punkt 1: v₁ ≈ 0, p = p₀</text>
  <rect x="152" y="70" width="22" height="16" fill="none" stroke="#374151" stroke-width="1.6"/>
  <text x="178" y="104" font-family="sans-serif" font-size="11" fill="#374151">målebøye, 6,5 kg</text>
  <path d="M 200 230 L 350 230" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 200 248 L 350 248" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 350 230 L 380 235 L 420 235" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 350 248 L 380 243 L 420 243" fill="none" stroke="#374151" stroke-width="2.5"/>
  <circle cx="275" cy="239" r="5" fill="#059669"/>
  <text x="212" y="276" font-family="sans-serif" font-size="12" fill="#059669">punkt 2: ledning, d = 8,0 cm</text>
  <circle cx="418" cy="239" r="5" fill="#dc2626"/>
  <text x="318" y="298" font-family="sans-serif" font-size="12" fill="#dc2626">punkt 3: kran, d = 3,0 cm, p = p₀</text>
  <line x1="44" y1="78" x2="44" y2="239" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a-gra)"/>
  <line x1="44" y1="239" x2="44" y2="78" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a-gra)"/>
  <text x="6" y="164" font-family="sans-serif" font-size="13" fill="#374151">18 m</text>
  <line x1="44" y1="78" x2="66" y2="78" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="44" y1="239" x2="196" y2="239" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="426" y1="239" x2="462" y2="239" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a-bla)"/>
  <text x="240" y="326" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">Punkt 1 → 3: Torricelli.  Punkt 2: kontinuitet.  Punkt 1 → 2: trykket i ledningen.</text>
  <text x="240" y="346" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Bøyen hører til hydrostatikk-delen: B = G gir fortrengt volum.</text>
</svg>
