<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Aapent fjellreservoar med fri overflate 26 meter over et vannrett utloepsroer. Punkt 1 er paa overflaten der farten er tilnaermet null. Punkt 2 er inne i det brede roeret med diameter 5,0 cm. Punkt 3 er i munnstykket med diameter 2,0 cm, der straalen gaar ut i lufta.">
  <title>Reservoar, rør og munnstykke: tre punkter i strømmen</title>
  <defs>
    <marker id="r-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="r-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
  </defs>
  <path d="M 60 60 L 60 250 L 250 250" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 200 60 L 200 232" fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="60" y1="90" x2="200" y2="90" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="130" cy="90" r="5" fill="#2563eb"/>
  <text x="66" y="80" font-family="sans-serif" font-size="12" fill="#2563eb">punkt 1: v₁ ≈ 0, p = p₀</text>
  <path d="M 200 232 L 360 232" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 200 250 L 360 250" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 360 232 L 392 238 L 430 238" fill="none" stroke="#374151" stroke-width="2.5"/>
  <path d="M 360 250 L 392 244 L 430 244" fill="none" stroke="#374151" stroke-width="2.5"/>
  <circle cx="285" cy="241" r="5" fill="#059669"/>
  <text x="222" y="278" font-family="sans-serif" font-size="12" fill="#059669">punkt 2: rør, d = 5,0 cm</text>
  <circle cx="428" cy="241" r="5" fill="#dc2626"/>
  <text x="330" y="300" font-family="sans-serif" font-size="12" fill="#dc2626">punkt 3: munnstykke, d = 2,0 cm</text>
  <line x1="34" y1="90" x2="34" y2="241" stroke="#6b7280" stroke-width="1.4" marker-end="url(#r-gra)"/>
  <line x1="34" y1="241" x2="34" y2="90" stroke="#6b7280" stroke-width="1.4" marker-end="url(#r-gra)"/>
  <text x="4" y="170" font-family="sans-serif" font-size="13" fill="#374151">26 m</text>
  <line x1="34" y1="90" x2="56" y2="90" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="34" y1="241" x2="196" y2="241" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="436" y1="241" x2="466" y2="241" stroke="#2563eb" stroke-width="2.2" marker-end="url(#r-bla)"/>
  <text x="240" y="326" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">Punkt 1 → punkt 3 gir Torricelli. Punkt 2 finnes med kontinuitet.</text>
  <text x="240" y="346" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Punkt 1 og 3 er åpne mot lufta, så trykkleddene stryker mot hverandre.</text>
</svg>
