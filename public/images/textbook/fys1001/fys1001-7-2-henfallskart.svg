<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Kart over henfallstyper i et rutenett med noytrontall vannrett og protontall loddrett. Fra morkjernen i midten peker en pil to ruter til venstre og to ruter ned for alfahenfall, en pil en rute til venstre og en rute opp for betaminus-henfall, en stiplet pil en rute til hoyre og en rute ned for betapluss-henfall, og en sirkel rundt morkjernen for gammahenfall der verken protontall eller noytrontall endres.">
  <text x="240" y="22" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Hva henfallet gjør med Z og N</text>
  <!-- akser -->
  <line x1="60" y1="300" x2="440" y2="300" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="448,300 438,296 438,304" fill="#6b7280"/>
  <line x1="60" y1="300" x2="60" y2="50" stroke="#6b7280" stroke-width="1.6"/>
  <polygon points="60,42 56,52 64,52" fill="#6b7280"/>
  <text x="392" y="322" font-size="12" fill="#6b7280">N (nøytrontall)</text>
  <text x="24" y="160" font-size="12" fill="#6b7280" text-anchor="middle" transform="rotate(-90 24 160)">Z (protontall)</text>
  <!-- rutenett -->
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="120" y1="60" x2="120" y2="300"/><line x1="180" y1="60" x2="180" y2="300"/>
    <line x1="240" y1="60" x2="240" y2="300"/><line x1="300" y1="60" x2="300" y2="300"/>
    <line x1="360" y1="60" x2="360" y2="300"/>
    <line x1="60" y1="80" x2="420" y2="80"/><line x1="60" y1="130" x2="420" y2="130"/>
    <line x1="60" y1="180" x2="420" y2="180"/><line x1="60" y1="230" x2="420" y2="230"/>
  </g>
  <!-- morkjerne -->
  <circle cx="240" cy="180" r="9" fill="#111827"/>
  <text x="248" y="168" font-size="12" font-weight="bold" fill="#111827">morkjerne (Z, N)</text>
  <!-- alfa: N-2, Z-2 -->
  <line x1="232" y1="188" x2="128" y2="278" stroke="#c0392b" stroke-width="2.4"/>
  <polygon points="120,285 133,281 128,271" fill="#c0392b"/>
  <circle cx="120" cy="280" r="6" fill="#c0392b"/>
  <text x="96" y="303" font-size="11.5" fill="#c0392b" text-anchor="middle">α</text>
  <text x="150" y="252" font-size="11" fill="#c0392b">A − 4, Z − 2</text>
  <!-- beta minus: N-1, Z+1 -->
  <line x1="232" y1="172" x2="188" y2="136" stroke="#1e6f5c" stroke-width="2.4"/>
  <polygon points="180,130 190,132 185,142" fill="#1e6f5c"/>
  <circle cx="180" cy="130" r="6" fill="#1e6f5c"/>
  <text x="86" y="120" font-size="11.5" fill="#1e6f5c">β⁻: A uendret, Z + 1</text>
  <!-- beta pluss (bor kjenne til): N+1, Z-1 -->
  <line x1="249" y1="188" x2="292" y2="224" stroke="#7d3c98" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="300,230 290,228 295,218" fill="#7d3c98"/>
  <circle cx="300" cy="230" r="6" fill="#7d3c98"/>
  <text x="310" y="248" font-size="11" fill="#7d3c98">β⁺: A uendret, Z − 1</text>
  <!-- gamma -->
  <circle cx="240" cy="180" r="20" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-dasharray="4 3"/>
  <text x="252" y="212" font-size="11.5" fill="#b7791f">γ: verken A eller Z endres</text>
</svg>
