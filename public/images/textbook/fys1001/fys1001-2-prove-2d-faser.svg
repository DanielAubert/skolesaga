<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Faseskisse for prove 2.D. Fase 1: vogn A i ro i hoyden 0,60 meter paa en buet skinne. Fase 2: A treffer vogn B i ro nederst og de kobles sammen. Fase 3: de ruller sammen strekningen s med rullemotstand my lik 0,040.">
  <title>Faseskisse for prøve 2.D</title>
  <defs>
    <marker id="d-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
    <marker id="d-bla" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#2563eb"/></marker>
    <marker id="d-gro" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#059669"/></marker>
    <marker id="d-rod" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#dc2626"/></marker>
  </defs>
  <path d="M 60 85 C 60 195, 105 245, 175 245 L 450 245" fill="none" stroke="#374151" stroke-width="2.5"/>
  <rect x="46" y="62" width="28" height="22" fill="#2563eb"/>
  <text x="82" y="76" font-family="sans-serif" font-size="13" fill="#2563eb">A (0,750 kg), i ro</text>
  <line x1="28" y1="74" x2="28" y2="245" stroke="#6b7280" stroke-width="1.3" marker-end="url(#d-gra)"/>
  <line x1="28" y1="245" x2="28" y2="74" stroke="#6b7280" stroke-width="1.3" marker-end="url(#d-gra)"/>
  <text x="2" y="164" font-family="sans-serif" font-size="13" fill="#374151">0,60 m</text>
  <rect x="196" y="223" width="28" height="22" fill="#2563eb"/>
  <line x1="150" y1="215" x2="192" y2="215" stroke="#2563eb" stroke-width="2.2" marker-end="url(#d-bla)"/>
  <text x="170" y="208" font-family="sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">v</text>
  <rect x="238" y="223" width="34" height="22" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="255" y="216" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">B, i ro</text>
  <line x1="300" y1="215" x2="352" y2="215" stroke="#059669" stroke-width="2.2" marker-end="url(#d-gro)"/>
  <text x="326" y="208" font-family="sans-serif" font-size="13" fill="#059669" text-anchor="middle">v′</text>
  <line x1="286" y1="272" x2="430" y2="272" stroke="#dc2626" stroke-width="1.8" marker-end="url(#d-rod)"/>
  <text x="358" y="291" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">s, μ = 0,040</text>
  <text x="14" y="320" font-family="sans-serif" font-size="13" fill="#374151">Fase 1: energi   ·   Fase 2: bevegelsesmengde   ·   Fase 3: energi</text>
  <text x="14" y="342" font-family="sans-serif" font-size="13" fill="#6b7280">B (1,250 kg) står i ro før støtet; vognene kobles sammen med borrelås.</text>
</svg>
