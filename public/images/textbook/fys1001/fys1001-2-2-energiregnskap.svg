<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Energiregnskap: en kule starter i ro i hoyden h paa en buet bane, har full kinetisk energi i bunnen, og bremses av friksjon over strekningen s paa det vannrette partiet">
  <title>Energiregnskap med valgt nullnivå</title>
  <defs>
    <marker id="e-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
    <marker id="e-rod" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#dc2626"/></marker>
  </defs>
  <path d="M 60 70 C 60 190, 110 250, 200 250 L 430 250" fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="30" y1="250" x2="455" y2="250" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="34" y="266" font-family="sans-serif" font-size="12" fill="#6b7280">nullnivå: h = 0</text>
  <circle cx="60" cy="60" r="9" fill="#2563eb"/>
  <text x="76" y="52" font-family="sans-serif" font-size="13" fill="#2563eb">Punkt 1: v₁ = 0</text>
  <text x="76" y="70" font-family="sans-serif" font-size="13" fill="#2563eb">E₁ = mgh</text>
  <line x1="24" y1="60" x2="24" y2="250" stroke="#6b7280" stroke-width="1.4" marker-end="url(#e-gra)"/>
  <line x1="24" y1="250" x2="24" y2="60" stroke="#6b7280" stroke-width="1.4" marker-end="url(#e-gra)"/>
  <text x="10" y="160" font-family="sans-serif" font-size="14" fill="#374151">h</text>
  <circle cx="205" cy="240" r="9" fill="#059669"/>
  <text x="150" y="215" font-family="sans-serif" font-size="13" fill="#059669">Punkt 2: h = 0</text>
  <text x="150" y="233" font-family="sans-serif" font-size="13" fill="#059669">E₂ = ½mv₂²</text>
  <line x1="215" y1="285" x2="400" y2="285" stroke="#dc2626" stroke-width="1.8" marker-end="url(#e-rod)"/>
  <text x="305" y="305" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">friksjonsstrekning s</text>
  <text x="305" y="323" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">lekkasje: R · s</text>
  <text x="240" y="26" font-family="sans-serif" font-size="14" fill="#374151" text-anchor="middle">mgh = ½mv² + R·s</text>
  <text x="240" y="45" font-family="sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">energien du startet med = energien du har igjen + det friksjonen tok</text>
</svg>
