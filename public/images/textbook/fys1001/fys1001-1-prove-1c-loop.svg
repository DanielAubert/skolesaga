<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Fasitfigur: kraftdiagram i toppunktet av en loop med radius 7,5 meter">
  <title>Fasitfigur: kraftdiagram i toppunktet av en loop med radius 7,5 meter</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker>
  </defs>
  <circle cx="240" cy="200" r="104" fill="none" stroke="#6b7280" stroke-width="2.5"/>
  <circle cx="240.0" cy="200.0" r="3" fill="#6b7280"/>
  <text x="248.0" y="204.0" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="start">sentrum</text>
  <line x1="240.0" y1="106.0" x2="240.0" y2="170.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a4)" stroke-dasharray="5 3"/>
  <text x="248.0" y="140.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="start">positiv retning: mot sentrum</text>
  <rect x="220" y="82" width="40" height="14" fill="none" stroke="#374151" stroke-width="1.8"/>
  <text x="266.0" y="78.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">vogn 260 kg, v = 11 m/s</text>
  <line x1="240.0" y1="96.0" x2="240.0" y2="156.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="246.0" y="136.0" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="start">G = 2551 N</text>
  <line x1="200.0" y1="90.0" x2="200.0" y2="138.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="194.0" y="126.0" font-family="sans-serif" font-size="12" fill="#059669" text-anchor="end">N = 1644 N</text>
  <line x1="344.0" y1="200.0" x2="344.0" y2="150.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="350.0" y="162.0" font-family="sans-serif" font-size="11" fill="#b45309" text-anchor="start">v (tangentielt)</text>
  <text x="24.0" y="40.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">Toppunkt: både G og N peker mot sentrum ⇒ G + N = mv²/r</text>
  <text x="24.0" y="340.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">mv²/r = 4195 N  ⇒  N = 4195 N − 2551 N = 1644 N</text>
</svg>
