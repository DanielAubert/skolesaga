    </marker>
  </defs>
  <text x="240" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#374151">Fra tett til tynt medium: tre str&#229;ler, tre utfall</text>

  <rect x="40" y="45" width="400" height="105" fill="#f9fafb"/>
  <rect x="40" y="150" width="400" height="140" fill="#dbeafe"/>
  <line x1="40" y1="150" x2="440" y2="150" stroke="#374151" stroke-width="2.5"/>
  <text x="52" y="68" font-family="sans-serif" font-size="13" fill="#374151">luft (tynt), n&#8322; = 1,00</text>
  <text x="52" y="278" font-family="sans-serif" font-size="13" fill="#374151">glass (tett), n&#8321; = 1,52</text>

  <line x1="150" y1="60" x2="150" y2="280" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="250" y1="60" x2="250" y2="280" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="350" y1="60" x2="350" y2="280" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>

  <line x1="110" y1="250" x2="147" y2="154" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="150" y1="150" x2="212" y2="66" stroke="#2563eb" stroke-width="2.4" marker-end="url(#at62)"/>
  <text x="118" y="196" font-family="sans-serif" font-size="12" fill="#2563eb">&#952; &lt; &#952;c</text>
  <text x="180" y="90" font-family="sans-serif" font-size="12" fill="#2563eb">brytes ut</text>

  <line x1="188" y1="256" x2="247" y2="154" stroke="#047857" stroke-width="2.4"/>
  <line x1="250" y1="150" x2="330" y2="150" stroke="#047857" stroke-width="2.4" marker-end="url(#at62g)"/>
  <text x="196" y="200" font-family="sans-serif" font-size="12" fill="#047857">&#952; = &#952;c</text>
  <text x="266" y="142" font-family="sans-serif" font-size="12" fill="#047857">langs flaten (90&#176;)</text>

  <line x1="286" y1="262" x2="347" y2="154" stroke="#dc2626" stroke-width="2.4"/>
  <line x1="350" y1="150" x2="412" y2="258" stroke="#dc2626" stroke-width="2.4" marker-end="url(#at62r)"/>
  <text x="292" y="206" font-family="sans-serif" font-size="12" fill="#dc2626">&#952; &gt; &#952;c</text>
  <text x="360" y="234" font-family="sans-serif" font-size="12" fill="#dc2626">alt reflekteres</text>

  <text x="240" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Grensevinkelen: sin &#952;c = n&#8322; / n&#8321;. Formelen krever n&#8321; &gt; n&#8322;, alts&#229; tett mot tynt.</text>
  <text x="240" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">G&#229;r str&#229;len fra tynt mot tett, blir n&#8322;/n&#8321; st&#248;rre enn 1 og ligningen har ingen l&#248;sning.</text>
</svg>
