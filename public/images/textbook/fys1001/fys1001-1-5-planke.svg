<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Planke på to bukker med person nær enden, med normalarmer markert">
  <title>Planke på to bukker med person nær enden, med normalarmer markert</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="70" y="150" width="320" height="12" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="134.0,162 118.0,208 150.0,208" fill="none" stroke="#6b7280" stroke-width="1.8"/>
  <text x="134.0" y="224.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">bukk (0.8 m)</text>
  <polygon points="326.0,162 310.0,208 342.0,208" fill="none" stroke="#6b7280" stroke-width="1.8"/>
  <text x="326.0" y="224.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">bukk (3.2 m)</text>
  <line x1="64" y1="216" x2="396" y2="216" stroke="#6b7280" stroke-width="2"/>
  <circle cx="230.0" cy="156.0" r="3" fill="#2563eb"/>
  <line x1="230.0" y1="156.0" x2="230.0" y2="100.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="226.0" y="92.0" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">G_planke = 157 N</text>
  <circle cx="348.4" cy="98" r="10" fill="none" stroke="#374151" stroke-width="1.6"/>
  <line x1="348.4" y1="108" x2="348.4" y2="150" stroke="#374151" stroke-width="1.6"/>
  <line x1="348.4" y1="156.0" x2="348.4" y2="228.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="354.4" y="224.0" font-family="sans-serif" font-size="11" fill="#b45309" text-anchor="start">G_person = 667 N</text>
  <line x1="134.0" y1="162.0" x2="134.0" y2="122.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="140.0" y="130.0" font-family="sans-serif" font-size="12" fill="#059669" text-anchor="start">N₁</text>
  <line x1="326.0" y1="162.0" x2="326.0" y2="122.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="332.0" y="130.0" font-family="sans-serif" font-size="12" fill="#059669" text-anchor="start">N₂</text>
  <line x1="230.0" y1="246" x2="326.0" y2="246" stroke="#6b7280" stroke-width="1.2"/>
  <text x="278.0" y="242.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1,2 m</text>
  <line x1="326.0" y1="262" x2="348.4" y2="262" stroke="#6b7280" stroke-width="1.2"/>
  <text x="359.2" y="274.0" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">x</text>
  <text x="24.0" y="40.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">Momentpunkt: den høyre bukken (der N₂ angriper) — da faller N₂ ut av momentligningen</text>
  <text x="24.0" y="62.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">Ved vippegrensen er N₁ = 0: planken hviler bare på den høyre bukken</text>
