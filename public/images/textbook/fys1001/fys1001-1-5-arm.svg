<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Underarm som holder en manual: bicepskraften virker nær albuen, manualen langt ute">
  <title>Underarm som holder en manual: bicepskraften virker nær albuen, manualen langt ute</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker>
  </defs>
  <line x1="90" y1="150" x2="410" y2="150" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <circle cx="90.0" cy="150.0" r="7" fill="#6b7280"/>
  <text x="82.0" y="172.0" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="end">albuledd</text>
  <text x="82.0" y="188.0" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="end">(momentpunkt)</text>
  <line x1="135.0" y1="150.0" x2="135.0" y2="54.0" stroke="#059669" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="141.0" y="64.0" font-family="sans-serif" font-size="12" fill="#059669" text-anchor="start">F (biceps) = 607 N</text>
  <line x1="90" y1="208" x2="135" y2="208" stroke="#6b7280" stroke-width="1.2"/>
  <text x="112.5" y="224.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4,5 cm</text>
  <line x1="230.6" y1="150.0" x2="230.6" y2="196.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="236.6" y="192.0" font-family="sans-serif" font-size="11" fill="#2563eb" text-anchor="start">G_arm = 14,7 N</text>
  <rect x="376.0" y="154" width="28" height="16" fill="none" stroke="#374151" stroke-width="1.6"/>
  <line x1="390.0" y1="170.0" x2="390.0" y2="236.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#a3)"/>
  <text x="384.0" y="250.0" font-family="sans-serif" font-size="11" fill="#b45309" text-anchor="middle">G_manual = 78,5 N</text>
  <line x1="90" y1="270" x2="390.0" y2="270" stroke="#6b7280" stroke-width="1.2"/>
  <text x="240.0" y="286.0" font-family="sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">32 cm</text>
  <text x="24.0" y="40.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">Kort momentarm (4,5 cm) mot lang momentarm (32 cm)</text>
  <text x="24.0" y="62.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="start">⇒ muskelkraften blir mange ganger manualens tyngde</text>
