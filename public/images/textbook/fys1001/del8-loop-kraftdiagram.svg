<text x="330.0" y="100.0" fill="#6b7280" font-size="13" text-anchor="start">Toppen:</text>
<text x="330.0" y="118.0" fill="#6b7280" font-size="12" text-anchor="start">G + N = mv²/r</text>
<text x="330.0" y="136.0" fill="#6b7280" font-size="12" text-anchor="start">N = 0 gir v = √(gr)</text>
<text x="330.0" y="250.0" fill="#6b7280" font-size="13" text-anchor="start">Bunnen:</text>
<text x="330.0" y="268.0" fill="#6b7280" font-size="12" text-anchor="start">N − G = mv²/r</text>
<text x="206.0" y="172.0" fill="#6b7280" font-size="12" text-anchor="start">r</text>
