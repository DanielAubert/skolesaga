<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Buet betongrampe med hoyde 2,8 meter. Punkt 1 er oeverst der farten er null. Punkt 2 er nederst der nullnivaaet ligger. Videre til hoyre er et flatt dekke med rullemotstand der strekningen s er markert.">
  <title>Oppsett for prøve 2.B: rampe med nullnivå og valgte punkter</title>
  <defs>
    <marker id="b-gra" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#6b7280"/></marker>
    <marker id="b-rod" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><polygon points="0,0 9,3 0,6" fill="#dc2626"/></marker>
  </defs>
  <path d="M 70 70 C 70 195, 115 245, 190 245 L 445 245" fill="none" stroke="#374151" stroke-width="2.5"/>
  <line x1="34" y1="245" x2="460" y2="245" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="36" y="262" font-family="sans-serif" font-size="12" fill="#6b7280">nullnivå (h = 0)</text>
  <circle cx="70" cy="58" r="9" fill="#2563eb"/>
  <text x="86" y="50" font-family="sans-serif" font-size="13" fill="#2563eb">Punkt 1: v₁ = 0, h = 2,8 m</text>
  <circle cx="196" cy="235" r="9" fill="#059669"/>
  <text x="150" y="222" font-family="sans-serif" font-size="13" fill="#059669">Punkt 2: h = 0, v₂ = ?</text>
  <line x1="44" y1="58" x2="44" y2="245" stroke="#6b7280" stroke-width="1.4" marker-end="url(#b-gra)"/>
  <line x1="44" y1="245" x2="44" y2="58" stroke="#6b7280" stroke-width="1.4" marker-end="url(#b-gra)"/>
  <text x="14" y="155" font-family="sans-serif" font-size="14" fill="#374151">2,8 m</text>
  <line x1="215" y1="280" x2="420" y2="280" stroke="#dc2626" stroke-width="1.8" marker-end="url(#b-rod)"/>
  <text x="318" y="299" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">flatt dekke, strekning s</text>
  <text x="318" y="317" font-family="sans-serif" font-size="13" fill="#dc2626" text-anchor="middle">motstand: μ = 0,065</text>
  <text x="240" y="342" font-family="sans-serif" font-size="13" fill="#374151" text-anchor="middle">mgh = ½mv₂² (+ tapsledd)   og   ½mv₂² = μmgs</text>
</svg>
