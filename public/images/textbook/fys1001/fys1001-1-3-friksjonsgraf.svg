<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Graf over friksjonskraft mot påført kraft: hvilefriksjon vokser med påført kraft til maksimum, deretter konstant glidefriksjon">
  <title>Graf over friksjonskraft mot påført kraft: hvilefriksjon vokser med påført kraft til maksimum, deretter konstant glidefriksjon</title>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#059669"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/></marker>
  </defs>
  <line x1="70" y1="300" x2="452" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="452,300 444,296 444,304" fill="#6b7280"/>
  <line x1="70" y1="300" x2="70" y2="40" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="70,40 66,48 74,48" fill="#6b7280"/>
  <text x="450.0" y="322.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="end">påført kraft F</text>
  <text x="62.0" y="52.0" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="end">friksjonskraft R</text>
  <line x1="70" y1="300" x2="250" y2="110" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="250" y1="110" x2="440" y2="136" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="70" y1="110" x2="250" y2="110" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="250" y1="300" x2="250" y2="110" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="250.0" cy="110.0" r="5" fill="#2563eb"/>
  <text x="62.0" y="114.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="end">R_maks</text>
  <text x="250.0" y="318.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="middle">legemet begynner å gli</text>
  <text x="120.0" y="200.0" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="start">hvilefriksjon:</text>
  <text x="120.0" y="218.0" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="start">R = F (vokser)</text>
  <text x="320.0" y="100.0" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="start">glidefriksjon:</text>
  <text x="320.0" y="118.0" font-family="sans-serif" font-size="12" fill="#2563eb" text-anchor="start">R = μN (konstant)</text>
  <text x="28.0" y="340.0" font-family="sans-serif" font-size="11" fill="#374151" text-anchor="start">Så lenge legemet står i ro, tilpasser friksjonen seg. Først når F overstiger R_maks, begynner det å gli.</text>
</svg>
