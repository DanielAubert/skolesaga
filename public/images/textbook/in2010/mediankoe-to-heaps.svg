  <circle cx="180" cy="100" r="16" fill="none" stroke="#8b5cf6" stroke-width="1.9"/>
  <text x="180" y="105" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">14</text>
