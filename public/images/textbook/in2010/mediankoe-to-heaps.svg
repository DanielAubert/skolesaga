  <circle cx="560" cy="100" r="16" fill="none" stroke="#2563eb" stroke-width="1.9"/>
  <text x="560" y="105" fill="#2563eb" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">17</text>
  <circle cx="490" cy="180" r="16" fill="none" stroke="#2563eb" stroke-width="1.9"/>
