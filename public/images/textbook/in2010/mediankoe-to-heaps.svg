  <circle cx="250" cy="180" r="16" fill="none" stroke="#8b5cf6" stroke-width="1.9"/>
  <text x="250" y="185" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">9</text>
  <circle cx="60" cy="260" r="16" fill="none" stroke="#8b5cf6" stroke-width="1.9"/>
  <text x="60" y="265" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">3</text>
  <text x="180" y="320" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="normal">array (indeks fra 0): 14, 12, 9, 3</text>
  <text x="180" y="344" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">toppen = 14 = medianen</text>
