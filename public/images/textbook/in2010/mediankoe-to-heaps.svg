<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 370" width="730" height="370" role="img">
  <text x="360" y="24" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">Mediankøen: to heaps som deler tallene på midten</text>
  <text x="180" y="48" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Nedre halvdel — max-heap</text>
  <text x="560" y="48" fill="#2563eb" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Øvre halvdel — min-heap</text>
  <line x1="169.5" y1="112.0" x2="120.5" y2="168.0" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="190.5" y1="112.0" x2="239.5" y2="168.0" stroke="#9ca3af" stroke-width="1.5"/>
