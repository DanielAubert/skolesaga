<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210">
  <!-- Rettvinklet trekant med sider 3, 4 og 5 -->
  <polygon
    points="60,172 144,172 60,60"
    fill="none"
    stroke="#000"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Rettvinkelsymbol -->
  <path
    d="M 72 172 L 72 160 L 60 160"
    stroke="#000"
    stroke-width="1.5"
    fill="none"
  />

  <!-- Side-labels -->
  <!-- Katet = 3 (bunn, horisontal) -->
  <text x="102" y="192" font-family="serif" font-size="15" font-style="italic" fill="#000" text-anchor="middle">3</text>

  <!-- Katet = 4 (venstre, vertikal) -->
  <text x="42" y="121" font-family="serif" font-size="15" font-style="italic" fill="#000" text-anchor="middle">4</text>

  <!-- Hypotenus = 5 (skraa) -->
  <text x="116" y="110" font-family="serif" font-size="15" font-style="italic" fill="#000" text-anchor="middle">5</text>

  <!-- Utregning -->
  <text x="130" y="205" font-family="serif" font-size="13" fill="#000" text-anchor="middle">
    3&#xB2; + 4&#xB2; = 9 + 16 = 25 = 5&#xB2;
  </text>
</svg>
