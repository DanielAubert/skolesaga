<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><rect width="1600" height="900" fill="#FFFFFF"/><text x="800.0" y="70.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" fill="#15252A" text-anchor="middle" font-weight="bold">Nøytralt eller ledende spørsmål?</text><rect x="130.0" y="160.0" width="640.0" height="560.0" fill="none" stroke="#0F5257" stroke-width="4" rx="18" opacity="1"/><path d="M 174.0,230.0 L 193.5,248.2 L 226.0,209.2" fill="none" stroke="#3A8F5A" stroke-width="8" opacity="1" stroke-linejoin="round" stroke-linecap="round"/><text x="250.0" y="242.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#3A8F5A" text-anchor="start" font-weight="bold">Nøytralt</text><text x="170.0" y="330.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#15252A" text-anchor="start">Hva synes du om</text><text x="170.0" y="372.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#15252A" text-anchor="start">skolematordningen?</text><rect x="180.0" y="430.0" width="36.0" height="36.0" fill="none" stroke="#0F5257" stroke-width="3" rx="6" opacity="1"/><text x="240.0" y="458.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#15252A" text-anchor="start">Svært bra</text><rect x="180.0" y="496.0" width="36.0" height="36.0" fill="none" stroke="#0F5257" stroke-width="3" rx="6" opacity="1"/><text x="240.0" y="524.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#15252A" text-anchor="start">Bra</text><rect x="180.0" y="562.0" width="36.0" height="36.0" fill="none" stroke="#0F5257" stroke-width="3" rx="6" opacity="1"/><text x="240.0" y="590.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#15252A" text-anchor="start">Dårlig</text><rect x="180.0" y="628.0" width="36.0" height="36.0" fill="none" stroke="#0F5257" stroke-width="3" rx="6" opacity="1"/><text x="240.0" y="656.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#15252A" text-anchor="start">Svært dårlig</text><rect x="830.0" y="160.0" width="640.0" height="560.0" fill="none" stroke="#E4572E" stroke-width="4" rx="18" opacity="1"/><line x1="880.0" y1="210.0" x2="920.0" y2="250.0" stroke="#A23E48" stroke-width="8" opacity="1" stroke-linecap="round"/><line x1="880.0" y1="250.0" x2="920.0" y2="210.0" stroke="#A23E48" stroke-width="8" opacity="1" stroke-linecap="round"/><text x="950.0" y="242.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#A23E48" text-anchor="start" font-weight="bold">Ledende</text><text x="870.0" y="330.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#15252A" text-anchor="start">Er du ikke enig i at den dyre</text><text x="870.0" y="372.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#15252A" text-anchor="start">ordningen bør avvikles?</text><text x="870.0" y="470.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#E4572E" text-anchor="start" font-style="italic">«ikke enig», «dyre», «avvikles»</text><text x="1150.0" y="660.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#E4572E" text-anchor="middle" font-weight="bold">ledende ordlyd påvirker svaret</text></svg>