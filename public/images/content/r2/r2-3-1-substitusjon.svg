<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><rect width="1600" height="900" fill="#0A1220"/><text x="800.0" y="70.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" fill="#F2F6FA" text-anchor="middle" font-weight="bold">Substitusjon: variabelskifte</text><text x="330.0" y="300.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" fill="#F2F6FA" text-anchor="start">∫</text><text x="385.0" y="300.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" fill="#FFC23E" text-anchor="start" font-weight="bold">2x</text><text x="465.0" y="300.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" fill="#F2F6FA" text-anchor="start">·</text><text x="500.0" y="300.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" fill="#F2F6FA" text-anchor="start">e</text><text x="528.0" y="282.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#28E0E0" text-anchor="start" font-weight="bold">x²</text><text x="600.0" y="300.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" fill="#F2F6FA" text-anchor="start">dx</text><rect x="488.0" y="238.0" width="105.0" height="78.0" fill="none" stroke="#28E0E0" stroke-width="3.5" rx="10" opacity="1"/><rect x="372.0" y="252.0" width="90.0" height="64.0" fill="none" stroke="#FFC23E" stroke-width="3.5" rx="10" opacity="1"/><text x="540.0" y="210.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#28E0E0" text-anchor="middle" font-weight="bold">u = x²</text><text x="417.0" y="378.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#FFC23E" text-anchor="middle" font-weight="bold">du = 2x dx</text><line x1="760.0" y1="286.0" x2="920.0" y2="286.0" stroke="#F2F6FA" stroke-width="5" opacity="1" stroke-linecap="roun