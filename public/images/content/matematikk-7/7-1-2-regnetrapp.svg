<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><rect width="1600" height="900" fill="#FFFDF5"/><rect x="100.0" y="150.0" width="460.0" height="150.0" fill="#1E6E8C" rx="0" opacity="0.25"/><rect x="100.0" y="150.0" width="460.0" height="150.0" fill="none" stroke="#1E6E8C" stroke-width="5" rx="14" opacity="1"/><text x="330.0" y="238.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#2B2D42" text-anchor="middle" font-weight="bold">1. Parenteser</text><rect x="180.0" y="320.0" width="460.0" height="150.0" fill="#F2762C" rx="0" opacity="0.25"/><rect x="180.0" y="320.0" width="460.0" height="150.0" fill="none" stroke="#F2762C" stroke-width="5" rx="14" opacity="1"/><text x="410.0" y="408.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#2B2D42" text-anchor="middle" font-weight="bold">2. Potenser</text><rect x="260.0" y="490.0" width="460.0" height="150.0" fill="#6AA84F" rx="0" opacity="0.25"/><rect x="260.0" y="490.0" width="460.0" height="150.0" fill="none" stroke="#6AA84F" stroke-width="5" rx="14" opacity="1"/><text x="490.0" y="578.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#2B2D42" text-anchor="middle" font-weight="bold">3. Gange og dele</text><rect x="340.0" y="660.0" width="460.0" height="150.0" fill="#F4B400" rx="0" opacity="0.25"/><rect x="340.0" y="660.0" width="460.0" height="150.0" fill="none" stroke="#F4B400" stroke-width="5" rx="14" opacity="1"/><text x="570.0" y="748.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#2B2D42" text-anchor="middle" font-weight="bold">4. Plusse og trekke fra</text><text x="1180.0" y="220.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" fill="#2B2D42" text-anchor="middle" font-weight="bold">2 + 3 · 4²</text><rect x="1005.0" y="318.0" width="350.0" height="80.0" fill="none" stroke="#F4B400" stroke-width="6" rx="40" opacity="1"/><text x="1180.0" y="370.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" fill="#2B2D42" text-anchor="middle" font-weight="bold">4² = 16</text><rect x="1005.0" y="458.0" width="350.0" height="80.0" fill="none" stroke="#6AA84F" stroke-width="6" rx="40" opacity="1"/><text x="1180.0" y="510.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" fill="#2B2D42" text-anchor="middle" font-weight="bold">3 · 16 = 48</text><rect x="1005.0" y="598.0" width="350.0" height="80.0" fill="none" stroke="#F2762C" stroke-width="6" rx="40" opacity="1"/><text x="1180.0" y="650.0" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" fill="#2B2D42" text-anchor="middle" font-weight="bold">2 + 48 = 50</text></svg>