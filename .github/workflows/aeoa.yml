name: Æøå

# Daniel 06.11.2026: «sveip skolesaga og legg inn samme safegaurde der også». Feller kjente æøå-feilformer
# (scripts/aeoa/kjente-feil.json, fra sveipen 6.11) i kapitler og quizfiler. Kode, matte, slugs og taksonomifelt røres ikke.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  aeoa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Kjente æøå-feilformer
        run: python3 scripts/aeoa/repo-sjekk.py .
      # Daniel 23.11.2026: «Undersøk også aksentene og slikt og rett kontrolleren.» Strippede aksenter/omlyd/ß/ñ i
      # fransk-, tysk- og spanskbøkene (scripts/aeoa/aksent-tabell.json), og æøå-verktøyene skal aldri røre fremmedspråk.
      - name: Aksenter i språkbøkene
        run: python3 scripts/aeoa/aksent-sjekk.py
      - name: Tester for aksentporten og vernet mot fremmedspråk
        run: python3 scripts/aeoa/test_aksent_og_vern.py
